const firebaseConfig = {

  authDomain: "vibesnap-213d4.firebaseapp.com",
  projectId: "vibesnap-213d4",
  storageBucket: "vibesnap-213d4.firebasestorage.app",
  messagingSenderId: "933479938239",
  appId: "1:933479938239:web:d120d7ba99f5665987ae0a",
  measurementId: "G-HP0QL3C8Y"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),storage=firebase.storage();
let currentUser=null,selectedFriend=null,currentStream=null,facingMode="user",currentFilter="none",mediaRecorder=null,recordedChunks=[],currentMediaBlob=null,currentMediaType=null,currentChatUnsubscribe=null;

const googleProvider=new firebase.auth.GoogleAuthProvider();
async function doGoogleLogin(){try{await auth.signInWithPopup(googleProvider)}catch(e){alert(e.message)}}
$("googleLogin").onclick=doGoogleLogin;
$("showPhone").onclick=()=>$("phoneBox").classList.toggle("hidden");
$("sendOTP").onclick=async()=>{const phone=$("phoneNumber").value.trim();if(!phone)return alert("Enter your phone number.");try{if(!window.recaptchaVerifier)window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier("recaptcha-container",{size:"normal"});window.confirmationResult=await auth.signInWithPhoneNumber(phone,window.recaptchaVerifier);alert("OTP sent.")}catch(e){alert(e.message)}};
$("verifyOTP").onclick=async()=>{const code=$("otpCode").value.trim();if(!window.confirmationResult)return alert("Send the OTP first.");try{await window.confirmationResult.confirm(code)}catch(e){alert(e.message)}};

$("requestAccount").onclick=async()=>{const email=prompt("Enter the Gmail address you want to use:");if(email===null)return;const cleanEmail=email.trim().toLowerCase();if(!cleanEmail)return alert("Please enter your email address.");const emailPattern=/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/;if(!emailPattern.test(cleanEmail))return alert("Please enter a valid email address, for example name@gmail.com.");if(!cleanEmail.endsWith("@gmail.com"))return alert("Please use a valid Gmail address ending in @gmail.com.");try{await db.collection("signupRequests").add({email:cleanEmail,createdAt:firebase.firestore.FieldValue.serverTimestamp(),status:"pending"});alert("Your account request has been sent.")}catch(e){alert(e.message)}};

auth.onAuthStateChanged(async user=>{
if(user){currentUser=user;$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");await createProfile();await loadUsers();showPage("camera");startCamera()}
else{currentUser=null;$("loginScreen").classList.remove("hidden");$("app").classList.add("hidden");stopCamera()}
});

async function createProfile(){
const ref=db.collection("users").doc(currentUser.uid),snap=await ref.get();
if(!snap.exists)await ref.set({uid:currentUser.uid,displayName:currentUser.displayName||"VibeSnap User",email:currentUser.email||"",phone:currentUser.phoneNumber||"",photoURL:currentUser.photoURL||"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
$("profileName").textContent=currentUser.displayName||"VibeSnap User";
$("profileEmail").textContent=currentUser.email||currentUser.phoneNumber||"";
$("profileAvatar").textContent=(currentUser.displayName||currentUser.email||"U").charAt(0).toUpperCase();
}

function showPage(page){
["cameraPage","friendsPage","chatPage","profilePage"].forEach(id=>$(id).classList.add("hidden"));
document.querySelectorAll(".navBtn").forEach(btn=>btn.classList.remove("active"));
const map={camera:"cameraPage",friends:"friendsPage",chat:"chatPage",profile:"profilePage"};
$(map[page]).classList.remove("hidden");
document.querySelector('[data-page="'+page+'"]').classList.add("active");
if(page==="camera")startCamera();else stopCamera();
}
document.querySelectorAll(".navBtn").forEach(btn=>btn.onclick=()=>showPage(btn.dataset.page));

async function startCamera(){
stopCamera();
try{currentStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facingMode},audio:true});$("cameraVideo").srcObject=currentStream;applyFilter()}
catch(e){console.error(e);alert("Camera permission is required for VibeSnap Camera.")}
}
function stopCamera(){if(currentStream){currentStream.getTracks().forEach(t=>t.stop());currentStream=null}if($("cameraVideo"))$("cameraVideo").srcObject=null}
$("flipCamera").onclick=()=>{facingMode=facingMode==="user"?"environment":"user";startCamera()};
function applyFilter(){$("cameraVideo").style.filter=filterCSS[currentFilter]}
document.querySelectorAll(".lensItem").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".lensItem").forEach(b=>b.classList.remove("active"));btn.classList.add("active");currentFilter=btn.dataset.filter;applyFilter()});
$("profileQuick").onclick=()=>showPage("profile");
$("addFriendQuick").onclick=()=>showPage("friends");
$("notificationQuick").onclick=()=>alert("No new VibeSnap notifications.");
$("searchQuick").onclick=()=>alert("VibeSnap search is coming soon.");
$("flashQuick").onclick=()=>alert("Flash control will be available on supported cameras.");
$("soundQuick").onclick=()=>alert("Sounds are currently on.");
$("moreCameraTools").onclick=()=>document.querySelector(".lensStrip").classList.toggle("hidden");
$("aiQuick").onclick=()=>alert("Vibe AI is coming soon.");
$("memoriesQuick").onclick=()=>$("galleryBtn").click();

$("captureBtn").onclick=async()=>{
if(!currentStream)await startCamera();
const video=$("cameraVideo"),canvas=document.createElement("canvas");canvas.width=video.videoWidth;canvas.height=video.videoHeight;const ctx=canvas.getContext("2d");ctx.filter=filterCSS[currentFilter];
if(facingMode==="user"){ctx.translate(canvas.width,0);ctx.scale(-1,1)}
ctx.drawImage(video,0,0,canvas.width,canvas.height);
canvas.toBlob(blob=>{currentMediaBlob=blob;currentMediaType="image";$("previewMedia").src=URL.createObjectURL(blob);$("previewMedia").controls=false;$("previewModal").classList.remove("hidden")},"image/jpeg",.92);
};

$("videoModeBtn").onclick=()=>mediaRecorder?stopRecording():startRecording();
function startRecording(){
if(!currentStream)return alert("Camera is not ready.");recordedChunks=[];
try{
const canvas=document.createElement("canvas"),video=$("cameraVideo");canvas.width=video.videoWidth||1280;canvas.height=video.videoHeight||720;const ctx=canvas.getContext("2d");
const drawFrame=()=>{if(!mediaRecorder||mediaRecorder.state!=="recording")return;ctx.filter=filterCSS[currentFilter];if(facingMode==="user"){ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,canvas.width,canvas.height);ctx.restore()}else ctx.drawImage(video,0,0,canvas.width,canvas.height);requestAnimationFrame(drawFrame)};
const videoStream=canvas.captureStream(30);currentStream.getAudioTracks().forEach(t=>videoStream.addTrack(t));
let options={};if(MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus"))options.mimeType="video/webm;codecs=vp9,opus";else if(MediaRecorder.isTypeSupported("video/webm"))options.mimeType="video/webm";
mediaRecorder=new MediaRecorder(videoStream,options);
mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data)};
mediaRecorder.onstop=()=>{const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||"video/webm"});currentMediaBlob=blob;currentMediaType="video";$("previewMedia").src=URL.createObjectURL(blob);$("previewMedia").controls=true;$("previewModal").classList.remove("hidden");mediaRecorder=null;$("videoModeBtn").textContent="🎥";$("videoModeBtn").classList.remove("recording")};
mediaRecorder.start();$("videoModeBtn").textContent="⏹️";$("videoModeBtn").classList.add("recording");drawFrame();
}catch(e){console.error(e);alert("Video recording is not supported on this browser.")}
}
function stopRecording(){if(mediaRecorder&&mediaRecorder.state==="recording")mediaRecorder.stop()}

$("retakeBtn").onclick=()=>{$("previewModal").classList.add("hidden");currentMediaBlob=null;currentMediaType=null;startCamera()};
$("sendMediaBtn").onclick=async()=>{
if(!currentMediaBlob)return;
if(!selectedFriend){const uid=$("recipientSelect").value;if(uid){const snap=await db.collection("users").doc(uid).get();if(snap.exists)selectedFriend={uid:snap.id,...snap.data()}}}
if(!selectedFriend)return alert("Select a friend first.");
try{
$("sendMediaBtn").disabled=true;const chatId=getChatId(currentUser.uid,selectedFriend.uid);await ensureChat(chatId,selectedFriend.uid);
const extension=currentMediaType==="image"?"jpg":"webm",messageRef=db.collection("chats").doc(chatId).collection("messages").doc(),path=`chatMedia/${chatId}/${messageRef.id}.${extension}`,uploadRef=storage.ref().child(path);
await uploadRef.put(currentMediaBlob);const mediaUrl=await uploadRef.getDownloadURL();
await messageRef.set({senderUid:currentUser.uid,receiverUid:selectedFriend.uid,type:currentMediaType,text:"",mediaUrl,storagePath:path,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
$("previewModal").classList.add("hidden");currentMediaBlob=null;alert("Media sent!")
}catch(e){console.error(e);alert("Could not send media: "+e.message)}finally{$("sendMediaBtn").disabled=false}
};
$("galleryBtn").onclick=()=>$("galleryInput").click();
$("galleryInput").onchange=e=>{const file=e.target.files[0];if(!file)return;currentMediaBlob=file;currentMediaType=file.type.startsWith("video")?"video":"image";$("previewMedia").src=URL.createObjectURL(file);$("previewMedia").controls=currentMediaType==="video";$("previewModal").classList.remove("hidden")};

let usersCache=[];
async function loadUsers(){
db.collection("users").onSnapshot(snapshot=>{
usersCache=[];$("usersList").innerHTML="";$("recipientSelect").innerHTML='<option value="">Select friend to send to</option>';
snapshot.forEach(doc=>{if(doc.id===currentUser.uid)return;const user={uid:doc.id,...doc.data()};usersCache.push(user);addUserCard(user);const option=document.createElement("option");option.value=user.uid;option.textContent=user.displayName||user.email||"VibeSnap User";$("recipientSelect").appendChild(option)})
})
}
function avatarHTML(user,cls="rowAvatar"){
const name=user.displayName||user.email||"VibeSnap User";
return user.photoURL?'<div class="'+cls+'"><img src="'+escapeHTML(user.photoURL)+'" alt=""></div>':'<div class="'+cls+'">'+escapeHTML(name.charAt(0).toUpperCase())+'</div>';
}
function addUserCard(user){
const card=document.createElement("div");card.className="userCard";const name=user.displayName||user.email||"VibeSnap User";
card.innerHTML=avatarHTML(user,"avatar")+'<div class="userInfo"><div class="userName">'+escapeHTML(name)+'</div><div class="userEmail">'+escapeHTML(user.email||user.phone||"")+'</div></div><button class="chatOpenBtn">Chat</button>';
card.querySelector(".chatOpenBtn").onclick=()=>openChat(user);$("usersList").appendChild(card);
}
function renderChatList(){
const list=$("chatList");if(!list)return;list.innerHTML="";
usersCache.forEach((user,i)=>{
const row=document.createElement("div");row.className="chatRow";
const name=user.displayName||user.email||user.phone||"VibeSnap User";
const dot=i%3===0?"blueDot":i%3===1?"purpleDot":"blueDot";
row.innerHTML=avatarHTML(user,"rowAvatar")+'<div class="chatRowBody"><div class="chatRowName">'+escapeHTML(name)+'</div><div class="chatRowMeta"><span class="'+dot+'"></span>Start a VibeSnap · tap to chat</div></div><button class="rowAction">▱</button>';
row.onclick=()=>openChat(user);list.appendChild(row);
});
}
$("recipientSelect").onchange=async()=>{const uid=$("recipientSelect").value;selectedFriend=uid?usersCache.find(u=>u.uid===uid):null};

function getChatId(uid1,uid2){return[uid1,uid2].sort().join("_")}
async function ensureChat(chatId,friendUid){await db.collection("chats").doc(chatId).set({members:[currentUser.uid,friendUid],updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}
async function openChat(user){
selectedFriend=user;$("recipientSelect").value=user.uid;$("chatName").textContent=user.displayName||user.email||"VibeSnap User";$("chatAvatar").innerHTML=avatarHTML(user,"rowAvatar");showPage("chat");$("chatConversation").classList.remove("hidden");
const chatId=getChatId(currentUser.uid,user.uid);await ensureChat(chatId,user.uid);loadMessages(chatId);
}
function loadMessages(chatId){
if(currentChatUnsubscribe)currentChatUnsubscribe();
currentChatUnsubscribe=db.collection("chats").doc(chatId).collection("messages").orderBy("createdAt").onSnapshot(snapshot=>{
$("chatMessages").innerHTML="";
snapshot.forEach(doc=>{const message=doc.data(),box=document.createElement("div");box.className="message "+(message.senderUid===currentUser.uid?"mine":"theirs");
if(message.type==="image")box.innerHTML=`<img src="${message.mediaUrl}" alt="Photo">`;else if(message.type==="video")box.innerHTML=`<video src="${message.mediaUrl}" controls></video>`;else box.textContent=message.text||"";
$("chatMessages").appendChild(box)});
$("chatMessages").scrollTop=$("chatMessages").scrollHeight
})
}
$("sendMessage").onclick=sendTextMessage;
$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendTextMessage()});
async function sendTextMessage(){
const text=$("messageInput").value.trim();if(!text||!selectedFriend)return;
try{const chatId=getChatId(currentUser.uid,selectedFriend.uid);await ensureChat(chatId,selectedFriend.uid);await db.collection("chats").doc(chatId).collection("messages").add({senderUid:currentUser.uid,receiverUid:selectedFriend.uid,type:"text",text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});$("messageInput").value=""}catch(e){alert(e.message)}
}
$("backFromChat").onclick=()=>showPage("camera");
$("logoutBtn").onclick=async()=>{stopCamera();if(currentChatUnsubscribe){currentChatUnsubscribe();currentChatUnsubscribe=null}await auth.signOut()};
function escapeHTML(text){return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
</script>
</body>
</html>
