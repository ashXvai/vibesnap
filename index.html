<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeSnap</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
    min-height:100vh;
}

button{
    cursor:pointer;
    border:none;
}

.hidden{
    display:none!important;
}

/* ================= AUTH ================= */

.auth-screen{
    position:fixed;
    inset:0;
    background:#0d0d0d;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.auth-box{
    width:100%;
    max-width:420px;
    background:#151515;
    border:1px solid #292929;
    border-radius:24px;
    padding:35px 25px;
    text-align:center;
}

.auth-logo{
    font-size:42px;
    font-weight:800;
    margin-bottom:5px;
}

.auth-logo span,
.logo span{
    color:#ffd400;
}

.auth-subtitle{
    color:#999;
    margin-bottom:30px;
}

.auth-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:22px;
}

.auth-input{
    width:100%;
    padding:15px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid #333;
    background:#202020;
    color:white;
    outline:none;
    font-size:15px;
}

.auth-input:focus{
    border-color:#ffd400;
}

.auth-button{
    width:100%;
    padding:15px;
    border-radius:12px;
    background:#ffd400;
    color:#111;
    font-size:16px;
    font-weight:bold;
    margin-top:5px;
}

.auth-secondary{
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:12px;
    background:#242424;
    color:white;
}

.auth-message{
    min-height:20px;
    margin-top:15px;
    color:#ffd400;
    font-size:14px;
}

.auth-divider{
    margin:20px 0;
    color:#666;
}

.google-button{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:white;
    color:#111;
    font-weight:bold;
}

.phone-button{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:#242424;
    color:white;
    font-weight:bold;
    margin-top:10px;
}

/* ================= APP ================= */

#app{
    min-height:100vh;
    max-width:600px;
    margin:auto;
}

.screen{
    display:none;
    min-height:calc(100vh - 75px);
    padding-bottom:90px;
}

.screen.active{
    display:block;
}

/* ================= TOP BAR ================= */

.top-bar{
    height:65px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #222;
    background:#101010;
}

.logo{
    font-size:24px;
    font-weight:800;
}

/* ================= CAMERA ================= */

.camera-container{
    position:relative;
    width:100%;
    height:calc(100vh - 75px);
    min-height:550px;
    overflow:hidden;
    background:#050505;
}

#video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
}

.camera-top{
    position:absolute;
    top:20px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.profile-small{
    width:44px;
    height:44px;
    border-radius:50%;
    overflow:hidden;
    background:#ffd400;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
}

.profile-small img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.camera-tools{
    display:flex;
    gap:10px;
}

.camera-tool{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:19px;
}

.filter-bar{
    position:absolute;
    bottom:125px;
    left:0;
    right:0;
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:10px 18px;
}

.filter-button{
    flex-shrink:0;
    padding:9px 15px;
    border-radius:20px;
    background:rgba(0,0,0,.65);
    color:white;
}

.filter-button.active{
    background:#ffd400;
    color:#111;
}

.capture-area{
    position:absolute;
    bottom:35px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
}

.capture-button{
    width:76px;
    height:76px;
    border-radius:50%;
    background:white;
    border:6px solid rgba(255,255,255,.35);
}

/* ================= LISTS ================= */

.section-header{
    padding:20px;
    font-size:26px;
    font-weight:bold;
}

.search-box{
    margin:0 18px 15px;
}

.search-box input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #333;
    background:#202020;
    color:white;
    outline:none;
}

.chat-list,
.friend-list{
    padding:0 15px;
}

.chat-item,
.friend-card{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px;
    border-bottom:1px solid #222;
}

.friend-card{
    background:#171717;
    border:1px solid #252525;
    border-radius:15px;
    margin-bottom:12px;
}

.chat-avatar,
.friend-avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#ffd400;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}

.chat-info,
.friend-info{
    flex:1;
}

.chat-name{
    font-weight:bold;
    margin-bottom:5px;
}

.chat-preview{
    color:#888;
    font-size:13px;
}

.friend-button{
    background:#ffd400;
    color:#111;
    padding:9px 13px;
    border-radius:10px;
    font-weight:bold;
}

/* ================= CHAT WINDOW ================= */

.chat-window{
    position:fixed;
    inset:0;
    background:#0d0d0d;
    z-index:700;
    display:none;
    flex-direction:column;
}

.chat-window.active{
    display:flex;
}

.chat-header{
    height:65px;
    background:#151515;
    border-bottom:1px solid #292929;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 15px;
}

.chat-back{
    background:none;
    color:white;
    font-size:24px;
}

.chat-header-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#ffd400;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.chat-header-name{
    font-weight:bold;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px 15px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.message{
    max-width:78%;
    padding:10px 13px;
    border-radius:16px;
    word-wrap:break-word;
}

.message.mine{
    align-self:flex-end;
    background:#ffd400;
    color:#111;
    border-bottom-right-radius:5px;
}

.message.theirs{
    align-self:flex-start;
    background:#242424;
    color:white;
    border-bottom-left-radius:5px;
}

.message img,
.message video{
    max-width:100%;
    border-radius:12px;
    display:block;
}

.message-time{
    font-size:10px;
    opacity:.6;
    margin-top:4px;
}

.chat-input-area{
    display:flex;
    gap:8px;
    padding:12px;
    background:#151515;
    border-top:1px solid #292929;
}

.chat-input{
    flex:1;
    background:#242424;
    border:1px solid #333;
    color:white;
    padding:13px;
    border-radius:20px;
    outline:none;
}

.chat-media-button,
.chat-send-button{
    width:45px;
    height:45px;
    border-radius:50%;
}

.chat-media-button{
    background:#242424;
    color:white;
}

.chat-send-button{
    background:#ffd400;
    color:#111;
    font-weight:bold;
}

/* ================= PROFILE ================= */

.profile-page{
    text-align:center;
    padding:30px 20px;
}

.profile-avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:10px auto 20px;
    background:#ffd400;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    font-weight:bold;
    overflow:hidden;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    font-size:26px;
    font-weight:bold;
}

.profile-username{
    color:#888;
    margin-top:6px;
}

.logout-button{
    padding:13px 25px;
    border-radius:12px;
    background:#242424;
    color:white;
}

/* ================= NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    max-width:600px;
    margin:auto;
    height:75px;
    background:#111;
    border-top:1px solid #292929;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:500;
}

.nav-button{
    width:65px;
    height:58px;
    background:none;
    color:#777;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:21px;
}

.nav-button span{
    font-size:11px;
}

.nav-button.active{
    color:#ffd400;
}

/* ================= PREVIEW ================= */

.preview-panel{
    position:fixed;
    inset:0;
    background:#000;
    z-index:900;
    display:none;
    flex-direction:column;
}

.preview-panel.active{
    display:flex;
}

.preview-media{
    flex:1;
    width:100%;
    object-fit:contain;
}

.preview-actions{
    display:flex;
    gap:12px;
    padding:20px;
}

.preview-button{
    flex:1;
    padding:15px;
    border-radius:12px;
    font-weight:bold;
}

.retake-button{
    background:#242424;
    color:white;
}

.send-button{
    background:#ffd400;
    color:#111;
}

/* ================= SEND PANEL ================= */

.send-panel{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:950;
    display:none;
    align-items:flex-end;
}

.send-panel.active{
    display:flex;
}

.send-box{
    width:100%;
    background:#171717;
    border-radius:25px 25px 0 0;
    padding:25px;
    max-height:75vh;
    overflow:auto;
}

.send-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.send-friend{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid #292929;
}

.send-friend input{
    margin-left:auto;
    width:20px;
    height:20px;
    accent-color:#ffd400;
}

.send-confirm{
    width:100%;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#ffd400;
    font-weight:bold;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:13px 18px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:2000;
}

.toast.show{
    opacity:1;
}
</style>
</head>

<body>

/* ================= CREATE PROFILE ================= */

async function createUserProfile(user){

    const userRef =
        doc(
            db,
            "users",
            user.uid
        );

    const existing =
        await getDoc(userRef);

    if(!existing.exists()){

        await setDoc(
            userRef,
            {
                uid:user.uid,
                displayName:
                    user.displayName ||
                    "Vibe User",
                username:
                    user.email ?
                    user.email.split("@")[0] :
                    "user" +
                    user.uid.slice(0,6),
                photoURL:
                    user.photoURL || "",
                createdAt:
                    serverTimestamp()
            }
        );

    }

}


/* ================= ACCOUNT REQUEST ================= */

window.requestAccount = async function(){

    const username =
        document
        .getElementById("signupUsername")
        .value
        .trim();

    const email =
        document
        .getElementById("signupEmail")
        .value
        .trim();

    if(username.length < 3){

        document.getElementById(
            "signupMessage"
        ).textContent =
            "Username must be at least 3 characters.";

        return;
    }

    if(!email.endsWith("@gmail.com")){

        document.getElementById(
            "signupMessage"
        ).textContent =
            "Please enter a Gmail address.";

        return;
    }

    try{

        await addDoc(
            collection(
                db,
                "signupRequests"
            ),
            {
                username:username,
                email:email,
                status:"pending",
                createdAt:
                    serverTimestamp()
            }
        );

        document.getElementById(
            "signupMessage"
        ).textContent =
            "Request sent to the owner.";

    }catch(error){

        console.error(error);

        document.getElementById(
            "signupMessage"
        ).textContent =
            error.message;

    }

};


/* ================= AUTH STATE ================= */

onAuthStateChanged(
    auth,
    async user => {

        if(user){

            currentUser = user;

            await createUserProfile(user);

            document
                .getElementById("authScreen")
                .classList.add("hidden");

            document
                .getElementById("app")
                .classList.remove("hidden");

            await loadProfile();

            await loadFriends();

            openScreen("camera");

        }else{

            currentUser = null;

            document
                .getElementById("authScreen")
                .classList.remove("hidden");

            document
                .getElementById("app")
                .classList.add("hidden");

            stopCamera();

        }

    }
);


/* ================= PROFILE ================= */

async function loadProfile(){

    if(!currentUser) return;

    const snap =
        await getDoc(
            doc(
                db,
                "users",
                currentUser.uid
            )
        );

    if(!snap.exists()) return;

    const data = snap.data();

    const name =
        data.displayName ||
        "Vibe User";

    const username =
        data.username ||
        "user";

    document.getElementById(
        "profileName"
    ).textContent=name;

    document.getElementById(
        "profileUsername"
    ).textContent="@"+username;

    const letter =
        username.charAt(0).toUpperCase();

    document.getElementById(
        "profileLetter"
    ).textContent=letter;

    document.getElementById(
        "smallProfileLetter"
    ).textContent=letter;

    if(data.photoURL){

        document.getElementById(
            "profileImage"
        ).src=data.photoURL;

        document.getElementById(
            "profileImage"
        ).style.display="block";

        document.getElementById(
            "profileLetter"
        ).style.display="none";

        document.getElementById(
            "smallProfileImage"
        ).src=data.photoURL;

        document.getElementById(
            "smallProfileImage"
        ).style.display="block";

        document.getElementById(
            "smallProfileLetter"
        ).style.display="none";

    }

}


/* ================= CAMERA ================= */

async function startCamera(){

    try{

        stopCamera();

        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:facingMode
                },

                audio:false

            });

        const video =
            document.getElementById("video");

        video.srcObject=stream;

        video.style.filter=currentFilter;

    }catch(error){

        console.error(error);

        showToast(
            "Camera permission is needed."
        );

    }

}


function stopCamera(){

    if(stream){

        stream.getTracks()
        .forEach(track=>{
            track.stop();
        });

        stream=null;

    }

}


window.switchCamera = async function(){

    facingMode =
        facingMode==="user"
        ? "environment"
        : "user";

    await startCamera();

};


/* ================= FILTERS ================= */

window.setFilter = function(
    filter,
    button
){

    currentFilter=filter;

    document.getElementById(
        "video"
    ).style.filter=filter;

    document
    .querySelectorAll(".filter-button")
    .forEach(btn=>{
        btn.classList.remove("active");
    });

    button.classList.add("active");

};


/* ================= PHOTO ================= */

window.capturePhoto = function(){

    const video =
        document.getElementById("video");

    if(!video.videoWidth){

        showToast(
            "Camera is not ready."
        );

        return;
    }

    const canvas =
        document.createElement("canvas");

    canvas.width=video.videoWidth;

    canvas.height=video.videoHeight;

    const ctx =
        canvas.getContext("2d");

    ctx.filter=currentFilter;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvas.toBlob(
        blob=>{

            currentMedia=blob;

            currentMediaType="image";

            showPreview();

        },
        "image/jpeg",
        .9
    );

};


/* ================= GALLERY ================= */

window.pickMedia = function(){

    document
    .getElementById("mediaInput")
    .click();

};


window.handleMediaPick = function(event){

    const file =
        event.target.files[0];

    if(!file) return;

    currentMedia=file;

    currentMediaType =
        file.type.startsWith("video")
        ? "video"
        : "image";

    showPreview();

    event.target.value="";

};


function showPreview(){

    const panel =
        document.getElementById(
            "previewPanel"
        );

    const image =
        document.getElementById(
            "previewImage"
        );

    const video =
        document.getElementById(
            "previewVideo"
        );

    image.style.display="none";

    video.style.display="none";

    if(currentMediaType==="image"){

        image.src =
            URL.createObjectURL(
                currentMedia
            );

        image.style.display="block";

    }else{

        video.src =
            URL.createObjectURL(
                currentMedia
            );

        video.style.display="block";

    }

    panel.classList.add("active");

}


window.retakeMedia = function(){

    currentMedia=null;

    currentMediaType=null;

    document
    .getElementById("previewPanel")
    .classList.remove("active");

};


/* ================= SEND PANEL ================= */

window.openSendPanel = async function(){

    if(!currentMedia){

        return;
    }

    await loadSendFriends();

    document
    .getElementById("sendPanel")
    .classList.add("active");

};


window.closeSendPanelOutside =
function(event){

    if(
        event.target ===
        document.getElementById("sendPanel")
    ){

        document
        .getElementById("sendPanel")
        .classList.remove("active");

    }

};


/* ================= FRIENDS ================= */

let allFriends=[];

async function loadFriends(){

    if(!currentUser) return;

    const q =
        collection(db,"users");

    onSnapshot(
        q,
        snapshot=>{

            allFriends=[];

            snapshot.forEach(docSnap=>{

                if(
                    docSnap.id !==
                    currentUser.uid
                ){

                    allFriends.push({
                        id:docSnap.id,
                        ...docSnap.data()
                    });

                }

            });

            renderFriends(allFriends);

            renderChats(allFriends);

        }
    );

}


function renderFriends(list){

    const container =
        document.getElementById(
            "friendList"
        );

    container.innerHTML="";

    list.forEach(user=>{

        const card =
            document.createElement("div");

        card.className="friend-card";

        const letter =
            (
                user.username ||
                user.displayName ||
                "U"
            ).charAt(0).toUpperCase();

        card.innerHTML=`

            <div class="friend-avatar">
                ${letter}
            </div>

            <div class="friend-info">

                <b>
                    ${escapeHtml(
                        user.displayName ||
                        user.username ||
                        "User"
                    )}
                </b>

                <div style="color:#888;font-size:13px;">
                    @${escapeHtml(
                        user.username ||
                        "user"
                    )}
                </div>

            </div>

            <button class="friend-button">
                Chat
            </button>
        `;

        card
        .querySelector("button")
        .onclick=()=>openChat(user);

        container.appendChild(card);

    });

}


window.searchFriends=function(){

    const search =
        document
        .getElementById("friendSearch")
        .value
        .toLowerCase();

    const filtered =
        allFriends.filter(user=>{

            const username =
                (
                    user.username ||
                    ""
                ).toLowerCase();

            return username.includes(search);

        });

    renderFriends(filtered);

};


/* ================= SEND FRIENDS ================= */

async function loadSendFriends(){

    const container =
        document.getElementById(
            "sendFriendsList"
        );

    container.innerHTML="";

    allFriends.forEach(user=>{

        const letter =
            (
                user.username ||

            >

window.sendSelectedMedia =
async function(){

    const selected =
        [
            ...document
            .querySelectorAll(
                ".send-checkbox:checked"
            )
        ]
        .map(input=>input.value);

    if(!selected.length){

        showToast(
            "Select a friend."
        );

        return;
    }

    if(!currentMedia){

        return;
    }

    try{

        showToast(
            "Uploading..."
        );

        for(const receiverUid of selected){

            const chatId =
                makeChatId(
                    currentUser.uid,
                    receiverUid
                );

            const messageRef =
                doc(
                    collection(
                        db,
                        "chats",
                        chatId,
                        "messages"
                    )
                );

            const extension =
                currentMediaType==="video"
                ? "mp4"
                : "jpg";

            const path =
                `chatMedia/${chatId}/${messageRef.id}.${extension}`;

            const storageRef =
                ref(
                    storage,
                    path
                );

            await uploadBytes(
                storageRef,
                currentMedia
            );

            const url =
                await getDownloadURL(
                    storageRef
                );

            await setDoc(
                messageRef,
                {
                    senderUid:
                        currentUser.uid,

                    receiverUid:
                        receiverUid,

                    type:
                        currentMediaType,

                    mediaUrl:url,

                    storagePath:path,

                    createdAt:
                        serverTimestamp()
                }
            );

        }

        document
        .getElementById("sendPanel")
        .classList.remove("active");

        document
        .getElementById("previewPanel")
        .classList.remove("active");

        currentMedia=null;

        showToast(
            "Media sent successfully."
        );

    }catch(error){

        console.error(error);

        showToast(
            "Upload failed."
        );

    }

};


/* ================= CHAT ================= */

function makeChatId(a,b){

    return [a,b]
        .sort()
        .join("_");

}


window.openChat=function(user){

    currentChatUser=user;

    document
    .getElementById("chatHeaderName")
    .textContent =
        user.username ||
        user.displayName ||
        "User";

    document
    .getElementById("chatHeaderAvatar")
    .textContent =
        (
            user.username ||
            "U"
        )
        .charAt(0)
        .toUpperCase();

    document
    .getElementById("chatWindow")
    .classList.add("active");

    listenMessages();

};


window.closeChat=function(){

    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages=null;

    }

    document
    .getElementById("chatWindow")
    .classList.remove("active");

    currentChatUser=null;

};


function listenMessages(){

    if(unsubscribeMessages){

        unsubscribeMessages();

    }

    const chatId =
        makeChatId(
            currentUser.uid,
            currentChatUser.id
        );

    const messagesRef =
        collection(
            db,
            "chats",
            chatId,
            "messages"
        );

    const q =
        query(
            messagesRef,
            orderBy(
                "createdAt",
                "asc"
            )
        );

    unsubscribeMessages =
        onSnapshot(
            q,
            snapshot=>{

                const box =
                    document.getElementById(
                        "messages"
                    );

                box.innerHTML="";

                snapshot.forEach(docSnap=>{

                    renderMessage(
                        docSnap.data()
                    );

                });

                box.scrollTop=
                    box.scrollHeight;

            }
        );

}


function renderMessage(data){

    const box =
        document.getElementById(
            "messages"
        );

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (
            data.senderUid ===
            currentUser.uid
            ? "mine"
            : "theirs"
        );

    if(data.type==="text"){

        div.innerHTML =
            escapeHtml(
                data.text || ""
            );

    }else if(data.type==="image"){

        div.innerHTML=`
            <img
                src="${data.mediaUrl}"
                alt="Photo"
            >
        `;

    }else if(data.type==="video"){

        div.innerHTML=`
            <video
                src="${data.mediaUrl}"
                controls
                playsinline
            ></video>
        `;

    }

    box.appendChild(div);

}


/* ================= TEXT MESSAGE ================= */

        }

};


/* ================= CHAT MEDIA ================= */

window.pickChatMedia=function(){

    document
    .getElementById("chatMediaInput")
    .click();

};


window.handleChatMedia =
async function(event){

    const file =
        event.target.files[0];

    if(!file || !currentChatUser){

        return;
    }

    try{

        showToast(
            "Uploading..."
        );

        const chatId =
            makeChatId(
                currentUser.uid,
                currentChatUser.id
            );

        const messageRef =
            doc(
                collection(
                    db,
                    "chats",
                    chatId,
                    "messages"
                )
            );

        const isVideo =
            file.type.startsWith(
                "video/"
            );

        const extension =
            isVideo ? "mp4" : "jpg";

        const path =
            `chatMedia/${chatId}/${messageRef.id}.${extension}`;

        const storageRef =
            ref(
                storage,
                path
            );

        await uploadBytes(
            storageRef,
            file
        );

        const url =
            await getDownloadURL(
                storageRef
            );

        await setDoc(
            messageRef,
            {
                senderUid:
                    currentUser.uid,

                receiverUid:
                    currentChatUser.id,

                type:

        );

        console.error(error);

        showToast(

        );

};


/* ================= CHATS ================= */

        document.getElementById(
            "chatList"
        );

    container.innerHTML="";

    users.forEach(user=>{

        const item =
            document.createElement("div");

        item.className="chat-item";

                        user.displayName ||
                        "User"

                </div>

window.searchChats=function(){

    const search =
        document
        .getElementById(
            "chatSearch"
        )
        .value
        .toLowerCase();

    const filtered =
        allFriends.filter(user=>{

            return (
                user.username ||

            )
            .toLowerCase()

        });

    renderChats(filtered);

/* ================= NAVIGATION ================= */

window.openScreen=function(screen){

    document
    .querySelectorAll(".screen")
    .forEach(section=>{
        section.classList.remove(
            "active"
        );
    });

    document
    .getElementById(
        screen+"Screen"
    )
    .classList.add("active");

    document
    .querySelectorAll(".nav-button")
    .forEach(button=>{
        button.classList.remove(
            "active"
        );
    });

    const nav =
        document.getElementById(
            "nav" +
            screen
            .charAt(0)
            .toUpperCase() +
            screen.slice(1)
        );

    if(nav){
        nav.classList.add("active");
    }

    if(screen==="camera"){

        startCamera();

    }else{

        stopCamera();

    }

};


/* ================= LOGOUT ================= */

window.logoutUser=async function(){

    stopCamera();

    await signOut(auth);

};


/* ================= SECURITY HTML ================= */

function escapeHtml(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
