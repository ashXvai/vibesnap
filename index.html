<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeSnap</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
    min-height:100vh;
}

button{
    cursor:pointer;
    border:none;
}

.hidden{
    display:none!important;
}

/* AUTH */

.auth-screen{
    position:fixed;
    inset:0;
    background:#0d0d0d;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.auth-box{
    width:100%;
    max-width:430px;
    background:#151515;
    border:1px solid #292929;
    border-radius:24px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.auth-logo{
    font-size:42px;
    font-weight:800;
    margin-bottom:5px;
}

.auth-logo span,
.logo span{
    color:#ffd400;
}

.auth-subtitle{
    color:#999;
    margin-bottom:30px;
}

.auth-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:22px;
}

.auth-input{
    width:100%;
    padding:15px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid #333;
    background:#202020;
    color:white;
    outline:none;
    font-size:15px;
}

.auth-input:focus{
    border-color:#ffd400;
}

.auth-button{
    width:100%;
    padding:15px;
    border-radius:12px;
    background:#ffd400;
    color:#111;
    font-size:16px;
    font-weight:bold;
    margin-top:5px;
}

.auth-secondary{
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:12px;
    background:#242424;
    color:white;
    font-size:14px;
}

.auth-message{
    min-height:20px;
    margin-top:15px;
    color:#ffcc00;
    font-size:14px;
    line-height:1.5;
}

.auth-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0;
    color:#666;
    font-size:12px;
}

.auth-divider:before,
.auth-divider:after{
    content:"";
    height:1px;
    background:#333;
    flex:1;
}

/* APP */

#app{
    min-height:100vh;
}

.screen{
    display:none;
    min-height:calc(100vh - 75px);
    padding-bottom:90px;
}

.screen.active{
    display:block;
}

/* TOP */

.top-bar{
    height:65px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #222;
    background:#101010;
}

.logo{
    font-size:24px;
    font-weight:800;
}

/* CAMERA */

.camera-container{
    position:relative;
    width:100%;
    height:calc(100vh - 75px);
    min-height:500px;
    overflow:hidden;
    background:#050505;
}

#video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
}

.camera-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.camera-top{
    position:absolute;
    top:20px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:auto;
}

.profile-small{
    width:44px;
    height:44px;
    border-radius:50%;
    overflow:hidden;
    background:#ffd400;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
}

.profile-small img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.camera-tools{
    display:flex;
    gap:10px;
}

.camera-tool{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:19px;
}

.filter-bar{
    position:absolute;
    bottom:145px;
    left:0;
    right:0;
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:10px 18px;
}

.filter-button{
    flex-shrink:0;
    padding:9px 15px;
    border-radius:20px;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:13px;
}

.filter-button.active{
    background:#ffd400;
    color:#111;
}

.capture-area{
    position:absolute;
    bottom:25px;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    pointer-events:auto;
}

.capture-button{
    width:76px;
    height:76px;
    border-radius:50%;
    background:white;
    border:6px solid rgba(255,255,255,.35);
}

.capture-button.recording{
    background:#ff3030;
    border-color:rgba(255,255,255,.6);
    transform:scale(.9);
}

.gallery-button{
    width:50px;
    height:50px;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:22px;
}

.record-label{
    position:absolute;
    bottom:105px;
    left:0;
    right:0;
    text-align:center;
    color:white;
    font-size:13px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}

/* CHAT */

.section-header{
    padding:20px;
    font-size:26px;
    font-weight:bold;
}

.search-box{
    margin:0 18px 15px;
}

.search-box input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #333;
    background:#202020;
    color:white;
    outline:none;
}

.chat-list{
    padding:0 15px;
}

.chat-item{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px 5px;
    border-bottom:1px solid #222;
}

.chat-avatar,
.friend-avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#ffd400;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:20px;
    overflow:hidden;
    flex-shrink:0;
}

.chat-avatar img,
.friend-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.chat-info{
    flex:1;
}

.chat-name{
    font-weight:bold;
    margin-bottom:5px;
}

.chat-preview{
    color:#888;
    font-size:13px;
}

/* FRIENDS */

.friend-list{
    padding:0 18px;
}

.friend-card{
    background:#171717;
    border:1px solid #252525;
    border-radius:15px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
}

.friend-info{
    flex:1;
}

.friend-button{
    background:#ffd400;
    color:#111;
    padding:9px 13px;
    border-radius:10px;
    font-weight:bold;
}

/* PROFILE */

.profile-page{
    text-align:center;
    padding:30px 20px;
}

.profile-avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:10px auto 20px;
    background:#ffd400;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    font-weight:bold;
    overflow:hidden;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    font-size:26px;
    font-weight:bold;
}

.profile-username{
    color:#888;
    margin-top:6px;
}

.profile-provider{
    color:#666;
    margin-top:8px;
    font-size:13px;
}

.profile-stats{
    display:flex;
    justify-content:center;
    gap:45px;
    margin:30px 0;
}

.stat-number{
    font-size:22px;
    font-weight:bold;
}

.stat-label{
    color:#888;
    font-size:13px;
    margin-top:4px;
}

.logout-button{
    padding:13px 25px;
    border-radius:12px;
    background:#242424;
    color:white;
}

/* NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:75px;
    background:#111;
    border-top:1px solid #292929;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:500;
}

.nav-button{
    width:65px;
    height:58px;
    background:none;
    color:#777;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:21px;
}

.nav-button span{
    font-size:11px;
}

.nav-button.active{
    color:#ffd400;
}

/* PREVIEW */

.preview-panel{
    position:fixed;
    inset:0;
    background:#000;
    z-index:900;
    display:none;
    flex-direction:column;
}

.preview-panel.active{
    display:flex;
}

.preview-media{
    flex:1;
    width:100%;
    min-height:0;
    object-fit:contain;
    background:#000;
}

.preview-actions{
    display:flex;
    gap:12px;
    padding:20px;
}

.preview-button{
    flex:1;
    padding:15px;
    border-radius:12px;
    font-weight:bold;
}

.retake-button{
    background:#242424;
    color:white;
}

.send-button{
    background:#ffd400;
    color:#111;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:13px 18px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:2000;
    white-space:nowrap;
    max-width:90%;
}

.toast.show{
    opacity:1;
}

@media(max-width:600px){
    .auth-box{
        padding:30px 20px;
    }

    .camera-container{
        min-height:calc(100vh - 75px);
    }
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authScreen" class="auth-screen">

    <div class="auth-box">

        <div class="auth-logo">
            Vibe<span>Snap</span>
        </div>

        <p class="auth-subtitle">
            Connect. Share. Vibe.
        </p>

        <div id="authButtons">

            <div class="auth-title">
                Sign in to VibeSnap
            </div>

            <button
                class="auth-button"
                onclick="loginWithGoogle()">
                Continue with Google
            </button>

            <div class="auth-divider">OR</div>

            <input
                id="phoneNumber"
                class="auth-input"
                type="tel"
                placeholder="+91 9876543210">

            <button
                class="auth-secondary"
                onclick="sendPhoneCode()">
                Continue with Phone OTP
            </button>

            <div
                id="recaptcha-container"
                style="margin-top:15px;">
            </div>

            <p
                id="authMessage"
                class="auth-message">
            </p>

        </div>

        <div id="otpBox" style="display:none;">

            <div class="auth-title">
                Enter verification code
            </div>

            <input
                id="phoneCode"
                class="auth-input"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="6-digit code">

            <button
                class="auth-button"
                onclick="verifyPhoneCode()">
                Verify Code
            </button>

            <button
                class="auth-secondary"
                onclick="backToAuth()">
                Back
            </button>

            <p
                id="otpMessage"
                class="auth-message">
            </p>

        </div>

    </div>
</section>


<!-- APP -->

<div id="app" class="hidden">

    <!-- CAMERA -->

    <section id="cameraScreen" class="screen active">

        <div class="camera-container">

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <div class="camera-overlay">

                <div class="camera-top">

                    <div
                        class="profile-small"
                        onclick="openScreen('profile')">

                        <span id="smallProfileLetter">V</span>

                        <img
                            id="smallProfileImage"
                            style="display:none"
                            alt="Profile">

                    </div>

                    <div class="camera-tools">

                        <button
                            class="camera-tool"
                            onclick="switchCamera()">
                            🔄
                        </button>

                    </div>
                </div>


                <div class="filter-bar">

                    <button
                        class="filter-button active"
                        onclick="setFilter('none',this)">
                        Normal
                    </button>

                    <button
                        class="filter-button"
                        onclick="setFilter('grayscale(1)',this)">
                        B&W
                    </button>

                    <button
                        class="filter-button"
                        onclick="setFilter('sepia(1)',this)">
                        Sepia
                    </button>

                    <button
                        class="filter-button"
                        onclick="setFilter('brightness(1.3)',this)">
                        Bright
                    </button>

                    <button
                        class="filter-button"
                        onclick="setFilter('contrast(1.4)',this)">
                        Contrast
                    </button>

                </div>


                <div
                    id="recordLabel"
                    class="record-label">
                </div>


                <div class="capture-area">

                    <button
                        class="gallery-button"
                        onclick="pickMedia()">
                        🖼️
                    </button>

                    <button
                        id="captureButton"
                        class="capture-button"
                        onclick="captureButtonPressed()">
                    </button>

                </div>

            </div>
        </div>

    </section>


    <!-- CHATS -->

    <section id="chatsScreen" class="screen">

        <div class="top-bar">
            <div class="logo">
                Vibe<span>Snap</span>
            </div>
        </div>

        <div class="section-header">
            Chats
        </div>

        <div class="search-box">

            <input
                type="text"
                id="chatSearch"
                placeholder="Search users..."
                oninput="searchUsers()">

        </div>

        <div
            class="chat-list"
            id="chatList">
        </div>

    </section>


    <!-- FRIENDS -->

    <section id="friendsScreen" class="screen">

        <div class="top-bar">
            <div class="logo">
                Vibe<span>Snap</span>
            </div>
        </div>

        <div class="section-header">
            Find People
        </div>

        <div class="search-box">

            <input
                type="text"
                id="friendSearch"
                placeholder="Search username..."
                oninput="searchUsers()">

        </div>

        <div
            class="friend-list"
            id="friendList">
        </div>

    </section>


    <!-- PROFILE -->

    <section id="profileScreen" class="screen">

        <div class="top-bar">
            <div class="logo">
                Vibe<span>Snap</span>
            </div>
        </div>

        <div class="profile-page">

            <div
                id="profileAvatar"
                class="profile-avatar">

                <span id="profileLetter">V</span>

                <img
                    id="profileImage"
                    style="display:none"
                    alt="Profile">

            </div>

            <div
                id="profileName"
                class="profile-name">
                Vibe User
            </div>

            <div
                id="profileUsername"
                class="profile-username">
                @vibeuser
            </div>

            <div
                id="profileProvider"
                class="profile-provider">
            </div>

            <div class="profile-stats">

                <div>
                    <div
                        id="friendCount"
                        class="stat-number">
                        0
                    </div>

                    <div class="stat-label">
                        Friends
                    </div>
                </div>

                <div>
                    <div
                        id="photoCount"
                        class="stat-number">
                        0
                    </div>

                    <div class="stat-label">
                        Photos
                    </div>
                </div>

            </div>

            <button
                class="logout-button"
                onclick="logoutUser()">
                Log Out
            </button>

        </div>

    </section>


    <!-- NAVIGATION -->

    <nav class="bottom-nav">

        <button
            id="navCamera"
            class="nav-button active"
            onclick="openScreen('camera')">
            📷
            <span>Camera</span>
        </button>

        <button
            id="navChats"
            class="nav-button"
            onclick="openScreen('chats')">
            💬
            <span>Chats</span>
        </button>

        <button
            id="navFriends"
            class="nav-button"
            onclick="openScreen('friends')">
            👥
            <span>Friends</span>
        </button>

        <button
            id="navProfile"
            class="nav-button"
            onclick="openScreen('profile')">
            👤
            <span>Profile</span>
        </button>

    </nav>

</div>


<!-- MEDIA PREVIEW -->

<div
    id="previewPanel"
    class="preview-panel">

    <img
        id="previewImage"
        class="preview-media"
        style="display:none"
        alt="Captured photo">

    <video
        id="previewVideo"
        class="preview-media"
        style="display:none"
        controls
        playsinline>
    </video>

    <div class="preview-actions">

        <button
            class="preview-button retake-button"
            onclick="retakeMedia()">
            Retake
        </button>

        <button
            class="preview-button send-button"
            onclick="saveCapturedMedia()">
            Save
        </button>

    </div>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast">
</div>


<!-- FILE PICKER -->

<input
    type="file"
    id="mediaInput"
    accept="image/*,video/*"
    style="display:none"
    onchange="handleMediaPick(event)">


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    apiKey:"AIzaSyC8_0DykQ_yyQT3xzVmpZ9TPML0jOcKmDc",
    authDomain:"vibesnap-213d4.firebaseapp.com",
    projectId:"vibesnap-213d4",
    storageBucket:"vibesnap-213d4.firebasestorage.app",
    messagingSenderId:"933479938239",
    appId:"1:933479938239:web:d120d7ba99f5665987ae0a",
    measurementId:"G-HP0QL3C8Y"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

const googleProvider=
    new firebase.auth.GoogleAuthProvider();


/* =========================================================
   VARIABLES
========================================================= */

let currentUser=null;
let currentProfile=null;

let stream=null;
let facingMode="user";
let currentFilter="none";

let capturedPhoto=null;
let capturedVideoBlob=null;
let capturedVideoURL=null;

let mediaRecorder=null;
let recordedChunks=[];
let isRecording=false;

let confirmationResult=null;
let recaptchaVerifier=null;

let allUsers=[];
let usersUnsubscribe=null;

let toastTimer=null;


/* =========================================================
   AUTH
========================================================= */

function showAuthMessage(message){
    document.getElementById("authMessage").textContent=message;
}

function showOtpMessage(message){
    document.getElementById("otpMessage").textContent=message;
}


async function loginWithGoogle(){

    showAuthMessage("Opening Google...");

    try{

        await auth.signInWithPopup(
            googleProvider
        );

    }catch(error){

        console.error(error);

        showAuthMessage(
            firebaseErrorMessage(error)
        );
    }
}


function setupRecaptcha(){

    if(recaptchaVerifier){
        return;
    }

    recaptchaVerifier=
        new firebase.auth.RecaptchaVerifier(
            "recaptcha-container",
            {
                size:"normal"
            }
        );

    recaptchaVerifier.render();
}


async function sendPhoneCode(){

    const phone=
        document
        .getElementById("phoneNumber")
        .value
        .trim();

    if(!phone){

        showAuthMessage(
            "Enter your phone number with country code."
        );

        return;
    }

    try{

        setupRecaptcha();

        showAuthMessage(
            "Sending verification code..."
        );

        confirmationResult=
            await auth.signInWithPhoneNumber(
                phone,
                recaptchaVerifier
            );

        document
        .getElementById("authButtons")
        .style.display="none";

        document
        .getElementById("otpBox")
        .style.display="block";

        showOtpMessage(
            "Code sent. Check your phone."
        );

    }catch(error){

        console.error(error);

        showAuthMessage(
            firebaseErrorMessage(error)
        );
    }
}


async function verifyPhoneCode(){

    const code=
        document
        .getElementById("phoneCode")
        .value
        .trim();

    if(!code){

        showOtpMessage(
            "Enter the verification code."
        );

        return;
    }

    if(!confirmationResult){

        showOtpMessage(
            "Request a new code first."
        );

        return;
    }

    try{

        showOtpMessage("Verifying...");

        await confirmationResult.confirm(code);

    }catch(error){

        console.error(error);

        showOtpMessage(
            firebaseErrorMessage(error)
        );
    }
}


function backToAuth(){

    document
    .getElementById("otpBox")
    .style.display="none";

    document
    .getElementById("authButtons")
    .style.display="block";

    showAuthMessage("");
    showOtpMessage("");
}


/* =========================================================
   USER PROFILE
========================================================= */

function makeUsername(name){

    let username=
        String(name||"")
        .toLowerCase()
        .replace(/[^a-z0-9]/g,"")
        .substring(0,14);

    return username||"vibeuser";
}


function getProviderName(user){

    if(user.providerData){

        for(const provider of user.providerData){

            if(provider.providerId==="google.com"){
                return "Google";
            }

            if(provider.providerId==="phone"){
                return "Phone";
            }
        }
    }

    return "Firebase";
}


async function createOrUpdateUserProfile(user){

    if(!user){
        return;
    }

    currentUser=user;

    const userRef=
        db.collection("users").doc(user.uid);

    const snapshot=
        await userRef.get();

    const existing=
        snapshot.exists
        ? snapshot.data()
        : {};

    const username=
        existing.username ||
        makeUsername(
            user.displayName ||
            "user"+user.uid.substring(0,6)
        );

    const profile={

        uid:user.uid,

        username:username,

        displayName:
            user.displayName ||
            existing.displayName ||
            username,

        photoURL:
            user.photoURL ||
            existing.photoURL ||
            "",

        phoneNumber:
            user.phoneNumber ||
            existing.phoneNumber ||
            "",

        email:
            user.email ||
            existing.email ||
            "",

        provider:
            getProviderName(user),

        updatedAt:
            firebase.firestore.FieldValue
            .serverTimestamp(),

        createdAt:
            existing.createdAt ||
            firebase.firestore.FieldValue
            .serverTimestamp()
    };

    await userRef.set(
        profile,
        {merge:true}
    );

    currentProfile={
        ...existing,
        ...profile
    };

    enterMainApp();
}


/* =========================================================
   AUTH STATE
========================================================= */

auth.onAuthStateChanged(
    async function(user){

        if(user){

            try{

                await createOrUpdateUserProfile(user);

            }catch(error){

                console.error(error);

                showAuthMessage(
                    "Could not load your profile."
                );
            }

        }else{

            currentUser=null;
            currentProfile=null;

            stopCamera();

            document
            .getElementById("authScreen")
            .classList.remove("hidden");

            document
            .getElementById("app")
            .classList.add("hidden");
        }
    }
);


/* =========================================================
   MAIN APP
========================================================= */

async function enterMainApp(){

    document
    .getElementById("authScreen")
    .classList.add("hidden");

    document
    .getElementById("app")
    .classList.remove("hidden");

    updateProfileUI();

    await loadUsers();

}


/* =========================================================
   PROFILE UI
========================================================= */

function updateProfileUI(){

    }

    const displayName=
        currentProfile.displayName ||
        currentProfile.username ||

        currentProfile.username ||
        "vibeuser";

        displayName

        .textContent=letter;

            .style.display="block";

            .style.display="none";

        document.getElementById("smallProfileLetter")
            .style.display="block";

/* =========================================================
   USERS
========================================================= */

async function loadUsers(){

    try{

        const snapshot=
            await db
            .collection("users")
            .limit(100)
            .get();

        allUsers=[];

        snapshot.forEach(function(doc){

            const data=doc.data();

            if(
                currentUser &&
                data.uid===currentUser.uid
            ){
                return;
            }

            allUsers.push(data);
        });

        renderUsers();

    }catch(error){

        console.error(error);

        showToast(
            "Could not load users."
        );
    }
}


function startUserListener(){

    if(usersUnsubscribe){
        usersUnsubscribe();
    }

    usersUnsubscribe=
        db
        .collection("users")
        .limit(100)
        .onSnapshot(
            function(snapshot){

                allUsers=[];

                snapshot.forEach(function(doc){

                    const data=doc.data();

                    if(
                        currentUser &&
                        data.uid===currentUser.uid
                    ){
                        return;
                    }

                    allUsers.push(data);
                });

                renderUsers();
            },
            function(error){

                console.error(
                    "User listener:",
                    error
                );
            }
        );
}


function renderUsers(){

    const friendList=
        document.getElementById("friendList");

    const chatList=
        document.getElementById("chatList");

    friendList.innerHTML="";
    chatList.innerHTML="";

    if(!allUsers.length){

        friendList.innerHTML=
            `<p style="color:#777;padding:20px">
                No other VibeSnap users yet.
            </p>`;

        chatList.innerHTML=
            `<p style="color:#777;padding:20px">
                No other VibeSnap users yet.
            </p>`;

        return;
    }

    allUsers.forEach(function(user){

        const name=
            user.displayName ||
            user.username ||
            "Vibe User";

        const username=
            user.username ||
            "user";

        const letter=
            name.charAt(0).toUpperCase();

        const photo=
            user.photoURL
            ? `<img src="${escapeHtml(user.photoURL)}" alt="">`
            : letter;

        friendList.innerHTML+=`

            <div
                class="friend-card"
                data-name="${escapeHtml(
                    name+" "+username
                ).toLowerCase()}">

                <div class="friend-avatar">
                    ${photo}
                </div>

                <div class="friend-info">

                    <b>
                        ${escapeHtml(name)}
                    </b>

                    <div style="color:#888;font-size:13px">
                        @${escapeHtml(username)}
                    </div>

                </div>

                <button
                    class="friend-button"
                    onclick="addFriend('${escapeHtml(user.uid)}')">
                    Add
                </button>

            </div>
        `;


        chatList.innerHTML+=`

            <div
                class="chat-item"
                data-name="${escapeHtml(
                    name+" "+username
                ).toLowerCase()}"
                onclick="openChat('${escapeHtml(user.uid)}')"
                style="cursor:pointer">

                <div class="chat-avatar">
                    ${photo}
                </div>

                <div class="chat-info">

                    <div class="chat-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="chat-preview">
                        Tap to start a chat
                    </div>

                </div>

            </div>
        `;
    });
}


/* =========================================================

========================================================= */

async function addFriend(friendUid){

    if(!currentUser || !friendUid){
        return;
    }

    if(friendUid===currentUser.uid){
        return;
    }

    try{

        await db
        .collection("users")
        .doc(currentUser.uid)
        .collection("friends")
        .doc(friendUid)
        .set({
            uid:friendUid,
            addedAt:
                firebase.firestore.FieldValue
                .serverTimestamp()
        });

        showToast("Friend added!");

    }catch(error){

        console.error(error);

        showToast(
            "Could not add friend."
        );
    }
}


function openChat(uid){

    const user=
        allUsers.find(
            item=>item.uid===uid
        );

    if(!user){
        return;
    }

    showToast(
        "Chat with @"+
        (user.username||"user")+
        " will be connected next."
    );
}

/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            showToast(
                "Camera is not supported by this browser."
            );

            return;
        }

        stopCamera();

        const video=
            document.getElementById("video");

        video.setAttribute(
            "playsinline",
            "true"
        );

        video.muted=true;

        stream=
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:facingMode
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:true
            });

        video.srcObject=stream;

        video.style.filter=currentFilter;

        await video.play();

    }catch(error){

        console.error(
            "VibeSnap camera error:",
            error
        );

        if(error.name==="NotAllowedError"){

            showToast(
                "Allow camera and microphone permission for VibeSnap."
            );

        }else if(error.name==="NotFoundError"){

            showToast(
                "No camera or microphone was found."
            );

        }else if(error.name==="NotReadableError"){

            showToast(
                "Camera is already being used by another app."
            );

        }else{

            showToast(
                "Could not start the camera."
            );
        }
    }
}


function stopCamera(){

    if(
        mediaRecorder &&
        mediaRecorder.state!=="inactive"
    ){

        try{
            mediaRecorder.stop();
        }catch(e){}
    }

    mediaRecorder=null;
    isRecording=false;
    recordedChunks=[];

    if(stream){

        stream
        .getTracks()
        .forEach(
            track=>track.stop()
        );

        stream=null;
    }

    const button=
        document.getElementById(
            "captureButton"
        );

    if(button){
        button.classList.remove("recording");
    }

    const label=
        document.getElementById(
            "recordLabel"
        );

    if(label){
        label.textContent="";
    }
}


async function switchCamera(){

    if(isRecording){
        showToast(
            "Stop recording before switching cameras."
        );
        return;
    }

    facingMode=
        facingMode==="user"
        ? "environment"
        : "user";

    await startCamera();
}


/* =========================================================
   PHOTO CAPTURE
========================================================= */

function capturePhoto(){

    const video=
        document.getElementById("video");

    if(
        !video ||
        !video.videoWidth ||
        !video.videoHeight
    ){

        showToast(
            "Camera is not ready yet."
        );

        return;
    }

    const canvas=
        document.createElement("canvas");

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    const context=
        canvas.getContext("2d");

    context.filter=currentFilter;

    if(facingMode==="user"){

        context.translate(
            canvas.width,
            0
        );

        context.scale(-1,1);
    }

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    capturedPhoto=
        canvas.toDataURL(
            "image/jpeg",
            .92
        );

    showPhotoPreview();
}


/* =========================================================
   VIDEO RECORDING
========================================================= */

function captureButtonPressed(){

    if(isRecording){

        stopVideoRecording();

    }else{

        capturePhoto();
    }
}


function startVideoRecording(){

    if(!stream){

        showToast(
            "Camera is not ready."
        );

        return;
    }

    if(!window.MediaRecorder){

        showToast(
            "Video recording is not supported on this browser."
        );

        return;
    }

    recordedChunks=[];

    let mimeType="";

    const types=[
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm",
        "video/mp4"
    ];

    for(const type of types){

        if(
            MediaRecorder.isTypeSupported(type)
        ){

            mimeType=type;
            break;
        }
    }

    try{

        mediaRecorder=
            mimeType
            ? new MediaRecorder(
                stream,
                {mimeType:mimeType}
              )
            : new MediaRecorder(stream);

    }catch(error){

        console.error(error);

        showToast(
            "Could not start video recording."
        );

        return;
    }


    mediaRecorder.ondataavailable=
        function(event){

            if(
                event.data &&
                event.data.size>0
            ){

                recordedChunks.push(
                    event.data
                );
            }
        };


    mediaRecorder.onstop=
        function(){

            if(!recordedChunks.length){

                showToast(
                    "No video was recorded."
                );

                return;
            }

            const type=
                mediaRecorder.mimeType ||
                "video/webm";

            capturedVideoBlob=
                new Blob(
                    recordedChunks,
                    {type:type}
                );

            if(capturedVideoURL){

                URL.revokeObjectURL(
                    capturedVideoURL
                );
            }

            capturedVideoURL=
                URL.createObjectURL(
                    capturedVideoBlob
                );

            showVideoPreview();

            recordedChunks=[];
        };


    mediaRecorder.onerror=
        function(error){

            console.error(
                "MediaRecorder error:",
                error
            );

            showToast(
                "Video recording failed."
            );
        };


    mediaRecorder.start(1000);

    isRecording=true;

    document
    .getElementById("captureButton")
    .classList.add("recording");

    document
    .getElementById("recordLabel")
    .textContent=
        "🔴 Recording — tap again to stop";

    showToast(
        "Video recording started."
    );
}


function stopVideoRecording(){

    if(
        !mediaRecorder ||
        mediaRecorder.state==="inactive"
    ){

        return;
    }

    mediaRecorder.stop();

    isRecording=false;

    document
    .getElementById("captureButton")
    .classList.remove("recording");

    document
    .getElementById("recordLabel")
    .textContent="";

    showToast(
        "Finishing video..."
    );
}


function startVideoMode(){

    if(isRecording){
        stopVideoRecording();
        return;
    }

    startVideoRecording();
}

   LONG PRESS / VIDEO BUTTON

const captureButton=

captureButton.addEventListener(

/* =========================================================
   PREVIEWS
========================================================= */

function showPhotoPreview(){

    stopCamera();

    const image=
        document.getElementById(
            "previewImage"
        );

    const video=
        document.getElementById(
            "previewVideo"
        );

    image.src=capturedPhoto;
    image.style.display="block";

    video.pause();
    video.removeAttribute("src");
    video.style.display="none";

    document
    .getElementById("previewPanel")
    .classList.add("active");
}


function showVideoPreview(){

    stopCamera();

    const image=
        document.getElementById(
            "previewImage"
        );

    const video=
        document.getElementById(
            "previewVideo"
        );

    image.style.display="none";
    image.src="";

    video.src=capturedVideoURL;
    video.style.display="block";
    video.load();

    document
    .getElementById("previewPanel")
    .classList.add("active");
}


/* =========================================================
   RETAKE
========================================================= */

function retakeMedia(){

    capturedPhoto=null;
    capturedVideoBlob=null;

    if(capturedVideoURL){

        URL.revokeObjectURL(
            capturedVideoURL
        );

        capturedVideoURL=null;
    }

    const image=
        document.getElementById(
            "previewImage"
        );

    const video=
        document.getElementById(
            "previewVideo"
        );

    image.src="";
    image.style.display="none";

    video.pause();
    video.src="";
    video.style.display="none";

    document
    .getElementById("previewPanel")
    .classList.remove("active");

    startCamera();
}


/* =========================================================
   SAVE CAPTURED MEDIA
========================================================= */

function saveCapturedMedia(){

    if(capturedPhoto){

        document
        .getElementById("previewPanel")
        .classList.remove("active");

        showToast(
            "Photo captured successfully!"
        );

        capturedPhoto=null;

        startCamera();

        return;
    }

    if(capturedVideoBlob){

        document
        .getElementById("previewPanel")
        .classList.remove("active");

        showToast(
            "Video recorded successfully!"
        );

        capturedVideoBlob=null;

        if(capturedVideoURL){

            URL.revokeObjectURL(
                capturedVideoURL
            );

            capturedVideoURL=null;
        }

        startCamera();

        return;
    }

    showToast(
        "Capture a photo or video first."
    );
}


/* =========================================================
   FILE PICKER
========================================================= */

function pickMedia(){

    document
    .getElementById("mediaInput")
    .click();
}


function handleMediaPick(event){

    const file=
        event.target.files[0];

    if(!file){
        return;
    }

    if(file.type.startsWith("image/")){

        const reader=
            new FileReader();

        reader.onload=
            function(e){

                capturedPhoto=
                    e.target.result;

                showPhotoPreview();
            };

        reader.readAsDataURL(file);

    }else if(
        file.type.startsWith("video/")
    ){

        capturedVideoBlob=file;

        if(capturedVideoURL){

            URL.revokeObjectURL(
                capturedVideoURL
            );
        }

        capturedVideoURL=
            URL.createObjectURL(file);

        showVideoPreview();

    }else{

        showToast(
            "Please select a photo or video."
        );
    }

    event.target.value="";
}

/* =========================================================
   NAVIGATION
========================================================= */

function openScreen(screen){

    document
    .querySelectorAll(".screen")
    .forEach(function(section){

        section.classList.remove("active");
    });

    const target=
        document.getElementById(
            screen+"Screen"
        );

    if(target){
        target.classList.add("active");
    }

    document
    .querySelectorAll(".nav-button")
    .forEach(function(button){

        button.classList.remove("active");
    });

    const nav=
        document.getElementById(
            "nav"+
            screen.charAt(0).toUpperCase()+
            screen.slice(1)
        );

    if(nav){
        nav.classList.add("active");
    }

    if(screen==="camera"){

        startCamera();

    }else{

        stopCamera();
    }

    if(
        screen==="friends" ||
        screen==="chats"
    ){

        loadUsers();
    }
}

/* =========================================================
   ERRORS
========================================================= */

function firebaseErrorMessage(error){

    if(!error){
        return "Something went wrong.";
    }

    switch(error.code){

        case "auth/popup-closed-by-user":
            return "Google sign-in was cancelled.";

        case "auth/popup-blocked":
            return "Your browser blocked the Google sign-in window.";

        case "auth/unauthorized-domain":
            return "This website domain is not authorized in Firebase.";

        case "auth/operation-not-allowed":
            return "This sign-in method is disabled in Firebase.";

        case "auth/invalid-phone-number":
            return "Enter a valid phone number with country code.";

        case "auth/invalid-verification-code":
            return "The verification code is incorrect.";

        case "auth/code-expired":
            return "That verification code expired.";

        case "auth/too-many-requests":
            return "Too many attempts. Please try again later.";

        default:
            return error.message ||
                "Authentication failed.";
    }
}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHtml(value){

    return String(value||"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast=
        document.getElementById("toast");

    toast.textContent=message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );
}
