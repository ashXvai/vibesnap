<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VibeSnap</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #050505;
      color: white;
      min-height: 100vh;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: #0b0b0b;
      position: relative;
      overflow: hidden;
    }

    .screen {
      display: none;
      min-height: 100vh;
    }

    .screen.active {
      display: block;
    }

    /* ================= AUTH ================= */

    #authScreen {
      padding: 35px 22px;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      color: #ffd400;
      margin-top: 30px;
      margin-bottom: 10px;
    }

    .tagline {
      text-align: center;
      color: #aaa;
      margin-bottom: 35px;
    }

    .auth-card {
      background: #151515;
      padding: 22px;
      border-radius: 22px;
      border: 1px solid #272727;
    }

    .auth-card h2 {
      margin-bottom: 20px;
    }

    .auth-btn {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      background: #222;
      color: white;
    }

    .google-btn {
      background: white;
      color: #111;
    }

    .phone-btn {
      background: #ffd400;
      color: #111;
    }

    .input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #101010;
      color: white;
      margin: 7px 0;
      outline: none;
    }

    /* ================= HEADER ================= */

    .topbar {
      height: 65px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
    }

    .top-logo {
      color: #ffd400;
      font-size: 25px;
      font-weight: 900;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #1d1d1d;
      color: white;
      font-size: 20px;
    }

    /* ================= HOME ================= */

    .home-content {
      padding: 18px;
      padding-bottom: 90px;
    }

    .welcome {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .empty-card {
      background: #151515;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      color: #aaa;
      border: 1px solid #262626;
    }

    /* ================= CAMERA ================= */

    #cameraScreen {
      position: relative;
      background: #000;
    }

    .camera-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .camera-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .camera-title {
      font-weight: bold;
      font-size: 20px;
    }

    .camera-controls-top {
      display: flex;
      gap: 10px;
    }

    .camera-circle {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: white;
      font-size: 20px;
      backdrop-filter: blur(5px);
    }

    .filter-bar {
      position: absolute;
      bottom: 130px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10;
      padding: 0 10px;
    }

    .filter-btn {
      padding: 8px 12px;
      border-radius: 20px;
      background: rgba(0,0,0,.6);
      color: white;
      font-size: 12px;
    }

    .filter-btn.active {
      background: #ffd400;
      color: black;
    }

    .camera-bottom {
      position: absolute;
      bottom: 25px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 10;
    }

    .gallery-btn {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(0,0,0,.65);
      color: white;
      font-size: 24px;
    }

    .capture-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 5px solid white;
      background: white;
      position: relative;
    }

    .capture-btn.recording {
      background: #ff3030;
      border-color: white;
    }

    .recording-text {
      position: absolute;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      background: rgba(0,0,0,.6);
      padding: 7px 12px;
      border-radius: 15px;
      display: none;
    }

    .recording-text.show {
      display: block;
    }

    /* ================= PREVIEW ================= */

    #previewScreen {
      background: #000;
      position: relative;
    }

    .preview-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .preview-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px;
      z-index: 20;
    }

    .close-preview {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(0,0,0,.65);
      color: white;
      font-size: 27px;
    }

    .preview-media-area {
      flex: 1;
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #photoPreview,
    #videoPreview {
      width: 100%;
      max-height: 78vh;
      object-fit: contain;
    }

    #videoPreview {
      display: none;
    }

    .preview-bottom {
      padding: 20px;
      display: flex;
      gap: 12px;
      background: #080808;
    }

    .preview-action {
      flex: 1;
      padding: 16px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
    }

    .save-btn {
      background: #ffd400;
      color: #111;
    }

    .send-btn {
      background: #1f1f1f;
      color: white;
      border: 1px solid #444;
    }

    /* ================= MODAL ================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 390px;
      background: #191919;
      border-radius: 22px;
      padding: 24px;
      border: 1px solid #333;
    }

    .modal h3 {
      font-size: 21px;
      margin-bottom: 12px;
    }

    .modal p {
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 14px;
      border-radius: 13px;
      font-weight: bold;
    }

    .cancel-modal {
      background: #292929;
      color: white;
    }

    .discard-modal {
      background: #ff3b30;
      color: white;
    }

    /* ================= FRIENDS ================= */

    .page-content {
      padding: 18px;
      padding-bottom: 90px;
    }

    .page-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #151515;
      padding: 13px;
      border-radius: 16px;
      margin-bottom: 10px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #ffd400;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .add-btn {
      padding: 9px 15px;
      border-radius: 12px;
      background: #ffd400;
      color: #111;
      font-weight: bold;
    }

    /* ================= BOTTOM NAV ================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      height: 70px;
      background: rgba(12,12,12,.97);
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      background: transparent;
      color: #777;
      font-size: 23px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-btn span {
      font-size: 10px;
    }

    .nav-btn.active {
      color: #ffd400;
    }

    /* ================= PROFILE ================= */

    .profile-box {
      text-align: center;
      padding: 25px 0;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ffd400;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 35px;
      font-weight: bold;
    }

    .logout-btn {
      width: 100%;
      padding: 15px;
      background: #292929;
      color: white;
      border-radius: 14px;
      margin-top: 25px;
      font-weight: bold;
    }

    /* ================= TOAST ================= */

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 12px 18px;
      border-radius: 20px;
      display: none;
      z-index: 10000;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      display: block;
    }

    @media (min-width: 600px) {
      .app {
        box-shadow: 0 0 40px rgba(0,0,0,.6);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ================= AUTH ================= -->

  <section id="authScreen" class="screen active">

    <div class="logo">VibeSnap</div>
    <div class="tagline">Connect. Snap. Vibe.</div>

    <div class="auth-card">

      <h2>Welcome to VibeSnap</h2>

      <button class="auth-btn google-btn" id="googleLoginBtn">
        Continue with Google
      </button>

      <button class="auth-btn phone-btn" id="phoneLoginBtn">
        Continue with Phone
      </button>

      <div id="phoneForm" style="display:none; margin-top:15px;">

        <input
          id="phoneNumber"
          class="input"
          type="tel"
          placeholder="+91XXXXXXXXXX"
        >

        <div id="recaptcha-container"></div>

        <button class="auth-btn phone-btn" id="sendOtpBtn">
          Send OTP
        </button>

        <input
          id="otpInput"
          class="input"
          type="number"
          placeholder="Enter OTP"
          style="display:none;"
        >

        <button
          class="auth-btn google-btn"
          id="verifyOtpBtn"
          style="display:none;"
        >
          Verify OTP
        </button>

      </div>

    </div>

  </section>


  <!-- ================= HOME ================= -->

  <section id="homeScreen" class="screen">

    <div class="topbar">
      <div class="top-logo">VibeSnap</div>
      <button class="icon-btn" onclick="openScreen('profile')">👤</button>
    </div>

    <div class="home-content">

      <div class="welcome" id="welcomeText">
        Welcome 👋
      </div>

      <div class="empty-card">
        <h2>Your Vibes</h2>
        <br>
        <p>Your conversations and snaps will appear here.</p>
      </div>

    </div>

  </section>


  <!-- ================= CAMERA ================= -->

  <section id="cameraScreen" class="screen">

    <div class="camera-container">

      <video id="video" autoplay muted playsinline></video>

      <div class="camera-top">

        <div class="camera-title">
          Camera
        </div>

        <div class="camera-controls-top">

          <button
            class="camera-circle"
            id="switchCameraBtn"
            title="Switch camera"
          >
            🔄
          </button>

        </div>

      </div>


      <div class="filter-bar">

        <button class="filter-btn active" data-filter="none">
          Normal
        </button>

        <button class="filter-btn" data-filter="grayscale(1)">
          B&W
        </button>

        <button class="filter-btn" data-filter="sepia(1)">
          Sepia
        </button>

        <button class="filter-btn" data-filter="brightness(1.3)">
          Bright
        </button>

      </div>


      <div
        id="recordingText"
        class="recording-text"
      >
        🔴 Recording... Tap to stop
      </div>


      <div class="camera-bottom">

        <button
          class="gallery-btn"
          id="galleryBtn"
          title="Choose from gallery"
        >
          🖼️
        </button>

        <button
          class="capture-btn"
          id="captureButton"
          title="Tap for photo, hold for video"
        ></button>

        <input
          id="mediaInput"
          type="file"
          accept="image/*,video/*"
          style="display:none;"
        >

      </div>

    </div>

  </section>


  <!-- ================= PREVIEW ================= -->

  <section id="previewScreen" class="screen">

    <div class="preview-container">

      <div class="preview-top">

        <button
          class="close-preview"
          id="closePreviewBtn"
          title="Discard"
        >
          ×
        </button>

      </div>


      <div class="preview-media-area">

        <img
          id="photoPreview"
          alt="Captured photo"
        >

        <video
          id="videoPreview"
          controls
          playsinline
        ></video>

      </div>


      <div class="preview-bottom">

        <button
          class="preview-action save-btn"
          id="saveMediaBtn"
        >
          💾 Save
        </button>

        <button
          class="preview-action send-btn"
          id="sendMediaBtn"
        >
          📤 Send
        </button>

      </div>

    </div>

  </section>


  <!-- ================= FRIENDS ================= -->

  <section id="friendsScreen" class="screen">

    <div class="topbar">
      <div class="top-logo">VibeSnap</div>
    </div>

    <div class="page-content">

      <div class="page-title">
        Friends
      </div>

      <div id="usersList">
        <div class="empty-card">
          Loading users...
        </div>
      </div>

    </div>

  </section>


  <!-- ================= PROFILE ================= -->

  <section id="profileScreen" class="screen">

    <div class="topbar">
      <div class="top-logo">VibeSnap</div>
    </div>

    <div class="page-content">

      <div class="profile-box">

        <div
          class="profile-avatar"
          id="profileAvatar"
        >
          V
        </div>

        <h2 id="profileName" style="margin-top:15px;">
          VibeSnap User
        </h2>

        <p
          id="profileEmail"
          style="color:#888;margin-top:7px;"
        >
          —
        </p>

      </div>

      <button
        class="logout-btn"
        id="logoutBtn"
      >
        Log Out
      </button>

    </div>

  </section>


  <!-- ================= BOTTOM NAV ================= -->

  <div
    id="bottomNav"
    class="bottom-nav"
    style="display:none;"
  >

    <button
      class="nav-btn active"
      data-screen="home"
    >
      🏠
      <span>Home</span>
    </button>

    <button
      class="nav-btn"
      data-screen="friends"
    >
      👥
      <span>Friends</span>
    </button>

    <button
      class="nav-btn"
      data-screen="camera"
    >
      📸
      <span>Camera</span>
    </button>

    <button
      class="nav-btn"
      data-screen="profile"
    >
      👤
      <span>Profile</span>
    </button>

  </div>

</div>


<!-- ================= DISCARD CONFIRMATION ================= -->

<div
  id="discardModal"
  class="modal-overlay"
>

  <div class="modal">

    <h3>
      Are you sure you want to retake?
    </h3>

    <p>
      This photo will be discarded.
    </p>

    <div class="modal-buttons">

      <button
        class="cancel-modal"
        id="cancelDiscardBtn"
      >
        Cancel
      </button>

      <button
        class="discard-modal"
        id="confirmDiscardBtn"
      >
        Discard Photo
      </button>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

  const firebaseConfig = {
    apiKey: "AIzaSyC8_0DykQ_yyQT3xzVmpZ9TPML0jOcKmDc",
    authDomain: "vibesnap-213d4.firebaseapp.com",
    projectId: "vibesnap-213d4",
    storageBucket: "vibesnap-213d4.firebasestorage.app",
    messagingSenderId: "933479938239",
    appId: "1:933479938239:web:d120d7ba99f5665987ae0a",
    measurementId: "G-HP0QL3C8Y"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;

  let cameraStream = null;
  let facingMode = "user";

  let mediaRecorder = null;
  let recordedChunks = [];

  let capturedBlob = null;
  let capturedType = null;

  let currentFilter = "none";

  let pressTimer = null;
  let longPressTriggered = false;


  /* ================= GENERAL ================= */

  function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 2500);
  }


  function openScreen(screenName) {

    document.querySelectorAll(".screen").forEach(screen => {
      screen.classList.remove("active");
    });

    const target = document.getElementById(
      screenName + "Screen"
    );

    if (target) {
      target.classList.add("active");
    }

    if (screenName === "camera") {
      startCamera();
    } else {
      stopCamera();
    }

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.classList.remove("active");

      if (btn.dataset.screen === screenName) {
        btn.classList.add("active");
      }
    });
  }


  function showApp() {

    document.getElementById("authScreen")
      .classList.remove("active");

    document.getElementById("bottomNav")
      .style.display = "flex";

    openScreen("home");

    loadProfile();
    loadUsers();
  }


  /* ================= GOOGLE LOGIN ================= */

  document.getElementById("googleLoginBtn")
    .addEventListener("click", async () => {

      try {

        const provider =
          new firebase.auth.GoogleAuthProvider();

        await auth.signInWithPopup(provider);

      } catch (error) {

        console.error(error);

        showToast(
          error.message || "Google login failed"
        );

      }

    });


  /* ================= PHONE LOGIN ================= */

  let confirmationResult = null;

  document.getElementById("phoneLoginBtn")
    .addEventListener("click", () => {

      document.getElementById("phoneForm")
        .style.display = "block";

      setupRecaptcha();

    });


  function setupRecaptcha() {

    if (window.recaptchaVerifier) {
      return;
    }

    window.recaptchaVerifier =
      new firebase.auth.RecaptchaVerifier(
        "recaptcha-container",
        {
          size: "normal"
        }
      );

    window.recaptchaVerifier.render();

  }


  document.getElementById("sendOtpBtn")
    .addEventListener("click", async () => {

      const phone =
        document.getElementById("phoneNumber").value.trim();

      if (!phone) {
        showToast("Enter your phone number");
        return;
      }

      try {

        setupRecaptcha();

        confirmationResult =
          await auth.signInWithPhoneNumber(
            phone,
            window.recaptchaVerifier
          );

        document.getElementById("otpInput")
          .style.display = "block";

        document.getElementById("verifyOtpBtn")
          .style.display = "block";

        showToast("OTP sent");

      } catch (error) {

        console.error(error);

        showToast(
          error.message || "Could not send OTP"
        );

      }

    });


  document.getElementById("verifyOtpBtn")
    .addEventListener("click", async () => {

      const otp =
        document.getElementById("otpInput").value.trim();

      if (!confirmationResult) {
        showToast("Send the OTP first");
        return;
      }

      try {

        await confirmationResult.confirm(otp);

      } catch (error) {

        console.error(error);

        showToast(
          error.message || "Invalid OTP"
        );

      }

    });


  /* ================= AUTH STATE ================= */

  auth.onAuthStateChanged(async user => {

    if (user) {

      currentUser = user;

      await saveUserProfile();

      showApp();

    }

  });


  /* ================= USER PROFILE ================= */

  async function saveUserProfile() {

    if (!currentUser) return;

    const userRef =
      db.collection("users")
        .doc(currentUser.uid);

    await userRef.set({

      uid: currentUser.uid,

      displayName:
        currentUser.displayName ||
        "VibeSnap User",

      email:
        currentUser.email || "",

      phoneNumber:
        currentUser.phoneNumber || "",

      photoURL:
        currentUser.photoURL || "",

      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp()

    }, { merge: true });

  }


  async function loadProfile() {

    if (!currentUser) return;

    const name =
      currentUser.displayName ||
      "VibeSnap User";

    document.getElementById("profileName")
      .textContent = name;

    document.getElementById("profileEmail")
      .textContent =
        currentUser.email ||
        currentUser.phoneNumber ||
        "VibeSnap User";

    document.getElementById("welcomeText")
      .textContent =
        "Welcome, " + name + " 👋";

    document.getElementById("profileAvatar")
      .textContent =
        name.charAt(0).toUpperCase();

  }


  /* ================= CAMERA ================= */

  async function startCamera() {

    stopCamera();

    try {

      cameraStream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: facingMode
          },

          audio: true

        });

      const video =
        document.getElementById("video");

      video.srcObject = cameraStream;

      video.style.filter = currentFilter;

      await video.play();

    } catch (error) {

      console.error(error);

      showToast(
        "Camera permission is required"
      );

    }

  }


  function stopCamera() {

    if (mediaRecorder &&
        mediaRecorder.state !== "inactive") {

      try {
        mediaRecorder.stop();
      } catch (e) {}

    }

    mediaRecorder = null;

    if (cameraStream) {

      cameraStream.getTracks()
        .forEach(track => track.stop());

      cameraStream = null;

    }

  }


  /* ================= SWITCH CAMERA ================= */

  document.getElementById("switchCameraBtn")
    .addEventListener("click", async () => {

      facingMode =
        facingMode === "user"
          ? "environment"
          : "user";

      await startCamera();

    });


  /* ================= FILTERS ================= */

  document.querySelectorAll(".filter-btn")
    .forEach(button => {

      button.addEventListener("click", () => {

        document.querySelectorAll(".filter-btn")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        button.classList.add("active");

        currentFilter =
          button.dataset.filter;

        document.getElementById("video")
          .style.filter = currentFilter;

      });

    });


  /* ================= PHOTO CAPTURE ================= */

  function capturePhoto() {

    const video =
      document.getElementById("video");

    if (!cameraStream) {

      showToast("Camera is not ready");
      return;

    }

    const canvas =
      document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx =
      canvas.getContext("2d");

    ctx.filter = currentFilter;

    if (facingMode === "user") {

      ctx.translate(
        canvas.width,
        0
      );

      ctx.scale(-1, 1);

    }

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    canvas.toBlob(blob => {

      if (!blob) {

        showToast("Could not capture photo");
        return;

      }

      capturedBlob = blob;
      capturedType = "photo";

      showPhotoPreview(blob);

    }, "image/jpeg", 0.92);

  }


  /* ================= VIDEO RECORDING ================= */

  function startVideoRecording() {

    if (!cameraStream) {

      showToast("Camera is not ready");
      return;

    }

    recordedChunks = [];

    let mimeType = "";

    const types = [

      "video/webm;codecs=vp9",
      "video/webm;codecs=vp8",
      "video/webm",
      "video/mp4"

    ];

    for (const type of types) {

      if (
        window.MediaRecorder &&
        MediaRecorder.isTypeSupported(type)
      ) {

        mimeType = type;
        break;

      }

    }

    try {

      mediaRecorder =
        mimeType
          ? new MediaRecorder(
              cameraStream,
              { mimeType }
            )
          : new MediaRecorder(cameraStream);

      mediaRecorder.ondataavailable =
        event => {

          if (event.data &&
              event.data.size > 0) {

            recordedChunks.push(
              event.data
            );

          }

        };


      mediaRecorder.onstop = () => {

        const recorderType =
          mediaRecorder &&
          mediaRecorder.mimeType
            ? mediaRecorder.mimeType
            : "video/webm";

        const blob =
          new Blob(
            recordedChunks,
            { type: recorderType }
          );

        capturedBlob = blob;
        capturedType = "video";

        showVideoPreview(blob);

      };


      mediaRecorder.start(1000);

      document.getElementById(
        "captureButton"
      ).classList.add("recording");

      document.getElementById(
        "recordingText"
      ).classList.add("show");

    } catch (error) {

      console.error(error);

      showToast(
        "Video recording is not supported here"
      );

    }

  }


  function stopVideoRecording() {

    if (
      mediaRecorder &&
      mediaRecorder.state !== "inactive"
    ) {

      mediaRecorder.stop();

      document.getElementById(
        "captureButton"
      ).classList.remove("recording");

      document.getElementById(
        "recordingText"
      ).classList.remove("show");

    }

  }


  /* ================= CAPTURE BUTTON ================= */

  const captureButton =
    document.getElementById("captureButton");


  captureButton.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      longPressTriggered = false;

      pressTimer = setTimeout(() => {

        longPressTriggered = true;

        if (!mediaRecorder) {
          startVideoRecording();
        }

      }, 450);

    }
  );


  captureButton.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();

      clearTimeout(pressTimer);

      if (mediaRecorder) {

        stopVideoRecording();

        return;

      }

      if (!longPressTriggered) {

        capturePhoto();

      }

    }
  );


  captureButton.addEventListener(
    "pointerleave",
    () => {

      clearTimeout(pressTimer);

    }
  );


  /* ================= PREVIEW ================= */

  function showPhotoPreview(blob) {

    stopCamera();

    const image =
      document.getElementById("photoPreview");

    const video =
      document.getElementById("videoPreview");

    image.style.display = "block";
    video.style.display = "none";

    image.src =
      URL.createObjectURL(blob);

    openScreen("preview");

  }


  function showVideoPreview(blob) {

    stopCamera();

    const image =
      document.getElementById("photoPreview");

    const video =
      document.getElementById("videoPreview");

    image.style.display = "none";
    video.style.display = "block";

    video.src =
      URL.createObjectURL(blob);

    video.controls = true;

    openScreen("preview");

  }


  /* ================= X BUTTON ================= */

  document.getElementById("closePreviewBtn")
    .addEventListener("click", () => {

      document.getElementById(
        "discardModal"
      ).classList.add("show");

    });


  /* ================= CANCEL DISCARD ================= */

  document.getElementById("cancelDiscardBtn")
    .addEventListener("click", () => {

      document.getElementById(
        "discardModal"
      ).classList.remove("show");

    });


  /* ================= DISCARD ================= */

  document.getElementById("confirmDiscardBtn")
    .addEventListener("click", () => {

      capturedBlob = null;
      capturedType = null;

      document.getElementById(
        "photoPreview"
      ).src = "";

      document.getElementById(
        "videoPreview"
      ).src = "";

      document.getElementById(
        "discardModal"
      ).classList.remove("show");

      openScreen("camera");

    });


  /* ================= SAVE ================= */

  document.getElementById("saveMediaBtn")
    .addEventListener("click", () => {

      if (!capturedBlob) {

        showToast("Nothing to save");
        return;

      }

      const extension =
        capturedType === "video"
          ? "webm"
          : "jpg";

      const url =
        URL.createObjectURL(capturedBlob);

      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        "vibesnap-" +
        Date.now() +
        "." +
        extension;

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);

      showToast("Saved successfully");

    });


  /* ================= SEND ================= */

  document.getElementById("sendMediaBtn")
    .addEventListener("click", () => {

      /*
        The Send button is intentionally present now.

        Real sending will later use:

        Firebase Storage
        +
        Firestore messages

        This version does not pretend
        that the media was delivered.
      */

      showToast(
        "Send will be connected to VibeSnap chat later"
      );

    });


  /* ================= GALLERY ================= */

  document.getElementById("galleryBtn")
    .addEventListener("click", () => {

      document.getElementById(
        "mediaInput"
      ).click();

    });


  document.getElementById("mediaInput")
    .addEventListener("change", event => {

      const file =
        event.target.files[0];

      if (!file) return;

      capturedBlob = file;

      if (file.type.startsWith("video/")) {

        capturedType = "video";

        showVideoPreview(file);

      } else {

        capturedType = "photo";

        showPhotoPreview(file);

      }

      event.target.value = "";

    });


  /* ================= USERS ================= */

  async function loadUsers() {

    const usersList =
      document.getElementById("usersList");

    if (!currentUser) return;

    try {

      const snapshot =
        await db.collection("users")
          .limit(30)
          .get();

      usersList.innerHTML = "";

      let found = false;

      snapshot.forEach(doc => {

        if (doc.id === currentUser.uid) {
          return;
        }

        found = true;

        const data = doc.data();

        const name =
          data.displayName ||
          "VibeSnap User";

        const card =
          document.createElement("div");

        card.className = "user-card";

        card.innerHTML = `

          <div class="user-info">

            <div class="avatar">
              ${escapeHtml(
                name.charAt(0).toUpperCase()
              )}
            </div>

            <div>
              <strong>
                ${escapeHtml(name)}
              </strong>
            </div>

          </div>

          <button
            class="add-btn"
            onclick="addFriend('${doc.id}')"
          >
            Add
          </button>

        `;

        usersList.appendChild(card);

      });

      if (!found) {

        usersList.innerHTML = `
          <div class="empty-card">
            No other users found yet.
          </div>
        `;

      }

    } catch (error) {

      console.error(error);

      usersList.innerHTML = `
        <div class="empty-card">
          Users could not be loaded.
        </div>
      `;

    }

  }


  async function addFriend(friendUid) {

    if (!currentUser) return;

    try {

      await db.collection("users")
        .doc(currentUser.uid)
        .collection("friends")
        .doc(friendUid)
        .set({

          uid: friendUid,

          addedAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });

      showToast("Friend added");

    } catch (error) {

      console.error(error);

      showToast(
        "Could not add friend"
      );

    }

  }


  /* ================= LOGOUT ================= */

  document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

      try {

        await auth.signOut();

        currentUser = null;

        document.getElementById(
          "bottomNav"
        ).style.display = "none";

        document.querySelectorAll(".screen")
          .forEach(screen =>
            screen.classList.remove("active")
          );

        document.getElementById(
          "authScreen"
        ).classList.add("active");

      } catch (error) {

        console.error(error);

      }

    });


  /* ================= NAVIGATION ================= */

  document.querySelectorAll(".nav-btn")
    .forEach(button => {

      button.addEventListener("click", () => {

        openScreen(
          button.dataset.screen
        );

      });

    });


  /* ================= ESCAPE HTML ================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
</html>
