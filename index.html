<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VibeSnap</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#000;
    color:#fff;
    overflow:hidden;
}

.app{
    width:100%;
    max-width:480px;
    height:100vh;
    margin:auto;
    background:#090909;
    position:relative;
    overflow:hidden;
}

/* ================= AUTH ================= */

.auth-screen{
    position:absolute;
    inset:0;
    z-index:200;
    background:#090909;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.auth-screen.hidden{
    display:none;
}

.auth-box{
    width:100%;
    max-width:380px;
    text-align:center;
}

.auth-logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:-2px;
}

.auth-logo span{
    color:#ffe600;
}

.auth-subtitle{
    color:#777;
    margin:10px 0 35px;
}

.auth-input{
    width:100%;
    padding:16px 17px;
    margin:7px 0;
    border:1px solid #ffffff18;
    border-radius:16px;
    background:#ffffff08;
    color:#fff;
    outline:none;
    font-size:16px;
}

.auth-input:focus{
    border-color:#ffe60066;
}

.auth-button,
.auth-login-button{
    width:100%;
    padding:16px;
    margin-top:10px;
    border:0;
    border-radius:16px;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
}

.auth-button{
    background:#ffe600;
    color:#111;
}

.auth-login-button{
    background:#ffffff10;
    color:#fff;
    border:1px solid #ffffff18;
}

.auth-message{
    min-height:22px;
    margin-top:15px;
    color:#ff7676;
    font-size:13px;
}

/* ================= COMMON ================= */

.screen{
    position:absolute;
    inset:0;
    display:none;
    padding-bottom:75px;
    overflow-y:auto;
}

.screen.active{
    display:block;
}

button{
    cursor:pointer;
}

/* ================= CAMERA ================= */

.camera-screen{
    background:#000;
}

#video{
    width:100%;
    height:100%;
    object-fit:cover;
    position:absolute;
    inset:0;
}

.camera-overlay{
    position:absolute;
    inset:0;
    z-index:5;
}

.camera-top{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:25px;
    font-weight:900;
}

.logo span{
    color:#ffe600;
}

.profile-small{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#ffe600;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.camera-tools{
    position:absolute;
    right:15px;
    top:90px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.tool-button{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid #ffffff33;
    background:#00000066;
    color:#fff;
    font-size:20px;
}

.filters{
    position:absolute;
    bottom:145px;
    left:0;
    right:0;
    display:flex;
    gap:8px;
    padding:10px;
    overflow-x:auto;
    justify-content:center;
}

.filter-button{
    background:#00000099;
    color:#fff;
    border:1px solid #ffffff33;
    padding:8px 13px;
    border-radius:20px;
    font-size:12px;
}

.filter-button.active{
    background:#ffe600;
    color:#111;
    border-color:#ffe600;
}

.capture-area{
    position:absolute;
    bottom:70px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
}

.capture-button{
    width:72px;
    height:72px;
    border-radius:50%;
    border:6px solid #fff;
    background:#ffffff44;
}

/* ================= CHAT ================= */

.header{
    padding:22px 18px;
    font-size:27px;
    font-weight:900;
}

.search-box{
    margin:0 15px 15px;
    width:calc(100% - 30px);
    padding:14px;
    border-radius:15px;
    border:1px solid #ffffff15;
    background:#ffffff08;
    color:#fff;
    outline:none;
}

.user-item{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px 18px;
    border-bottom:1px solid #ffffff0c;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#ffe600;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.user-info{
    flex:1;
}

.user-name{
    font-weight:800;
}

.user-status{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

/* ================= FRIENDS ================= */

.friend-button{
    padding:9px 14px;
    border:0;
    border-radius:20px;
    background:#ffe600;
    color:#111;
    font-weight:800;
}

/* ================= PROFILE ================= */

.profile{
    text-align:center;
    padding:30px 20px;
}

.profile-avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    margin:10px auto 15px;
    background:#ffe600;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:900;
}

.profile-name{
    font-size:25px;
    font-weight:900;
}

.profile-email{
    color:#777;
    margin-top:5px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:45px;
    margin:30px 0;
}

.stat strong{
    display:block;
    font-size:22px;
}

.stat span{
    color:#777;
    font-size:12px;
}

.profile-option{
    width:100%;
    padding:15px;
    margin-top:10px;
    border-radius:15px;
    border:1px solid #ffffff12;
    background:#ffffff08;
    color:#fff;
    text-align:left;
}

.logout-button{
    background:#ff444420;
    color:#ff7777;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:#090909ee;
    border-top:1px solid #ffffff12;
    display:flex;
    z-index:50;
}

.nav-button{
    flex:1;
    background:none;
    border:0;
    color:#777;
    font-size:12px;
}

.nav-button.active{
    color:#ffe600;
}

.nav-icon{
    display:block;
    font-size:22px;
    margin-bottom:3px;
}

/* ================= PREVIEW ================= */

.preview-overlay{
    position:absolute;
    inset:0;
    background:#000;
    z-index:100;
    display:none;
}

.preview-overlay.active{
    display:block;
}

#previewImage{
    width:100%;
    height:100%;
    object-fit:contain;
}

.preview-actions{
    position:absolute;
    bottom:25px;
    left:15px;
    right:15px;
    display:flex;
    gap:10px;
}

.preview-button{
    flex:1;
    padding:15px;
    border-radius:15px;
    border:0;
    font-weight:900;
}

.retake-button{
    background:#ffffff18;
    color:#fff;
}

.send-button{
    background:#ffe600;
    color:#111;
}

/* ================= SEND PANEL ================= */

.send-panel{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    background:#151515;
    border-radius:25px 25px 0 0;
    padding:20px;
    z-index:110;
    display:none;
}

.send-panel.active{
    display:block;
}

.send-title{
    font-size:20px;
    font-weight:900;
    margin-bottom:15px;
}

.send-friend{
    display:flex;
    align-items:center;
    padding:10px 0;
}

.send-check{
    margin-left:auto;
    width:22px;
    height:22px;
}

.confirm-send{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:15px;
    background:#ffe600;
    font-weight:900;
}

/* ================= TOAST ================= */

.toast{
    position:absolute;
    left:50%;
    bottom:85px;
    transform:translateX(-50%);
    background:#fff;
    color:#111;
    padding:12px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    z-index:300;
    display:none;
}

.toast.show{
    display:block;
}

@media(max-width:480px){
    .app{
        max-width:none;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= AUTH SCREEN ================= -->

<section id="authScreen" class="auth-screen">

    <div class="auth-box">

        <div class="auth-logo">

        </div>

        <p class="auth-subtitle">

        <input

            placeholder="Email"

        >

        </button>

        <button class="auth-login-button" onclick="loginAccount()">

        </button>

<!-- ================= CAMERA ================= -->

<section id="cameraScreen" class="screen camera-screen">

    <video id="video" autoplay playsinline></video>

    <div class="camera-overlay">

        <div class="camera-top">

            <div class="logo">
                Vibe<span>Snap</span>
            </div>

            <div class="profile-small" onclick="openScreen('profile')">

            </div>

        </div>

        <div class="camera-tools">

            <button class="tool-button" onclick="switchCamera()">
                🔄
            </button>

            <button class="tool-button" onclick="openMediaPicker()">
                🖼️
            </button>

            <button class="tool-button" onclick="showToast('Effects coming soon')">
                ✨
            </button>

        </div>

        <div class="filters">

            <button class="filter-button active"
                    onclick="setFilter('none',this)">
                Normal
            </button>

            <button class="filter-button"
                    onclick="setFilter('grayscale(1)',this)">
                B&W
            </button>

            <button class="filter-button"
                    onclick="setFilter('sepia(0.7)',this)">
                Retro
            </button>

            <button class="filter-button"
                    onclick="setFilter('saturate(1.8)',this)">
                Vivid
            </button>

            <button class="filter-button"
                    onclick="setFilter('contrast(1.5)',this)">

        <div class="capture-area">

            <button
                class="capture-button"

            </button>

    <input

<!-- ================= CHATS ================= -->

<section id="chatsScreen" class="screen">

<!-- ================= PROFILE ================= -->

<section id="profileScreen" class="screen">

        >

    </div>

    <div class="send-friend">

        <div class="avatar">J</div>

        <div class="user-info">
            <div class="user-name">Jay</div>
        </div>

            class="send-check"

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore-compat.js"></script>

<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyC8_0DykQ_yyQT3xzVmpZ9TPML0jOcKmDc",

    authDomain:
        "vibesnap-213d4.firebaseapp.com",

    projectId:
        "vibesnap-213d4",

    storageBucket:
        "vibesnap-213d4.firebasestorage.app",

    messagingSenderId:
        "933479938239",

    appId:
        "1:933479938239:web:d120d7ba99f5665987ae0a",

    measurementId:
        "G-HP0QL3C8Y"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

/* FIRESTORE CONNECTION */
const db = firebase.firestore();


/* =========================================================
   VARIABLES
========================================================= */

let stream = null;

let facingMode = "user";

let currentFilter = "none";

let capturedPhoto = null;

let selectedFriends = [];


/* =========================================================
   AUTH
========================================================= */

function showAuthMessage(message){

    document.getElementById("authMessage").textContent = message;

}


function clearAuthFields(){

    document.getElementById("emailInput").value = "";

    document.getElementById("passwordInput").value = "";

}


function getAuthValues(){

    return {

        email:
            document.getElementById("emailInput")
                .value
                .trim(),

        password:
            document.getElementById("passwordInput")
                .value

    };

}


/* CREATE ACCOUNT */

async function createAccount(){

    const {email,password} = getAuthValues();

    if(!email || !password){

        showAuthMessage(
            "Enter your email and password."
        );

        return;
    }

    if(password.length < 6){

        showAuthMessage(
            "Password must be at least 6 characters."
        );

        return;
    }

    showAuthMessage(
        "Creating your account..."
    );

    try{

        const result =
            await auth.createUserWithEmailAndPassword(
                email,
                password
            );

        /* CREATE BASIC USER PROFILE IN FIRESTORE */

        await db
            .collection("users")
            .doc(result.user.uid)
            .set({

                email: email,

                username:
                    email.split("@")[0],

                createdAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });

        showAuthMessage("");

    }catch(error){

        console.log(error);

        showAuthMessage(
            getAuthError(error)
        );

    }

}


/* LOGIN */

async function loginAccount(){

    const {email,password} = getAuthValues();

    if(!email || !password){

        showAuthMessage(
            "Enter your email and password."
        );

        return;
    }

    showAuthMessage(
        "Logging in..."
    );

    try{

        await auth.signInWithEmailAndPassword(
            email,
            password
        );

        showAuthMessage("");

    }catch(error){

        console.log(error);

        showAuthMessage(
            getAuthError(error)
        );

    }

}


/* LOGOUT */

async function logoutAccount(){

    try{

        stopCamera();

        await auth.signOut();

    }catch(error){

        console.log(error);

        showToast(
            "Could not log out"
        );

    }

}


/* FIREBASE ERROR MESSAGES */

function getAuthError(error){

    switch(error.code){

        case "auth/invalid-email":

            return "Please enter a valid email.";

        case "auth/email-already-in-use":

            return "That email already has an account. Try Log In.";

        case "auth/weak-password":

            return "Choose a stronger password.";

        case "auth/invalid-credential":

        case "auth/wrong-password":

        case "auth/user-not-found":

            return "Email or password is incorrect.";

        case "auth/too-many-requests":

            return "Too many attempts. Please try again later.";

        case "auth/network-request-failed":

            return "Network error. Check your internet connection.";

        default:

            return error.message ||
                "Something went wrong.";

    }

}


/* SHOW MAIN APP */

function showMainApp(user){

    document
        .getElementById("authScreen")
        .classList
        .add("hidden");

    const email =
        user.email || "";

    const username =
        email
            ? email.split("@")[0]
            : "username";

    document
        .getElementById("profileEmail")
        .textContent =
            "@" + username;

    const firstLetter =
        email
            ? email.charAt(0).toUpperCase()
            : "U";

    document
        .getElementById("profileAvatar")
        .textContent =
            firstLetter;

    document
        .querySelector(".profile-small")
        .textContent =
            firstLetter;

    document
        .getElementById("profileName")
        .textContent =
            "Your Profile";

    openScreen("camera");

}


/* SHOW LOGIN */

function showLogin(){

    stopCamera();

    document
        .getElementById("authScreen")
        .classList
        .remove("hidden");

    clearAuthFields();

    showAuthMessage("");

}


/* FIREBASE AUTH LISTENER */

auth.onAuthStateChanged(function(user){

    if(user){

        showMainApp(user);

    }else{

        showLogin();

    }

});


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        if(stream){

            stream
                .getTracks()
                .forEach(track => track.stop());

        }

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:facingMode
                },

                audio:false

            });

        const video =
            document.getElementById("video");

        video.srcObject =
            stream;

        video.style.filter =
            currentFilter;

    }catch(error){

        console.log(error);

        showToast(
            "Camera permission is needed."
        );

    }

}


function stopCamera(){

    if(stream){

        stream
            .getTracks()
            .forEach(track => track.stop());

        stream = null;

    }

}


async function switchCamera(){

    facingMode =
        facingMode === "user"
            ? "environment"
            : "user";

    await startCamera();

}


/* =========================================================
   CAPTURE PHOTO
========================================================= */

function capturePhoto(){

    const video =
        document.getElementById("video");

    if(!video.videoWidth){

        showToast(
            "Camera is not ready."
        );

        return;

    }

    const canvas =
        document.createElement("canvas");

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    const ctx =
        canvas.getContext("2d");

    ctx.filter =
        currentFilter;

    if(facingMode === "user"){

        ctx.translate(
            canvas.width,
            0
        );

        ctx.scale(
            -1,
            1
        );

    }

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    capturedPhoto =
        canvas.toDataURL(
            "image/jpeg",
            0.9
        );

    document
        .getElementById("previewImage")
        .src =
            capturedPhoto;

    document
        .getElementById("previewOverlay")
        .classList
        .add("active");

}


/* =========================================================
   RETAKE
========================================================= */

function retakePhoto(){

    capturedPhoto = null;

    document
        .getElementById("previewOverlay")
        .classList
        .remove("active");

}


/* =========================================================
   SEND PANEL
========================================================= */

function openSendPanel(){

    document
        .getElementById("sendPanel")
        .classList
        .add("active");

}


function toggleFriend(checkbox){

    const friend =
        checkbox.value;

    if(checkbox.checked){

        if(!selectedFriends.includes(friend)){

            selectedFriends.push(friend);

        }

    }else{

        selectedFriends =
            selectedFriends.filter(
                name => name !== friend
            );

    }

}


function sendPhoto(){

    if(!capturedPhoto){

        showToast(
            "Take a photo first."
        );

        return;

    }

    if(selectedFriends.length === 0){

        showToast(
            "Select at least one friend."
        );

        return;

    }

    const names =
        selectedFriends.join(", ");

    document
        .getElementById("sendPanel")
        .classList
        .remove("active");

    document
        .getElementById("previewOverlay")
        .classList
        .remove("active");

    selectedFriends = [];

    document
        .querySelectorAll(".send-check")
        .forEach(check => {

            check.checked = false;

        });

    showToast(
        "Photo sent to " + names
    );

}


/* =========================================================
   FILTERS
========================================================= */

function setFilter(filter,button){

    currentFilter =
        filter;

    document
        .getElementById("video")
        .style
        .filter =
            filter;

    document
        .querySelectorAll(".filter-button")
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });

    button.classList.add(
        "active"
    );

}


/* =========================================================
   MEDIA PICKER
========================================================= */

function openMediaPicker(){

    document
        .getElementById("mediaInput")
        .click();

}


function handleMediaPicker(event){

    const file =
        event.target.files[0];

    if(!file){

        return;

    }

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            capturedPhoto =
                e.target.result;

            document
                .getElementById("previewImage")
                .src =
                    capturedPhoto;

            document
                .getElementById("previewOverlay")
                .classList
                .add("active");

        };

    reader.readAsDataURL(file);

    event.target.value = "";

}


/* =========================================================
   NAVIGATION
========================================================= */

function openScreen(screen){

    if(!auth.currentUser){

        return;

    }

    document
        .querySelectorAll(".screen")
        .forEach(section => {

            section.classList.remove(
                "active"
            );

        });

    document
        .getElementById(
            screen + "Screen"
        )
        .classList
        .add("active");

    document
        .querySelectorAll(".nav-button")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });

    const nav =
        document.getElementById(
            "nav" +
            screen.charAt(0).toUpperCase() +
            screen.slice(1)
        );

    if(nav){

        nav.classList.add(
            "active"
        );

    }

    if(screen === "camera"){

        startCamera();

    }else{

        stopCamera();

    }

}


/* =========================================================
   SEARCH
========================================================= */

function searchUsers(value){

    const items =
        document.querySelectorAll(
            "#chatList .user-item"
        );

    value =
        value.toLowerCase();

    items.forEach(item => {

        const name =
            item
                .querySelector(".user-name")
                .textContent
                .toLowerCase();

        item.style.display =
            name.includes(value)
                ? "flex"
                : "none";

    });

}


function searchFriends(value){

    const items =
        document.querySelectorAll(
            "#friendList .user-item"
        );

    value =
        value.toLowerCase();

    items.forEach(item => {

        const name =
            item
                .querySelector(".user-name")
                .textContent
                .toLowerCase();

        item.style.display =
            name.includes(value)
                ? "flex"
                : "none";

    });

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}

</script>
