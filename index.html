<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeSnap</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:white;
    min-height:100vh;
}

button{
    border:none;
    cursor:pointer;
    font-family:inherit;
}

.hidden{
    display:none!important;
}

/* ================= AUTH ================= */

#authScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#252000,#090909 45%,#000);
}

.authBox{
    width:100%;
    max-width:420px;
    background:#111;
    border:1px solid #2d2d2d;
    border-radius:24px;
    padding:32px 24px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
    font-size:38px;
    font-weight:900;
    color:#ffd400;
}

.tagline{
    color:#999;
    margin:8px 0 28px;
}

.authBtn{
    width:100%;
    padding:15px;
    border-radius:14px;
    margin-top:12px;
    font-size:16px;
    font-weight:bold;
}

.googleBtn{
    background:#fff;
    color:#111;
}

.phoneBtn{
    background:#ffd400;
    color:#000;
}

.signupBtn{
    background:#202020;
    color:#fff;
    border:1px solid #333;
}

#phoneBox{
    margin-top:18px;
}

#phoneNumber,
#otpCode{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #333;
    background:#181818;
    color:#fff;
    outline:none;
    margin-top:8px;
}

.smallBtn{
    padding:11px 15px;
    border-radius:10px;
    background:#ffd400;
    color:#000;
    font-weight:bold;
    margin-top:10px;
}

.status{
    margin-top:15px;
    color:#aaa;
    font-size:14px;
    min-height:20px;
}

/* ================= APP ================= */

#app{
    min-height:100vh;
    display:none;
}

.topbar{
    height:65px;
    background:#111;
    border-bottom:1px solid #292929;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:50;
}

.topLogo{
    color:#ffd400;
    font-size:25px;
    font-weight:900;
}

.topActions{
    display:flex;
    gap:8px;
}

.iconBtn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#202020;
    color:#fff;
    font-size:20px;
}

.main{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

/* ================= HOME ================= */

.welcome{
    background:linear-gradient(135deg,#191919,#101010);
    border:1px solid #292929;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
}

.welcome h2{
    margin-bottom:6px;
}

.welcome p{
    color:#999;
}

.sectionTitle{
    font-size:20px;
    font-weight:bold;
    margin:20px 0 12px;
}

.userCard{
    background:#151515;
    border:1px solid #292929;
    border-radius:16px;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.userInfo{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#ffd400;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

.userName{
    font-weight:bold;
}

.userEmail{
    color:#777;
    font-size:13px;
    margin-top:3px;
}

.chatBtn{
    background:#ffd400;
    color:#000;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

/* ================= CHAT ================= */

.chatHeader{
    background:#111;
    border:1px solid #292929;
    border-radius:16px 16px 0 0;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
}

.backBtn{
    background:#222;
    color:#fff;
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:20px;
}

.chatName{
    font-weight:bold;
}

.messages{
    height:calc(100vh - 220px);
    min-height:400px;
    overflow-y:auto;
    background:#0b0b0b;
    border-left:1px solid #292929;
    border-right:1px solid #292929;
    padding:18px;
}

.message{
    max-width:75%;
    padding:10px 13px;
    border-radius:15px;
    margin-bottom:10px;
    word-break:break-word;
}

.message.me{
    margin-left:auto;
    background:#ffd400;
    color:#000;
    border-bottom-right-radius:4px;
}

.message.them{
    background:#202020;
    color:#fff;
    border-bottom-left-radius:4px;
}

.message img,
.message video{
    max-width:100%;
    max-height:350px;
    border-radius:12px;
    display:block;
}

.messageTime{
    font-size:10px;
    opacity:.6;
    margin-top:5px;
}

.chatInputBar{
    display:flex;
    gap:8px;
    padding:12px;
    background:#111;
    border:1px solid #292929;
    border-radius:0 0 16px 16px;
}

.messageInput{
    flex:1;
    background:#1d1d1d;
    color:#fff;
    border:1px solid #333;
    border-radius:13px;
    padding:13px;
    outline:none;
}

.sendBtn{
    width:48px;
    border-radius:13px;
    background:#ffd400;
    color:#000;
    font-size:20px;
    font-weight:bold;
}

.mediaBtn{
    width:48px;
    border-radius:13px;
    background:#222;
    color:#fff;
    font-size:20px;
}

/* ================= CAMERA ================= */

.cameraPage{
    max-width:650px;
    margin:auto;
}

.cameraBox{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    max-height:75vh;
    background:#000;
    border-radius:22px;
    overflow:hidden;
    border:1px solid #292929;
}

#cameraVideo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:#000;
}

#photoCanvas{
    display:none;
}

#photoPreview,
#videoPreview{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
    display:none;
}

.cameraTop{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    z-index:20;
}

.cameraTop button{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:#fff;
    font-size:20px;
}

.cameraBottom{
    position:absolute;
    bottom:18px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:28px;
    z-index:20;
}

.captureBtn{
    width:72px;
    height:72px;
    border-radius:50%;
    background:#fff;
    border:7px solid rgba(255,255,255,.4);
}

.recordBtn{
    width:72px;
    height:72px;
    border-radius:50%;
    background:#ff3030;
    border:7px solid rgba(255,255,255,.4);
}

.recordBtn.recording{
    background:#ff3030;
    transform:scale(.8);
    box-shadow:0 0 0 6px rgba(255,48,48,.25);
}

.galleryBtn,
.flipBtn{
    width:50px;
    height:50px;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:#fff;
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.previewControls{
    position:absolute;
    bottom:20px;
    left:15px;
    right:15px;
    display:none;
    justify-content:space-between;
    align-items:center;
    z-index:30;
}

.previewCancel{
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(0,0,0,.75);
    color:#fff;
    font-size:30px;
}

.previewSend{
    padding:14px 24px;
    border-radius:15px;
    background:#ffd400;
    color:#000;
    font-size:17px;
    font-weight:bold;
}

.recordingIndicator{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    color:#fff;
    padding:8px 14px;
    border-radius:20px;
    font-size:14px;
    z-index:25;
    display:none;
}

.recordingDot{
    display:inline-block;
    width:9px;
    height:9px;
    background:red;
    border-radius:50%;
    margin-right:6px;
}

.cameraMode{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:15px;
}

.modeBtn{
    color:#777;
    background:none;
    font-weight:bold;
}

.modeBtn.active{
    color:#ffd400;
}

/* ================= PROFILE ================= */

.profileBox{
    max-width:500px;
    margin:auto;
    background:#151515;
    border:1px solid #292929;
    border-radius:20px;
    padding:25px;
}

.profileAvatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#ffd400;
    color:#000;
    margin:0 auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
}

.profileBox h2{
    text-align:center;
}

.profileEmail{
    text-align:center;
    color:#777;
    margin-top:5px;
}

.logoutBtn{
    width:100%;
    padding:14px;
    background:#292929;
    color:#fff;
    border-radius:12px;
    margin-top:25px;
}

@media(max-width:600px){

    .main{
        padding:12px;
    }

    .messages{
        height:calc(100vh - 215px);
        min-height:300px;
    }

    .cameraBox{
        aspect-ratio:3/4;
        max-height:none;
    }

    .message{
        max-width:85%;
    }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authScreen">

    <div class="authBox">

        <div class="logo">VibeSnap</div>

        <div class="tagline">
            Connect. Chat. Share your vibe.
        </div>

        <button
            class="authBtn googleBtn"
            id="googleLogin">
            Continue with Google
        </button>

        <button
            class="authBtn phoneBtn"
            id="showPhone">
            Login with Phone Number
        </button>

        <button
            class="authBtn signupBtn"
            id="requestAccount">
            Request an Account
        </button>

        <div id="phoneBox" class="hidden">

            <input
                id="phoneNumber"
                type="tel"
                placeholder="+91XXXXXXXXXX">

            <div id="recaptcha-container"></div>

            <button
                class="smallBtn"
                id="sendOTP">
                Send OTP
            </button>

            <input
                id="otpCode"
                class="hidden"
                type="number"
                placeholder="Enter OTP">

            <button
                id="verifyOTP"
                class="smallBtn hidden">
                Verify OTP
            </button>

        </div>

        <div id="authStatus" class="status"></div>

    </div>

</div>


<!-- ================= APP ================= -->

<div id="app">

    <header class="topbar">

        <div class="topLogo">
            VibeSnap
        </div>

        <div class="topActions">

            <button
                class="iconBtn"
                id="homeBtn">
                🏠
            </button>

            <button
                class="iconBtn"
                id="cameraBtn">
                📸
            </button>

            <button
                class="iconBtn"
                id="profileBtn">
                👤
            </button>

        </div>

    </header>


    <main class="main">

        <!-- HOME -->

        <section
            id="homeScreen"
            class="screen active">

            <div class="welcome">

                <h2>
                    Welcome to VibeSnap 👋
                </h2>

                <p id="welcomeText">
                    Loading your profile...
                </p>

            </div>

            <div class="sectionTitle">
                People on VibeSnap
            </div>

            <div id="usersList">
                Loading...
            </div>

        </section>


        <!-- CHAT -->

        <section
            id="chatScreen"
            class="screen">

            <div class="chatHeader">

                <button
                    class="backBtn"
                    id="backFromChat">
                    ←
                </button>

                <div
                    class="avatar"
                    id="chatAvatar">
                    ?
                </div>

                <div
                    class="chatName"
                    id="chatUserName">
                    Chat
                </div>

            </div>

            <div
                id="messages"
                class="messages">
            </div>

            <div class="chatInputBar">

                <button
                    class="mediaBtn"
                    id="chatMediaBtn">
                    📎
                </button>

                <input
                    class="messageInput"
                    id="messageInput"
                    type="text"
                    placeholder="Type a message...">

                <button
                    class="sendBtn"
                    id="sendMessage">
                    ➤
                </button>

            </div>

            <input
                type="file"
                id="chatFileInput"
                accept="image/*,video/*"
                class="hidden">

        </section>


        <!-- CAMERA -->

        <section
            id="cameraScreen"
            class="screen">

            <div class="cameraPage">

                <div class="cameraBox">

                    <video
                        id="cameraVideo"
                        autoplay
                        playsinline
                        muted>
                    </video>

                    <canvas id="photoCanvas"></canvas>

                    <img
                        id="photoPreview"
                        alt="Captured photo">

                    <video
                        id="videoPreview"
                        controls
                        playsinline>
                    </video>

                    <div
                        id="recordingIndicator"
                        class="recordingIndicator">

                        <span class="recordingDot"></span>
                        Recording...

                    </div>

                    <div class="cameraTop">

                        <button id="closeCamera">
                            ✕
                        </button>

                        <button id="flipCamera">
                            🔄
                        </button>

                    </div>


                    <!-- PHOTO CONTROLS -->

                    <div
                        id="photoCameraControls"
                        class="cameraBottom">

                        <label
                            class="galleryBtn"
                            title="Gallery">

                            🖼️

                            <input
                                id="cameraGalleryInput"
                                type="file"
                                accept="image/*,video/*"
                                class="hidden">

                        </label>

                        <button
                            id="capturePhoto"
                            class="captureBtn">
                        </button>

                        <button
                            id="switchVideo"
                            class="flipBtn">
                            🎥
                        </button>

                    </div>


                    <!-- VIDEO CONTROLS -->

                    <div
                        id="videoCameraControls"
                        class="cameraBottom hidden">

                        <label
                            class="galleryBtn"
                            title="Gallery">

                            🖼️

                            <input
                                id="videoGalleryInput"
                                type="file"
                                accept="image/*,video/*"
                                class="hidden">

                        </label>

                        <button
                            id="recordVideo"
                            class="recordBtn">
                        </button>

                        <button
                            id="switchPhoto"
                            class="flipBtn">
                            📷
                        </button>

                    </div>


                    <!-- PHOTO PREVIEW -->

                    <div
                        id="photoPreviewControls"
                        class="previewControls">

                        <button
                            id="discardPhoto"
                            class="previewCancel"
                            title="Retake photo">
                            ✕
                        </button>

                        <button
                            id="sendCapturedPhoto"
                            class="previewSend">
                            Send Photo ➤
                        </button>

                    </div>


                    <!-- VIDEO PREVIEW -->

                    <div
                        id="videoPreviewControls"
                        class="previewControls">

                        <button
                            id="discardVideo"
                            class="previewCancel"
                            title="Retake video">
                            ✕
                        </button>

                        <button
                            id="sendCapturedVideo"
                            class="previewSend">
                            Send Video ➤
                        </button>

                    </div>

                </div>


                <div class="cameraMode">

                    <button
                        id="photoModeBtn"
                        class="modeBtn active">
                        PHOTO
                    </button>

                    <button
                        id="videoModeBtn"
                        class="modeBtn">
                        VIDEO
                    </button>

                </div>

            </div>

        </section>


        <!-- PROFILE -->

        <section
            id="profileScreen"
            class="screen">

            <div class="profileBox">

                <div
                    id="profileAvatar"
                    class="profileAvatar">
                    ?
                </div>

                <h2 id="profileName">
                    User
                </h2>

                <div
                    id="profileEmail"
                    class="profileEmail">
                </div>

                <button
                    id="logoutBtn"
                    class="logoutBtn">
                    Log Out
                </button>

            </div>

        </section>

    </main>

</div>


<script type="module">

/* ================= FIREBASE IMPORTS ================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyC8_0DykQ_yyQT3xzVmpZ9TPML0jOcDc",

    authDomain:
        "vibesnap-213d4.firebaseapp.com",

    projectId:
        "vibesnap-213d4",

    storageBucket:
        "vibesnap-213d4.firebasestorage.app",

    messagingSenderId:
        "933479938239",

    appId:
        "1:933479938239:web:d120d7ba99f5665987ae0a",

    measurementId:
        "G-HP0QL3C8Y"
};


/* ================= INITIALIZE ================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const storage =
    getStorage(app);


/* ================= VARIABLES ================= */

let currentUser = null;
let currentChatUser = null;
let currentChatId = null;
let unsubscribeMessages = null;

let cameraStream = null;
let currentFacingMode = "user";

let capturedPhotoBlob = null;
let capturedVideoBlob = null;

let videoRecorder = null;
let videoChunks = [];

let confirmationResult = null;
let recaptchaVerifier = null;

let cameraMode = "photo";


/* ================= ELEMENTS ================= */

const authScreen =
    document.getElementById("authScreen");

const appScreen =
    document.getElementById("app");

const authStatus =
    document.getElementById("authStatus");

const phoneBox =
    document.getElementById("phoneBox");

const otpCode =
    document.getElementById("otpCode");

const verifyOTP =
    document.getElementById("verifyOTP");

const usersList =
    document.getElementById("usersList");

const welcomeText =
    document.getElementById("welcomeText");

const cameraVideo =
    document.getElementById("cameraVideo");

const photoCanvas =
    document.getElementById("photoCanvas");

const photoPreview =
    document.getElementById("photoPreview");

const videoPreview =
    document.getElementById("videoPreview");

const photoCameraControls =
    document.getElementById("photoCameraControls");

const videoCameraControls =
    document.getElementById("videoCameraControls");

const photoPreviewControls =
    document.getElementById("photoPreviewControls");

const videoPreviewControls =
    document.getElementById("videoPreviewControls");

const recordingIndicator =
    document.getElementById("recordingIndicator");

const recordVideoButton =
    document.getElementById("recordVideo");


/* ================= AUTH MESSAGE ================= */

function showAuthMessage(message){

    authStatus.textContent = message;

}


/* ================= GOOGLE LOGIN ================= */

document
.getElementById("googleLogin")
.addEventListener("click",async()=>{

    try{

        showAuthMessage(
            "Opening Google login..."
        );

        const provider =
            new GoogleAuthProvider();

        await signInWithPopup(
            auth,
            provider
        );

    }catch(error){

        console.error(error);

        showAuthMessage(
            "Google login failed: " +
            error.message
        );

    }

});


/* ================= PHONE LOGIN ================= */

document
.getElementById("showPhone")
.addEventListener("click",()=>{

    phoneBox.classList.toggle(
        "hidden"
    );

});


function createRecaptcha(){

    if(recaptchaVerifier){
        return;
    }

    recaptchaVerifier =
        new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {
                size:"normal"
            }
        );

}


document
.getElementById("sendOTP")
.addEventListener("click",async()=>{

    const phone =
        document
        .getElementById("phoneNumber")
        .value
        .trim();

    if(!phone){

        showAuthMessage(
            "Enter your phone number."
        );

        return;
    }

    try{

        createRecaptcha();

        showAuthMessage(
            "Sending OTP..."
        );

        confirmationResult =
            await signInWithPhoneNumber(
                auth,
                phone,
                recaptchaVerifier
            );

        otpCode.classList.remove(
            "hidden"
        );

        verifyOTP.classList.remove(
            "hidden"
        );

        showAuthMessage(
            "OTP sent. Enter it below."
        );

    }catch(error){

        console.error(error);

        showAuthMessage(
            "OTP error: " +
            error.message
        );

        if(recaptchaVerifier){

            recaptchaVerifier.clear();

            recaptchaVerifier = null;

        }

    }

});


verifyOTP.addEventListener(
    "click",
    async()=>{

        const code =
            otpCode.value.trim();

        if(!code){

            showAuthMessage(
                "Enter the OTP."
            );

            return;
        }

        if(!confirmationResult){

            showAuthMessage(
                "Please request an OTP first."
            );

            return;
        }

        try{

            showAuthMessage(
                "Verifying..."
            );

            await confirmationResult.confirm(
                code
            );

        }catch(error){

            console.error(error);

            showAuthMessage(
                "Wrong OTP or expired OTP."
            );

        }

    }
);


/* ================= ACCOUNT REQUEST ================= */

document
.getElementById("requestAccount")
.addEventListener("click",async()=>{

    const email =
        prompt(
            "Enter your email:"
        );

    if(!email){
        return;
    }

    const username =
        prompt(
            "Choose your VibeSnap username:"
        );

    if(!username){
        return;
    }

/* ================= USER PROFILE ================= */

async function createUserProfile(){

    if(!currentUser){
        return;
    }

    const userRef =
        doc(
            db,
            "users",
            currentUser.uid
        );

    const existing =
        await getDoc(
            userRef
        );

    if(!existing.exists()){

        await setDoc(
            userRef,
            {
                uid:
                    currentUser.uid,

                name:
                    currentUser.displayName ||
                    "VibeSnap User",

                email:
                    currentUser.email ||
                    "",

                phone:
                    currentUser.phoneNumber ||
                    "",

                photoURL:
                    currentUser.photoURL ||
                    "",

                    serverTimestamp()
            }

    }

}


/* ================= LOAD USERS ================= */

async function loadUsers(){

    usersList.innerHTML =
        "Loading users...";

    try{

        const snapshot =
            await new Promise(
                (resolve,reject)=>{

                    let unsubscribe;

                    unsubscribe =
                        onSnapshot(
                            collection(
                                db,
                                "users"
                            ),
                            snap=>{

                                unsubscribe();

                                resolve(
                                    snap
                                );

                            },
                            error=>{

                                unsubscribe();

                                reject(
                                    error
                                );

                            }
                        );

                }
            );

        usersList.innerHTML = "";

        let found = false;

        snapshot.forEach(
            userDoc=>{

                const user =
                    userDoc.data();

                if(
                    currentUser &&
                    user.uid ===
                    currentUser.uid
                ){

                    return;

                }

                found = true;

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "userCard";

                const initial =
                    (
                        user.name ||
                        "U"
                    )
                    .charAt(0)
                    .toUpperCase();

                card.innerHTML = `

                    <div class="userInfo">

                        <div class="avatar">
                            ${escapeHtml(initial)}
                        </div>

                        <div>

                            <div class="userName">
                                ${escapeHtml(
                                    user.name ||
                                    "VibeSnap User"
                                )}
                            </div>

                            <div class="userEmail">
                                ${escapeHtml(
                                    user.email ||
                                    user.phone ||
                                    ""
                                )}
                            </div>

                        </div>

                    </div>

                    <button class="chatBtn">
                        Chat
                    </button>
                `;

                card
                .querySelector(".chatBtn")
                .addEventListener(
                    "click",
                    ()=>openChat(user)
                );

                usersList.appendChild(
                    card
                );

            }
        );

        if(!found){

            usersList.innerHTML =
                `
                <div class="welcome">
                    No other users yet.
                </div>
                `;

        }

    }catch(error){

        console.error(error);

        usersList.innerHTML =
            `
            <div class="welcome">
                Could not load users.
                <br><br>
                Firebase Firestore rules may need to be updated.
            </div>
            `;

    }

}

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

async function openChat(user){

        .join("_");

function loadMessages(){

    const messagesElement =
        document.getElementById(
            "messages"
        );

    messagesElement.innerHTML =
        "";

    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages =
            null;

    }

    const messagesRef =
        collection(
            db,
            "chats",
            currentChatId,
            "messages"
        );

    const q =
        query(
            messagesRef,
            orderBy(
                "createdAt",
                "asc"
            )
        );

    unsubscribeMessages =
        onSnapshot(
            q,
            snapshot=>{

                messagesElement.innerHTML =
                    "";

                snapshot.forEach(
                    messageDoc=>{

                        renderMessage(
                            messageDoc.data()
                        );

                    }
                );

                messagesElement.scrollTop =
                    messagesElement.scrollHeight;

            },
            error=>{

                console.error(
                    "Message error:",
                    error
                );

            }
        );

}


function renderMessage(data){

    const messagesElement =
        document.getElementById(
            "messages"
        );

    const message =
        document.createElement(
            "div"
        );

    const mine =
        data.senderUid ===
        currentUser.uid;

    message.className =
        mine
        ? "message me"
        : "message them";

    if(data.type === "image"){

        const img =
            document.createElement(
                "img"
            );

        img.src =
            data.mediaUrl;

        img.alt =
            "Photo";

        img.loading =
            "lazy";

        message.appendChild(
            img
        );

    }else if(
        data.type === "video"
    ){

        const video =
            document.createElement(
                "video"
            );

        video.src =
            data.mediaUrl;

        video.controls =
            true;

        video.playsInline =
            true;

        video.preload =
            "metadata";

        message.appendChild(
            video
        );

    }else{

        const text =
            document.createElement(
                "div"
            );

        text.textContent =
            data.text || "";

        message.appendChild(
            text
        );

    }

    const time =
        document.createElement(
            "div"
        );

    time.className =
        "messageTime";

    time.textContent =
        mine
        ? "You"
        : (
            currentChatUser?.name ||
            "User"
        );

    message.appendChild(
        time
    );

    messagesElement.appendChild(
        message
    );

}

/* ================= UPLOAD MEDIA ================= */

async function uploadChatMedia(file){

    if(
        !file ||
        !currentChatUser
    ){
        return;
    }

    if(
        !file.type.startsWith("image/") &&
        !file.type.startsWith("video/")
    ){

        alert(
            "Please select an image or video."
        );

        return;
    }

    try{

        const messageRef =
            doc(
                collection(
                    db,
                    "chats",
                    currentChatId,
                    "messages"
                )
            );

        const extension =
            getExtension(
                file.name,
                file.type
            );

        const storagePath =
            `chatMedia/${currentChatId}/${messageRef.id}.${extension}`;

        const storageRef =
            ref(
                storage,
                storagePath
            );

        await uploadBytes(
            storageRef,
            file,
            {
                contentType:
                    file.type
            }
        );

        const downloadURL =
            await getDownloadURL(
                storageRef
            );

        const type =
            file.type.startsWith(
                "video/"
            )
            ? "video"
            : "image";

        await setDoc(
            messageRef,
            {
                senderUid:
                    currentUser.uid,

                receiverUid:
                    currentChatUser.uid,

                type:
                    type,

                mediaUrl:
                    downloadURL,

                storagePath:
                    storagePath,

                createdAt:
                    serverTimestamp()
            }
        );

    }catch(error){

        console.error(error);

        alert(
            "Media could not be sent: " +
            error.message
        );

    }

}


/* ================= EXTENSION ================= */

function getExtension(
    filename,
    mimeType
){

    const parts =
        filename.split(".");

    if(parts.length > 1){

        return parts
        .pop()
        .toLowerCase();

    }

    if(mimeType === "image/jpeg"){
        return "jpg";
    }

    if(mimeType === "image/png"){
        return "png";
    }

    if(mimeType === "image/webp"){
        return "webp";
    }

    if(mimeType === "video/webm"){
        return "webm";
    }

    if(mimeType === "video/mp4"){
        return "mp4";
    }

    if(mimeType.startsWith("video/")){
        return "webm";
    }

    return "bin";
}

/* ================= START CAMERA ================= */

async function startCamera(){

    try{

        stopVideoRecording();

        closeCamera();

        cameraStream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:
                        currentFacingMode
                },

                audio:true

            });

        cameraVideo.srcObject =
            cameraStream;

        await cameraVideo.play();

        resetPhotoPreview();
        resetVideoPreview();

        updateCameraControls();

    }catch(error){

        console.error(
            "Camera error:",
            error
        );

        alert(
            "Camera/microphone could not start.\n\n" +
            "Please allow Camera and Microphone permissions."
        );

    }

}


/* ================= CLOSE CAMERA ================= */

function closeCamera(){

    if(cameraStream){

        cameraStream
        .getTracks()
        .forEach(
            track=>track.stop()
        );

        cameraStream =
            null;
    }

    cameraVideo.srcObject =
        null;

}

function capturePhoto(){

    if(
        !cameraVideo.videoWidth ||
        !cameraVideo.videoHeight
    ){

        alert(
            "Camera is not ready yet."
        );

        return;
    }

    const width =
        cameraVideo.videoWidth;

    const height =
        cameraVideo.videoHeight;

    photoCanvas.width =
        width;

    photoCanvas.height =
        height;

    const context =
        photoCanvas.getContext("2d");

    context.drawImage(
        cameraVideo,
        0,
        0,
        width,
        height
    );

    photoCanvas.toBlob(
        blob=>{

            if(!blob){
                return;
            }

            capturedPhotoBlob =
                blob;

            const previewURL =
                URL.createObjectURL(
                    blob
                );

            photoPreview.src =
                previewURL;

            cameraVideo.style.display =
                "none";

            photoPreview.style.display =
                "block";

            photoPreviewControls.style.display =
                "flex";

            photoCameraControls.classList.add(
                "hidden"
            );

            videoCameraControls.classList.add(
                "hidden"
            );

        },
        "image/jpeg",
        0.92
    );

}

/* ================= START / STOP RECORDING ================= */

function toggleVideoRecording(){

    if(
        videoRecorder &&
        videoRecorder.state === "recording"
    ){

        stopVideoRecording();

        return;

    }

    startVideoRecording();

}


/* ================= START VIDEO RECORDING ================= */

function startVideoRecording(){

    if(!cameraStream){

        alert(
            "Camera is not ready."
        );

        return;
    }

    if(
        !cameraStream.getVideoTracks().length
    ){

        alert(
            "Camera video is unavailable."
        );

        return;
    }

    videoChunks = [];

    let mimeType = "";

    if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9,opus"
        )
    ){

        mimeType =
            "video/webm;codecs=vp9,opus";

    }else if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp8,opus"
        )
    ){

        mimeType =
            "video/webm;codecs=vp8,opus";

    }else if(
        MediaRecorder.isTypeSupported(
            "video/webm"
        )
    ){

        mimeType =
            "video/webm";

    }

    try{

        videoRecorder =
            mimeType
            ? new MediaRecorder(
                cameraStream,
                {mimeType}
            )
            : new MediaRecorder(
                cameraStream
            );

    }catch(error){

        console.error(error);

        alert(
            "This browser does not support camera video recording."
        );

        return;
    }

    videoRecorder.ondataavailable =
        event=>{

            if(
                event.data &&
                event.data.size > 0
            ){

                videoChunks.push(
                    event.data
                );

            }

        };


    videoRecorder.onstop =
        ()=>{

            const finalType =
                videoRecorder.mimeType ||
                "video/webm";

            capturedVideoBlob =
                new Blob(
                    videoChunks,
                    {
                        type:
                            finalType
                    }
                );

            const videoURL =
                URL.createObjectURL(
                    capturedVideoBlob
                );

            videoPreview.src =
                videoURL;

            videoPreview.style.display =
                "block";

            cameraVideo.style.display =
                "none";

            videoPreviewControls.style.display =
                "flex";

            recordingIndicator.style.display =
                "none";

            videoCameraControls.classList.add(
                "hidden"
            );

            videoChunks = [];

        };


    videoRecorder.onerror =
        event=>{

            console.error(
                "Recorder error:",
                event
            );

            recordingIndicator.style.display =
                "none";

            recordVideoButton.classList.remove(
                "recording"
            );

            alert(
                "Video recording failed."
            );

        };


    videoRecorder.start(
        250
    );

    recordingIndicator.style.display =
        "block";

    recordVideoButton.classList.add(
        "recording"
    );

    recordVideoButton.title =
        "Stop recording";

}


/* ================= STOP RECORDING ================= */

function stopVideoRecording(){

    if(
        videoRecorder &&
        videoRecorder.state === "recording"
    ){

        videoRecorder.stop();

        recordVideoButton.classList.remove(
            "recording"
        );

        recordVideoButton.title =
            "Start recording";

        return true;
    }

    return false;

}

function resetVideoPreview(){

}

        }

    }
);


/* =========================================================
   CAMERA MODES
========================================================= */

const photoModeBtn =
    document.getElementById(
        "photoModeBtn"
    );

const videoModeBtn =
    document.getElementById(
        "videoModeBtn"
    );


photoModeBtn.addEventListener(
    "click",
    ()=>{

        if(
            videoRecorder &&
            videoRecorder.state === "recording"
        ){

            alert(
                "Stop recording first."
            );

            return;
        }

        cameraMode =
            "photo";

        resetVideoPreview();
        resetPhotoPreview();

        updateCameraControls();

    }
);


videoModeBtn.addEventListener(
    "click",
    ()=>{

        cameraMode =
            "video";

        resetPhotoPreview();
        resetVideoPreview();

        updateCameraControls();

    }
);


document
.getElementById("switchVideo")
.addEventListener(
    "click",
    ()=>{

        videoModeBtn.click();

    }
);


document
.getElementById("switchPhoto")
.addEventListener(
    "click",
    ()=>{

        if(
            videoRecorder &&
            videoRecorder.state === "recording"
        ){

            alert(
                "Stop recording first."
            );

            return;
        }

        photoModeBtn.click();

    }
);


/* ================= UPDATE CAMERA CONTROLS ================= */

function updateCameraControls(){

    photoModeBtn.classList.toggle(
        "active",
        cameraMode === "photo"
    );

    videoModeBtn.classList.toggle(
        "active",
        cameraMode === "video"
    );

    if(
        photoPreview.style.display ===
        "block" ||
        videoPreview.style.display ===
        "block"
    ){

        photoCameraControls.classList.add(
            "hidden"
        );

        videoCameraControls.classList.add(
            "hidden"
        );

        return;
    }

    if(cameraMode === "photo"){

        photoCameraControls.classList.remove(
            "hidden"
        );

        videoCameraControls.classList.add(
            "hidden"
        );

    }else{

        photoCameraControls.classList.add(
            "hidden"
        );

        videoCameraControls.classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   GALLERY
========================================================= */

document
.getElementById("cameraGalleryInput")
.addEventListener(
    "change",
    async event=>{

        await uploadGalleryMedia(
            event.target.files[0]
        );

        event.target.value =
            "";

    }
);


document
.getElementById("videoGalleryInput")
.addEventListener(
    "change",
    async event=>{

        await uploadGalleryMedia(
            event.target.files[0]
        );

        event.target.value =
            "";

    }
);


async function uploadGalleryMedia(file){

    if(!file){
        return;
    }

    if(!currentChatUser){

        alert(
            "Open a chat first to send media."
        );

        return;
    }

    await uploadChatMedia(file);

}


/* =========================================================
   CLOSE CAMERA
========================================================= */

document
.getElementById("closeCamera")
.addEventListener(
    "click",
    ()=>{

        if(
            videoRecorder &&
            videoRecorder.state === "recording"
        ){

            videoRecorder.stop();

        }

        resetPhotoPreview();

        resetVideoPreview();

        closeCamera();

        showScreen(
            "homeScreen"
        );

    }
);


/* ================= CLEANUP ================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        if(
            videoRecorder &&
            videoRecorder.state === "recording"
        ){

            videoRecorder.stop();

        }

        closeCamera();

    }
);

</script>
