<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeSnap</title>

<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-storage-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
  min-height:100vh;
  overflow:hidden;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#111,#35105c,#001c35);
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:420px;
  background:rgba(20,20,20,.92);
  border-radius:25px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,.5);
}

.logo{
  font-size:42px;
  font-weight:bold;
  margin-bottom:10px;
}

.subtitle{
  color:#aaa;
  margin-bottom:30px;
}

.loginBtn{
  width:100%;
  padding:15px;
  margin:8px 0;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}

.googleBtn{
  background:#fff;
  color:#111;
}

.phoneBtn{
  background:#222;
  color:#fff;
  border:1px solid #555;
}

.accountBtn{
  background:#6c2cff;
  color:white;
}

#phoneBox{
  margin-top:15px;
}

#phoneNumber{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #555;
  background:#111;
  color:white;
  margin-bottom:8px;
}

#otpCode{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #555;
  background:#111;
  color:white;
  margin:8px 0;
}

/* APP */

#app{
  width:100%;
  height:100vh;
  position:relative;
  background:#000;
}

/* CAMERA */

#cameraPage{
  width:100%;
  height:calc(100vh - 72px);
  position:relative;
  background:#000;
  overflow:hidden;
}

#cameraVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

.cameraTop{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:5;
  background:linear-gradient(rgba(0,0,0,.65),transparent);
}

.cameraTitle{
  font-size:22px;
  font-weight:bold;
}

.cameraTop button{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  color:white;
  font-size:20px;
}

.filterBar{
  position:absolute;
  bottom:110px;
  left:0;
  right:0;
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 15px;
  z-index:5;
}

.filterBar::-webkit-scrollbar{
  display:none;
}

.filterBtn{
  flex:none;
  padding:9px 15px;
  border-radius:20px;
  background:rgba(0,0,0,.65);
  color:#fff;
  border:1px solid rgba(255,255,255,.3);
}

.filterBtn.active{
  background:#fff;
  color:#000;
}

.cameraControls{
  position:absolute;
  bottom:15px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  z-index:6;
}

.cameraSideBtn{
  width:50px;
  height:50px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:21px;
}

.captureBtn{
  width:72px;
  height:72px;
  border-radius:50%;
  background:white;
  border:6px solid rgba(255,255,255,.4);
  box-shadow:0 0 0 3px #fff inset;
}

.recording{
  background:#ff3030!important;
}

/* RECIPIENT */

.recipientBox{
  position:absolute;
  top:70px;
  left:15px;
  right:15px;
  z-index:7;
}

.recipientBox select{
  width:100%;
  padding:12px;
  border-radius:12px;
  background:rgba(0,0,0,.75);
  color:white;
  border:1px solid #777;
}

/* PAGES */

.page{
  height:calc(100vh - 72px);
  overflow:auto;
  padding:20px;
  background:#0b0b0b;
}

.pageTitle{
  font-size:28px;
  margin-bottom:20px;
}

/* FRIENDS */

.userCard{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  background:#171717;
  border-radius:15px;
  margin-bottom:10px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:linear-gradient(135deg,#743cff,#ff2e88);
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:20px;
}

.userInfo{
  flex:1;
}

.userName{
  font-weight:bold;
}

.userEmail{
  color:#999;
  font-size:13px;
}

.chatOpenBtn{
  background:#6c2cff;
  color:#fff;
  padding:9px 13px;
  border-radius:10px;
}

/* CHAT */

#chatPage{
  padding:0;
  display:flex;
  flex-direction:column;
}

.chatHeader{
  padding:15px;
  background:#151515;
  display:flex;
  align-items:center;
  gap:12px;
}

.chatMessages{
  flex:1;
  overflow:auto;
  padding:15px;
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:16px;
  margin-bottom:9px;
  word-break:break-word;
}

.mine{
  margin-left:auto;
  background:#6c2cff;
}

.theirs{
  background:#222;
}

.message img,
.message video{
  max-width:100%;
  border-radius:12px;
  margin-top:5px;
}

.chatInput{
  display:flex;
  gap:8px;
  padding:10px;
  background:#151515;
}

.chatInput input{
  flex:1;
  padding:13px;
  border-radius:12px;
  border:1px solid #444;
  background:#0d0d0d;
  color:#fff;
}

.chatInput button{
  padding:0 16px;
  border-radius:12px;
  background:#6c2cff;
  color:#fff;
}

/* PROFILE */

.profileBox{
  max-width:500px;
  margin:auto;
  background:#171717;
  padding:25px;
  border-radius:20px;
  text-align:center;
}

.profileAvatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:linear-gradient(135deg,#743cff,#ff2e88);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  font-weight:bold;
  margin:0 auto 15px;
}

.logoutBtn{
  margin-top:25px;
  width:100%;
  padding:14px;
  background:#d92929;
  color:white;
  border-radius:12px;
}

/* BOTTOM NAV */

.bottomNav{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:rgba(10,10,10,.97);
  border-top:1px solid #222;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:20;
}

.navBtn{
  background:none;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:12px;
}

.navBtn span{
  font-size:24px;
}

.navBtn.active{
  color:#fff;
}

/* PREVIEW */

#previewModal{
  position:fixed;
  inset:0;
  background:#000;
  z-index:100;
  display:flex;
  flex-direction:column;
}

#previewMedia{
  flex:1;
  width:100%;
  height:100%;
  object-fit:contain;
}

.previewButtons{
  display:flex;
  gap:10px;
  padding:15px;
}

.previewButtons button{
  flex:1;
  padding:14px;
  border-radius:12px;
  font-weight:bold;
}

.retakeBtn{
  background:#333;
  color:white;
}

.sendBtn{
  background:#6c2cff;
  color:white;
}

@media(min-width:700px){
  #cameraPage{
    max-width:600px;
    margin:auto;
  }

  .bottomNav{
    max-width:600px;
    left:50%;
    transform:translateX(-50%);
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="loginBox">

    <div class="logo">VibeSnap</div>

    <div class="subtitle">
      Snap. Share. Vibe.
    </div>

    <button class="loginBtn googleBtn" id="googleLogin">
      Continue with Google
    </button>

    <button class="loginBtn phoneBtn" id="showPhone">
      📱 Phone Number
    </button>

    <button class="loginBtn accountBtn" id="requestAccount">
      Request Account
    </button>

    <div id="phoneBox" class="hidden">

      <input
        id="phoneNumber"
        type="tel"
        placeholder="+91XXXXXXXXXX"
      >

      <button
        class="loginBtn phoneBtn"
        id="sendOTP"
      >
        Send OTP
      </button>

      <input
        id="otpCode"
        type="text"
        placeholder="Enter OTP"
      >

      <button
        class="loginBtn accountBtn"
        id="verifyOTP"
      >
        Verify OTP
      </button>

    </div>

    <div id="recaptcha-container"></div>

  </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

  <!-- CAMERA PAGE -->

  <div id="cameraPage">

    <video
      id="cameraVideo"
      autoplay
      playsinline
      muted
    ></video>

    <div class="cameraTop">

      <div class="cameraTitle">
        VibeSnap
      </div>

      <button id="flipCamera">
        🔄
      </button>

    </div>

    <div class="recipientBox">

      <select id="recipientSelect">
        <option value="">
          Select friend to send to
        </option>
      </select>

    </div>

    <div class="filterBar">

      <button class="filterBtn active" data-filter="none">
        Normal
      </button>

      <button class="filterBtn" data-filter="vivid">
        Vivid
      </button>

      <button class="filterBtn" data-filter="warm">
        Warm
      </button>

      <button class="filterBtn" data-filter="cool">
        Cool
      </button>

      <button class="filterBtn" data-filter="mono">
        Mono
      </button>

      <button class="filterBtn" data-filter="sepia">
        Sepia
      </button>

    </div>

    <div class="cameraControls">

      <button
        class="cameraSideBtn"
        id="galleryBtn"
      >
        🖼️
      </button>

      <button
        class="captureBtn"
        id="captureBtn"
      ></button>

      <button
        class="cameraSideBtn"
        id="videoModeBtn"
      >
        🎥
      </button>

    </div>

    <input
      type="file"
      id="galleryInput"
      accept="image/*,video/*"
      class="hidden"
    >

  </div>


  <!-- FRIENDS PAGE -->

  <div id="friendsPage" class="page hidden">

    <div class="pageTitle">
      Friends
    </div>

    <div id="usersList"></div>

  </div>


  <!-- CHAT PAGE -->

  <div id="chatPage" class="page hidden">

    <div class="chatHeader">

      <button
        id="backFromChat"
        style="background:none;color:white;font-size:22px;"
      >
        ←
      </button>

      <div id="chatAvatar" class="avatar">
        ?
      </div>

      <div>
        <div id="chatName">
          Chat
        </div>
      </div>

    </div>

    <div
      id="chatMessages"
      class="chatMessages"
    ></div>

    <div class="chatInput">

      <input
        id="messageInput"
        type="text"
        placeholder="Write a message..."
      >

      <button id="sendMessage">
        Send
      </button>

    </div>

  </div>


  <!-- PROFILE PAGE -->

  <div id="profilePage" class="page hidden">

    <div class="pageTitle">
      Profile
    </div>

    <div class="profileBox">

      <div
        id="profileAvatar"
        class="profileAvatar"
      >
        ?
      </div>

      <h2 id="profileName">
        User
      </h2>

      <p
        id="profileEmail"
        style="color:#999;margin-top:8px;"
      >
      </p>

      <button
        id="logoutBtn"
        class="logoutBtn"
      >
        Log Out
      </button>

    </div>

  </div>


  <!-- BOTTOM NAV -->

  <div class="bottomNav">

    <button
      class="navBtn active"
      data-page="camera"
    >
      <span>📸</span>
      Camera
    </button>

    <button
      class="navBtn"
      data-page="friends"
    >
      <span>👥</span>
      Friends
    </button>

    <button
      class="navBtn"
      data-page="chat"
    >
      <span>💬</span>
      Chat
    </button>

    <button
      class="navBtn"
      data-page="profile"
    >
      <span>👤</span>
      Profile
    </button>

  </div>

</div>


<!-- PREVIEW MODAL -->

<div
  id="previewModal"
  class="hidden"
>

  <video
    id="previewMedia"
    controls
    playsinline
  ></video>

  <div class="previewButtons">

    <button
      class="retakeBtn"
      id="retakeBtn"
    >
      Retake
    </button>

    <button
      class="sendBtn"
      id="sendMediaBtn"
    >
      Send
    </button>

  </div>

</div>


<script>

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyC8_0DykQ_yyQT3xzVmpZ9TPML0jOcKmDc",
  authDomain: "vibesnap-213d4.firebaseapp.com",
  projectId: "vibesnap-213d4",
  storageBucket: "vibesnap-213d4.firebasestorage.app",
  messagingSenderId: "933479938239",
  appId: "1:933479938239:web:d120d7ba99f5665987ae0a",
  measurementId: "G-HP0QL3C8Y"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();


/* VARIABLES */

let currentUser = null;
let selectedFriend = null;
let currentStream = null;
let facingMode = "user";
let currentFilter = "none";
let mediaRecorder = null;
let recordedChunks = [];
let currentMediaBlob = null;
let currentMediaType = null;
let currentChatUnsubscribe = null;


/* SHORTCUT */

const $ = id => document.getElementById(id);


/* FILTERS */

const filterCSS = {

  none:
    "none",

  vivid:
    "saturate(1.5) contrast(1.15)",

  warm:
    "sepia(.25) saturate(1.3)",

  cool:
    "saturate(.9) hue-rotate(15deg)",

  mono:
    "grayscale(1)",

  sepia:
    "sepia(.8)"

};


/* AUTH */

$("googleLogin").onclick = async () => {

  try{

    const provider =
      new firebase.auth.GoogleAuthProvider();

    await auth.signInWithPopup(provider);

  }catch(error){

    alert(error.message);

  }

};


$("showPhone").onclick = () => {

  $("phoneBox").classList.toggle("hidden");

};


$("sendOTP").onclick = async () => {

  const phone =
    $("phoneNumber").value.trim();

  if(!phone){

    alert("Enter your phone number.");

    return;

  }

  try{

    if(!window.recaptchaVerifier){

      window.recaptchaVerifier =
        new firebase.auth.RecaptchaVerifier(
          "recaptcha-container",
          {
            size:"normal"
          }
        );

    }

    window.confirmationResult =
      await auth.signInWithPhoneNumber(
        phone,
        window.recaptchaVerifier
      );

    alert("OTP sent.");

  }catch(error){

    alert(error.message);

  }

};


$("verifyOTP").onclick = async () => {

  const code =
    $("otpCode").value.trim();

  if(!window.confirmationResult){

    alert("Send the OTP first.");

    return;

  }

  try{

    await window.confirmationResult.confirm(code);

  }catch(error){

    alert(error.message);

  }

};


/* ACCOUNT REQUEST */

$("requestAccount").onclick = async () => {

  const email =
    prompt("Enter the Gmail address you want to use:");

  if(!email){

    return;

  }

  try{

    await db.collection("signupRequests").add({

      email:email,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp(),

      status:"pending"

    });

    alert(
      "Your account request has been sent."
    );

  }catch(error){

    alert(error.message);

  }

};


/* AUTH STATE */

auth.onAuthStateChanged(async user => {

  if(user){

    currentUser = user;

    $("loginScreen").classList.add("hidden");

    $("app").classList.remove("hidden");

    await createProfile();

    await loadUsers();

    showPage("camera");

    startCamera();

  }else{

    currentUser = null;

    $("loginScreen").classList.remove("hidden");

    $("app").classList.add("hidden");

    stopCamera();

  }

});


/* PROFILE */

async function createProfile(){

  const ref =
    db.collection("users").doc(currentUser.uid);

  const snap =
    await ref.get();

  if(!snap.exists){

    await ref.set({

      uid:currentUser.uid,

      displayName:
        currentUser.displayName ||
        "VibeSnap User",

      email:
        currentUser.email || "",

      phone:
        currentUser.phoneNumber || "",

      photoURL:
        currentUser.photoURL || "",

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

  }

  $("profileName").textContent =
    currentUser.displayName ||
    "VibeSnap User";

  $("profileEmail").textContent =
    currentUser.email ||
    currentUser.phoneNumber ||
    "";

  $("profileAvatar").textContent =
    (
      currentUser.displayName ||
      currentUser.email ||
      "U"
    )
    .charAt(0)
    .toUpperCase();

}


/* PAGE SWITCHING */

function showPage(page){

  $("cameraPage").classList.add("hidden");
  $("friendsPage").classList.add("hidden");
  $("chatPage").classList.add("hidden");
  $("profilePage").classList.add("hidden");

  document
    .querySelectorAll(".navBtn")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  if(page === "camera"){

    $("cameraPage").classList.remove("hidden");

    document
      .querySelector('[data-page="camera"]')
      .classList.add("active");

    startCamera();

  }

  if(page === "friends"){

    $("friendsPage").classList.remove("hidden");

    document
      .querySelector('[data-page="friends"]')
      .classList.add("active");

    stopCamera();

  }

  if(page === "chat"){

    $("chatPage").classList.remove("hidden");

    document
      .querySelector('[data-page="chat"]')
      .classList.add("active");

    stopCamera();

  }

  if(page === "profile"){

    $("profilePage").classList.remove("hidden");

    document
      .querySelector('[data-page="profile"]')
      .classList.add("active");

    stopCamera();

  }

}


document
  .querySelectorAll(".navBtn")
  .forEach(btn => {

    btn.onclick = () => {

      showPage(
        btn.dataset.page
      );

    };

  });


/* CAMERA */

async function startCamera(){

  stopCamera();

  try{

    currentStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:facingMode
        },

        audio:true

      });

    $("cameraVideo").srcObject =
      currentStream;

    applyFilter();

  }catch(error){

    console.error(error);

    alert(
      "Camera permission is required for VibeSnap Camera."
    );

  }

}


function stopCamera(){

  if(currentStream){

    currentStream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

    currentStream = null;

  }

  if($("cameraVideo")){

    $("cameraVideo").srcObject = null;

  }

}


$("flipCamera").onclick = () => {

  facingMode =
    facingMode === "user"
      ? "environment"
      : "user";

  startCamera();

};


/* FILTER */

function applyFilter(){

  $("cameraVideo").style.filter =
    filterCSS[currentFilter];

}


document
  .querySelectorAll(".filterBtn")
  .forEach(btn => {

    btn.onclick = () => {

      document
        .querySelectorAll(".filterBtn")
        .forEach(b =>
          b.classList.remove("active")
        );

      btn.classList.add("active");

      currentFilter =
        btn.dataset.filter;

      applyFilter();

    };

  });


/* PHOTO CAPTURE */

$("captureBtn").onclick = async () => {

  if(!currentStream){

    await startCamera();

  }

  const video =
    $("cameraVideo");

  const canvas =
    document.createElement("canvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.filter =
    filterCSS[currentFilter];

  if(facingMode === "user"){

    ctx.translate(
      canvas.width,
      0
    );

    ctx.scale(-1,1);

  }

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvas.toBlob(blob => {

    currentMediaBlob = blob;

    currentMediaType = "image";

    const url =
      URL.createObjectURL(blob);

    $("previewMedia").src = url;

    $("previewMedia").controls = false;

    $("previewModal")
      .classList.remove("hidden");

  },"image/jpeg",.92);

};


/* VIDEO RECORDING */

$("videoModeBtn").onclick = () => {

  if(mediaRecorder){

    stopRecording();

  }else{

    startRecording();

  }

};


function startRecording(){

  if(!currentStream){

    alert("Camera is not ready.");

    return;

  }

  recordedChunks = [];

  try{

    const canvas =
      document.createElement("canvas");

    const video =
      $("cameraVideo");

    canvas.width =
      video.videoWidth || 1280;

    canvas.height =
      video.videoHeight || 720;

    const ctx =
      canvas.getContext("2d");

    const drawFrame = () => {

      if(!mediaRecorder ||
         mediaRecorder.state !== "recording"){

        return;

      }

      ctx.filter =
        filterCSS[currentFilter];

      if(facingMode === "user"){

        ctx.save();

        ctx.translate(
          canvas.width,
          0
        );

        ctx.scale(-1,1);

        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        ctx.restore();

      }else{

        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

      }

      requestAnimationFrame(drawFrame);

    };

    const videoStream =
      canvas.captureStream(30);

    const audioTracks =
      currentStream.getAudioTracks();

    audioTracks.forEach(track =>
      videoStream.addTrack(track)
    );

    let options = {};

    if(
      MediaRecorder.isTypeSupported(
        "video/webm;codecs=vp9,opus"
      )
    ){

      options.mimeType =
        "video/webm;codecs=vp9,opus";

    }else if(
      MediaRecorder.isTypeSupported(
        "video/webm"
      )
    ){

      options.mimeType =
        "video/webm";

    }

    mediaRecorder =
      new MediaRecorder(
        videoStream,
        options
      );

    mediaRecorder.ondataavailable =
      event => {

        if(event.data.size > 0){

          recordedChunks.push(
            event.data
          );

        }

      };

    mediaRecorder.onstop = () => {

      const blob =
        new Blob(
          recordedChunks,
          {
            type:
              mediaRecorder.mimeType ||
              "video/webm"
          }
        );

      currentMediaBlob = blob;

      currentMediaType = "video";

      $("previewMedia").src =
        URL.createObjectURL(blob);

      $("previewMedia").controls = true;

      $("previewModal")
        .classList.remove("hidden");

      mediaRecorder = null;

      $("videoModeBtn").textContent =
        "🎥";

      $("videoModeBtn")
        .classList.remove("recording");

    };

    mediaRecorder.start();

    $("videoModeBtn").textContent =
      "⏹️";

    $("videoModeBtn")
      .classList.add("recording");

    drawFrame();

  }catch(error){

    console.error(error);

    alert(
      "Video recording is not supported on this browser."
    );

  }

}


function stopRecording(){

  if(
    mediaRecorder &&
    mediaRecorder.state === "recording"
  ){

    mediaRecorder.stop();

  }

}


/* RETAKE */

$("retakeBtn").onclick = () => {

  $("previewModal")
    .classList.add("hidden");

  currentMediaBlob = null;

  currentMediaType = null;

  startCamera();

};


/* SEND MEDIA */

$("sendMediaBtn").onclick = async () => {

  if(!currentMediaBlob){

    return;

  }

  if(!selectedFriend){

    const uid =
      $("recipientSelect").value;

    if(uid){

      const snap =
        await db
          .collection("users")
          .doc(uid)
          .get();

      if(snap.exists){

        selectedFriend = {
          uid:snap.id,
          ...snap.data()
        };

      }

    }

  }

  if(!selectedFriend){

    alert(
      "Select a friend first."
    );

    return;

  }

  try{

    $("sendMediaBtn").disabled = true;

    const chatId =
      getChatId(
        currentUser.uid,
        selectedFriend.uid
      );

    await ensureChat(
      chatId,
      selectedFriend.uid
    );

    const extension =
      currentMediaType === "image"
        ? "jpg"
        : "webm";

    const messageRef =
      db
        .collection("chats")
        .doc(chatId)
        .collection("messages")
        .doc();

    const path =
      `chatMedia/${chatId}/${messageRef.id}.${extension}`;

    const uploadRef =
      storage.ref().child(path);

    await uploadRef.put(
      currentMediaBlob
    );

    const mediaUrl =
      await uploadRef.getDownloadURL();

    await messageRef.set({

      senderUid:
        currentUser.uid,

      receiverUid:
        selectedFriend.uid,

      type:
        currentMediaType,

      text:"",

      mediaUrl:
        mediaUrl,

      storagePath:
        path,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

    $("previewModal")
      .classList.add("hidden");

    currentMediaBlob = null;

    alert("Media sent!");

  }catch(error){

    console.error(error);

    alert(
      "Could not send media: " +
      error.message
    );

  }finally{

    $("sendMediaBtn").disabled = false;

  }

};


/* GALLERY */

$("galleryBtn").onclick = () => {

  $("galleryInput").click();

};


$("galleryInput").onchange = event => {

  const file =
    event.target.files[0];

  if(!file){

    return;

  }

  currentMediaBlob = file;

  currentMediaType =
    file.type.startsWith("video")
      ? "video"
      : "image";

  const url =
    URL.createObjectURL(file);

  $("previewMedia").src = url;

  $("previewMedia").controls =
    currentMediaType === "video";

  $("previewModal")
    .classList.remove("hidden");

};


/* USERS */

let usersCache = [];

async function loadUsers(){

  db.collection("users")
    .onSnapshot(snapshot => {

      usersCache = [];

      $("usersList").innerHTML = "";

      $("recipientSelect").innerHTML =
        `<option value="">
          Select friend to send to
        </option>`;

      snapshot.forEach(doc => {

        if(doc.id === currentUser.uid){

          return;

        }

        const user = {
          uid:doc.id,
          ...doc.data()
        };

        usersCache.push(user);

        addUserCard(user);

        const option =
          document.createElement("option");

        option.value =
          user.uid;

        option.textContent =
          user.displayName ||
          user.email ||
          "VibeSnap User";

        $("recipientSelect")
          .appendChild(option);

      });

    });

}


function addUserCard(user){

  const card =
    document.createElement("div");

  card.className =
    "userCard";

  const name =
    user.displayName ||
    user.email ||
    "VibeSnap User";

  card.innerHTML = `

    <div class="avatar">
      ${name.charAt(0).toUpperCase()}
    </div>

    <div class="userInfo">

      <div class="userName">
        ${escapeHTML(name)}
      </div>

      <div class="userEmail">
        ${escapeHTML(user.email || "")}
      </div>

    </div>

    <button class="chatOpenBtn">
      Chat
    </button>

  `;

  card
    .querySelector(".chatOpenBtn")
    .onclick = () => {

      openChat(user);

    };

  $("usersList")
    .appendChild(card);

}


/* RECIPIENT */

$("recipientSelect").onchange = async () => {

  const uid =
    $("recipientSelect").value;

  if(!uid){

    selectedFriend = null;

    return;

  }

  selectedFriend =
    usersCache.find(
      user => user.uid === uid
    );

};


/* CHAT */

function getChatId(uid1,uid2){

  return [uid1,uid2]
    .sort()
    .join("_");

}


async function ensureChat(
  chatId,
  friendUid
){

  await db
    .collection("chats")
    .doc(chatId)
    .set({

      members:[
        currentUser.uid,
        friendUid
      ],

      updatedAt:
        firebase.firestore.FieldValue.serverTimestamp()

    },{
      merge:true
    });

}


async function openChat(user){

  selectedFriend = user;

  $("recipientSelect").value =
    user.uid;

  $("chatName").textContent =
    user.displayName ||
    user.email ||
    "VibeSnap User";

  $("chatAvatar").textContent =
    (
      user.displayName ||
      user.email ||
      "U"
    ).charAt(0).toUpperCase();

  showPage("chat");

  const chatId =
    getChatId(
      currentUser.uid,
      user.uid
    );

  await ensureChat(
    chatId,
    user.uid
  );

  loadMessages(chatId);

}


function loadMessages(chatId){

  if(currentChatUnsubscribe){

    currentChatUnsubscribe();

  }

  currentChatUnsubscribe =
    db
      .collection("chats")
      .doc(chatId)
      .collection("messages")
      .orderBy("createdAt")
      .onSnapshot(snapshot => {

        $("chatMessages").innerHTML = "";

        snapshot.forEach(doc => {

          const message =
            doc.data();

          const box =
            document.createElement("div");

          box.className =
            "message " +
            (
              message.senderUid ===
              currentUser.uid
                ? "mine"
                : "theirs"
            );

          if(message.type === "image"){

            box.innerHTML =
              `<img src="${message.mediaUrl}" alt="Photo">`;

          }else if(
            message.type === "video"
          ){

            box.innerHTML =
              `<video src="${message.mediaUrl}" controls></video>`;

          }else{

            box.textContent =
              message.text || "";

          }

          $("chatMessages")
            .appendChild(box);

        });

        $("chatMessages").scrollTop =
          $("chatMessages").scrollHeight;

      });

}


$("sendMessage").onclick =
  sendTextMessage;


$("messageInput").addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      sendTextMessage();

    }

  }
);


async function sendTextMessage(){

  const text =
    $("messageInput")
      .value
      .trim();

  if(!text || !selectedFriend){

    return;

  }

  try{

    const chatId =
      getChatId(
        currentUser.uid,
        selectedFriend.uid
      );

    await ensureChat(
      chatId,
      selectedFriend.uid
    );

    await db
      .collection("chats")
      .doc(chatId)
      .collection("messages")
      .add({

        senderUid:
          currentUser.uid,

        receiverUid:
          selectedFriend.uid,

        type:"text",

        text:text,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

    $("messageInput").value = "";

  }catch(error){

    alert(error.message);

  }

}


/* BACK FROM CHAT */

$("backFromChat").onclick = () => {

  showPage("camera");

};


/* LOGOUT */

$("logoutBtn").onclick = async () => {

  stopCamera();

  if(currentChatUnsubscribe){

    currentChatUnsubscribe();

    currentChatUnsubscribe = null;

  }

  await auth.signOut();

};


/* HTML ESCAPE */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
