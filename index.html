<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeSnap</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
    min-height:100vh;
}

button{
    cursor:pointer;
    border:none;
}

.hidden{
    display:none !important;
}

/* ================= AUTH ================= */

.auth-screen{
    position:fixed;
    inset:0;
    background:#0d0d0d;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.auth-box{
    width:100%;
    max-width:430px;
    background:#151515;
    border:1px solid #292929;
    border-radius:24px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.auth-logo{
    font-size:42px;
    font-weight:800;
    margin-bottom:5px;
}

.auth-logo span,
.logo span{
    color:#ffd400;
}

.auth-subtitle{
    color:#999;
    margin-bottom:30px;
}

.auth-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:22px;
}

.auth-input{
    width:100%;
    padding:15px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid #333;
    background:#202020;
    color:white;
    outline:none;
    font-size:15px;
}

.auth-input:focus{
    border-color:#ffd400;
}

.auth-button{
    width:100%;
    padding:15px;
    border-radius:12px;
    background:#ffd400;
    color:#111;
    font-size:16px;
    font-weight:bold;
    margin-top:5px;
}

.auth-secondary{
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:12px;
    background:#242424;
    color:white;
    font-size:14px;
}

.auth-message{
    min-height:20px;
    margin-top:15px;
    color:#ffcc00;
    font-size:14px;
    line-height:1.5;
}

.auth-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0;
    color:#666;
    font-size:12px;
}

.auth-divider::before,
.auth-divider::after{
    content:"";
    height:1px;
    background:#333;
    flex:1;
}

/* ================= APP ================= */

#app{
    min-height:100vh;
}

.screen{
    display:none;
    min-height:calc(100vh - 75px);
    padding-bottom:90px;
}

.screen.active{
    display:block;
}

/* ================= TOP BAR ================= */

.top-bar{
    height:65px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #222;
    background:#101010;
}

.logo{
    font-size:24px;
    font-weight:800;
}

/* ================= CAMERA ================= */

.camera-container{
    position:relative;
    width:100%;
    height:calc(100vh - 75px);
    min-height:550px;
    overflow:hidden;
    background:#050505;
}

#video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
}

.camera-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.camera-top{
    position:absolute;
    top:20px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:auto;
}

.profile-small{
    width:44px;
    height:44px;
    border-radius:50%;
    overflow:hidden;
    background:#ffd400;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
}

.profile-small img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.camera-tools{
    display:flex;
    gap:10px;
}

.camera-tool{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:19px;
}

.filter-bar{
    position:absolute;
    bottom:125px;
    left:0;
    right:0;

    gap:10px;
    overflow-x:auto;
    padding:10px 18px;
}

.filter-button{
    flex-shrink:0;
    padding:9px 15px;

.filter-button.active{
    background:#ffd400;
    color:#111;
}

.capture-area{
    position:absolute;
    bottom:35px;
    left:0;
    right:0;

    align-items:center;
    justify-content:center;
}

.capture-button{
    width:76px;
    height:76px;
    border-radius:50%;
    background:white;
    border:6px solid rgba(255,255,255,.35);
}

/* ================= CHAT ================= */

.section-header{
    padding:20px;
    font-size:26px;
    font-weight:bold;
}

.search-box{
    margin:0 18px 15px;
}

.search-box input{

.chat-list{

.chat-item{

.chat-avatar,

}

.chat-avatar img,
.friend-avatar img{

}

.chat-info{
    flex:1;
}

.chat-name{

}

.chat-preview{

}

/* ================= FRIENDS ================= */

.friend-list{

}

.friend-card{

.friend-info{

.friend-button{

.friend-button.added{

.profile-page{

}

}

.profile-avatar img{
    width:100%;
    height:100%;

}

.profile-name{
    font-size:26px;

}

.profile-username{
    color:#888;

}

.profile-provider{

.profile-stats{

}

.stat-number{

}

.stat-label{

.logout-button{

/* ================= NAV ================= */

.bottom-nav{

    bottom:0;
    left:0;
    right:0;

}

.nav-button{

.nav-button span{

}

.nav-button.active{

}

/* ================= PREVIEW ================= */

.preview-panel{
    position:fixed;
    inset:0;
    background:#000;
    z-index:900;
    display:none;
    flex-direction:column;
}

.preview-panel.active{
    display:flex;
}

.preview-image{
    flex:1;
    width:100%;
    object-fit:contain;
}

.preview-actions{
    display:flex;
    gap:12px;
    padding:20px;
}

.preview-button{
    flex:1;
    padding:15px;
    border-radius:12px;

}

.retake-button{
    background:#242424;
    color:white;
}

.send-button{
    background:#ffd400;
    color:#111;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:13px 18px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:2000;
    white-space:nowrap;
    max-width:90%;
}

.toast.show{

}

@media(max-width:600px){

    .auth-box{
        padding:30px 20px;
    }

    .camera-container{
        min-height:calc(100vh - 75px);

}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<section id="authScreen" class="auth-screen">

    <div class="auth-box">

            Vibe<span>Snap</span>

<script>

/* =========================================================
   FIREBASE
   ========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyC8_0DykQ_yyQT3xzVmpZ9TPML0jOcKmDc",
    authDomain: "vibesnap-213d4.firebaseapp.com",
    projectId: "vibesnap-213d4",
    storageBucket: "vibesnap-213d4.firebasestorage.app",
    messagingSenderId: "933479938239",
    appId: "1:933479938239:web:d120d7ba99f5665987ae0a",
    measurementId: "G-HP0QL3C8Y"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const googleProvider =
    new firebase.auth.GoogleAuthProvider();


/* =========================================================
   VARIABLES
   ========================================================= */

let currentUser = null;
let currentProfile = null;

let stream = null;
let facingMode = "user";
let currentFilter = "none";

let capturedPhoto = null;

let confirmationResult = null;

let allUsers = [];


/* =========================================================
   AUTH MESSAGES
   ========================================================= */

function showAuthMessage(message){

    document
        .getElementById("authMessage")
        .textContent = message;

}

function showOtpMessage(message){

    document
        .getElementById("otpMessage")
        .textContent = message;

}


/* =========================================================
   GOOGLE LOGIN
   ========================================================= */

async function loginWithGoogle(){

    showAuthMessage("Opening Google...");

    try{

        const result =
            await auth.signInWithPopup(
                googleProvider
            );

        await createOrUpdateUserProfile(
            result.user
        );

    }catch(error){

        console.error(error);

        showAuthMessage(
            firebaseErrorMessage(error)
        );

    }

}


/* =========================================================
   PHONE LOGIN
   ========================================================= */

let recaptchaVerifier = null;

function setupRecaptcha(){

    if(recaptchaVerifier){
        return;
    }

    recaptchaVerifier =
        new firebase.auth.RecaptchaVerifier(
            "recaptcha-container",
            {
                size:"normal"
            }
        );

    recaptchaVerifier.render();

}


async function sendPhoneCode(){

    const phone =
        document
        .getElementById("phoneNumber")
        .value
        .trim();

    if(!phone){

        showAuthMessage(
            "Enter your phone number with country code."
        );

        return;
    }

    try{

        setupRecaptcha();

        showAuthMessage(
            "Sending verification code..."
        );

        confirmationResult =
            await auth.signInWithPhoneNumber(
                phone,
                recaptchaVerifier
            );

        document
            .getElementById("authButtons")
            .style.display = "none";

        document
            .getElementById("otpBox")
            .style.display = "block";

        showOtpMessage(
            "Code sent. Check your phone."
        );

    }catch(error){

        console.error(error);

        showAuthMessage(
            firebaseErrorMessage(error)
        );

    }

}


async function verifyPhoneCode(){

    const code =
        document
        .getElementById("phoneCode")
        .value
        .trim();

    if(!code){

        showOtpMessage(
            "Enter the verification code."
        );

        return;
    }

    if(!confirmationResult){

        showOtpMessage(
            "Please request a new code."
        );

        return;
    }

    try{

        showOtpMessage(
            "Verifying..."
        );

        const result =
            await confirmationResult.confirm(
                code
            );

        await createOrUpdateUserProfile(
            result.user
        );

    }catch(error){

        console.error(error);

        showOtpMessage(
            firebaseErrorMessage(error)
        );

    }

}


function backToAuth(){

    document
        .getElementById("otpBox")
        .style.display = "none";

    document
        .getElementById("authButtons")
        .style.display = "block";

    showAuthMessage("");

}


/* =========================================================
   CREATE / UPDATE FIRESTORE USER PROFILE
   ========================================================= */

async function createOrUpdateUserProfile(user){

    if(!user){
        return;
    }

    currentUser = user;

    const userRef =
        db.collection("users")
        .doc(user.uid);

    const snapshot =
        await userRef.get();

    const existing =
        snapshot.exists
        ? snapshot.data()
        : {};

    let username =
        existing.username;

    if(!username){

        if(user.displayName){

            username =
                makeUsername(
                    user.displayName
                );

        }else if(user.phoneNumber){

            username =
                "user" +
                user.uid.substring(0,6);

        }else{

            username =
                "user" +
                user.uid.substring(0,6);

        }

    }

    const profile = {

        uid:user.uid,

        username:username,

        displayName:
            user.displayName ||
            existing.displayName ||
            username,

        photoURL:
            user.photoURL ||
            existing.photoURL ||
            "",

        phoneNumber:
            user.phoneNumber ||
            existing.phoneNumber ||
            "",

        email:
            user.email ||
            existing.email ||
            "",

        provider:
            getProviderName(user),

        updatedAt:
            firebase.firestore.FieldValue.serverTimestamp(),

        createdAt:
            existing.createdAt ||
            firebase.firestore.FieldValue.serverTimestamp()

    };

    await userRef.set(
        profile,
        {
            merge:true
        }
    );

    currentProfile = {
        ...existing,
        ...profile
    };

    enterMainApp();

}


/* =========================================================
   USERNAME
   ========================================================= */

function makeUsername(name){

    let username =
        name
        .toLowerCase()
        .replace(/[^a-z0-9]/g,"")
        .substring(0,14);

    if(!username){
        username = "vibeuser";
    }

    return username;

}


/* =========================================================
   PROVIDER
   ========================================================= */

function getProviderName(user){

    if(
        user.providerData &&
        user.providerData.length
    ){

        const provider =
            user.providerData[0].providerId;

        if(provider === "google.com"){
            return "Google";
        }

        if(provider === "phone"){
            return "Phone";
        }

    }

    return "Firebase";

}

/* =========================================================
   LOAD REAL USERS
   ========================================================= */

async function loadUsers(){

    try{

        const snapshot =
            await db
            .collection("users")
            .limit(100)
            .get();

        allUsers = [];

        snapshot.forEach(
            function(doc){

                const data =
                    doc.data();

                if(
                    currentUser &&
                    data.uid === currentUser.uid
                ){

                    return;

                }

                allUsers.push(data);

            }
        );

        renderUsers();

    }catch(error){

        console.error(error);

        showToast(
            "Could not load users."
        );

    }

}


/* =========================================================
   REALTIME USER LIST
   ========================================================= */

let usersUnsubscribe = null;

function listenForUsers(){

    if(usersUnsubscribe){
        usersUnsubscribe();
    }

    usersUnsubscribe =
        db
        .collection("users")
        .limit(100)
        .onSnapshot(
            function(snapshot){

                allUsers = [];

                snapshot.forEach(
                    function(doc){

                        const data =
                            doc.data();

                        if(
                            currentUser &&
                            data.uid === currentUser.uid
                        ){
                            return;
                        }

                        allUsers.push(data);

                    }
                );

                renderUsers();

            },
            function(error){

                console.error(
                    "User listener:",
                    error
                );

            }
        );

}


/* =========================================================
   RENDER USERS
   ========================================================= */

function renderUsers(){

    const friendList =
        document.getElementById(
            "friendList"
        );

    const chatList =
        document.getElementById(
            "chatList"
        );

    friendList.innerHTML = "";
    chatList.innerHTML = "";

    if(allUsers.length === 0){

        friendList.innerHTML =
            "<p style='color:#777;padding:20px;'>No other VibeSnap users yet.</p>";

        chatList.innerHTML =
            "<p style='color:#777;padding:20px;'>No other VibeSnap users yet.</p>";

        return;

    }

    allUsers.forEach(
        function(user){

            const letter =
                (
                    user.displayName ||
                    user.username ||
                    "V"
                )
                .charAt(0)
                .toUpperCase();

            const photo =
                user.photoURL
                ? `<img src="${escapeHtml(user.photoURL)}" alt="">`
                : letter;

            friendList.innerHTML += `

                <div
                    class="friend-card"
                    data-name="${escapeHtml(
                        (user.username || "") +
                        " " +
                        (user.displayName || "")
                    ).toLowerCase()}"
                >

                    <div class="friend-avatar">
                        ${photo}
                    </div>

                    <div class="friend-info">

                        <b>
                            ${escapeHtml(
                                user.displayName ||
                                user.username ||
                                "Vibe User"
                            )}
                        </b>

                        <div style="color:#888;font-size:13px;">
                            @${escapeHtml(
                                user.username ||
                                "user"
                            )}
                        </div>

                    </div>

                    <button
                        class="friend-button"
                        onclick="addFriend('${escapeHtml(user.uid)}')"
                    >
                        Add
                    </button>

                </div>

            `;


            chatList.innerHTML += `

                <div
                    class="chat-item"
                    data-name="${escapeHtml(
                        (user.username || "") +
                        " " +
                        (user.displayName || "")
                    ).toLowerCase()}"
                    onclick="openChat('${escapeHtml(user.uid)}')"
                    style="cursor:pointer;"
                >

                    <div class="chat-avatar">
                        ${photo}
                    </div>

                    <div class="chat-info">

                        <div class="chat-name">
                            ${escapeHtml(
                                user.displayName ||
                                user.username ||
                                "Vibe User"
                            )}
                        </div>

                        <div class="chat-preview">
                            Tap to start a chat
                        </div>

                    </div>

                </div>

            `;

        }
    );

}

async function addFriend(friendUid){

    if(!currentUser){
        return;
    }

    if(friendUid === currentUser.uid){
        return;
    }

    try{

        await db
        .collection("users")
        .doc(currentUser.uid)
        .collection("friends")
        .doc(friendUid)
        .set({

            uid:friendUid,

            addedAt:
                firebase.firestore.FieldValue
                .serverTimestamp()

        });

        showToast(
            "Friend added!"
        );

    }catch(error){

        console.error(error);

        showToast(
            "Could not add friend."
        );

    }

}

/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera(){

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            showToast(
                "Camera is not supported by this browser."
            );

            return;

        }

        stopCamera();

        const video =
            document.getElementById("video");

        video.setAttribute(
            "playsinline",
            "true"
        );

        video.muted = true;

        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    facingMode:{
                        ideal:facingMode
                    }
                },

                audio:false

            });

        video.srcObject =
            stream;

        video.style.filter =
            currentFilter;

        await video.play();

    }catch(error){

        console.error(
            "VibeSnap camera error:",
            error
        );

        if(
            error.name ===
            "NotAllowedError"
        ){

            showToast(
                "Camera permission was denied."
            );

        }else if(
            error.name ===
            "NotFoundError"
        ){

            showToast(
                "No camera was found."
            );

        }else if(
            error.name ===
            "NotReadableError"
        ){

            showToast(
                "The camera is being used by another app."
            );

        }else{

            showToast(
                "Could not start the camera."
            );

        }

    }

}


function stopCamera(){

    if(stream){

        stream
        .getTracks()
        .forEach(
            function(track){
                track.stop();
            }
        );

        stream = null;

    }

}


async function switchCamera(){

    facingMode =
        facingMode === "user"
        ? "environment"
        : "user";

    await startCamera();

}

function setFilter(

/* =========================================================
   CAPTURE
   ========================================================= */

function capturePhoto(){

    const video =
        document.getElementById(
            "video"
        );

    if(!video.videoWidth){

        showToast(
            "Camera is not ready yet."
        );

        return;

    }

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    const context =
        canvas.getContext(
            "2d"
        );

    context.filter =
        currentFilter;

    if(
        facingMode === "user"
    ){

        context.translate(
            canvas.width,
            0
        );

        context.scale(
            -1,
            1
        );

    }

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    capturedPhoto =
        canvas.toDataURL(
            "image/jpeg",
            0.9
        );

    document
    .getElementById(
        "previewImage"
    )
    .src =
        capturedPhoto;

    document
    .getElementById(
        "previewPanel"
    )
    .classList.add(
        "active"
    );

}

   RETAKE

function retakePhoto(){

    capturedPhoto = null;

    document
    .getElementById(

    );

}

function handleMediaPick(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    if(
        file.type.startsWith(
            "image/"
        )
    ){

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                capturedPhoto =
                    e.target.result;

                document
                .getElementById(
                    "previewImage"
                )
                .src =
                    capturedPhoto;

                document
                .getElementById(
                    "previewPanel"
                )
                .classList.add(
                    "active"
                );

            };

        reader.readAsDataURL(
            file
        );

    }else{

        showToast(
            "Video selection will be connected when media storage is added."
        );

    }

    event.target.value = "";

}

function openScreen(

){

    document

    )

        function(section){
            section.classList.remove(
                "active"
            );
        }
    );

    const target =

        );

    if(target){

        );
    }

    document
    .querySelectorAll(

    )
    .forEach(
        function(button){

            );

    );

    const nav =

            .charAt(0)
            .toUpperCase() +
            screen.slice(1)
        );

        nav.classList.add(

        );
    }

    if(
        screen === "camera"

        startCamera();

        stopCamera();

    if(
        screen === "friends" ||
        screen === "chats"
    ){

        loadUsers();

/* =========================================================
   FIREBASE ERROR TEXT
   ========================================================= */

function firebaseErrorMessage(
    error
){

    if(!error){
        return "Something went wrong.";
    }

    switch(error.code){

        case "auth/popup-closed-by-user":
            return "Google sign-in was cancelled.";

        case "auth/popup-blocked":
            return "Your browser blocked the Google sign-in window.";

        case "auth/unauthorized-domain":
            return "This website domain is not authorized in Firebase.";

        case "auth/operation-not-allowed":
            return "This sign-in method is disabled in Firebase.";

        case "auth/invalid-phone-number":
            return "Enter a valid phone number with country code.";

        case "auth/invalid-verification-code":
            return "The verification code is incorrect.";

        case "auth/code-expired":
            return "That verification code expired. Request a new one.";

        case "auth/too-many-requests":
            return "Too many attempts. Please try again later.";

        default:
            return error.message ||
                "Authentication failed.";

    }

}


/* =========================================================
   HTML SAFETY
   ========================================================= */

function escapeHtml(
    value
){

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
