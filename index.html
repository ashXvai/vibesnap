<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VibeSnap</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:white;
    min-height:100vh;
}

button{
    border:none;
    cursor:pointer;
    font-family:inherit;
}

.hidden{
    display:none !important;
}

/* =========================
   AUTH
========================= */

#authScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#252000 0%,#090909 45%,#000 100%);
}

.authBox{
    width:100%;
    max-width:420px;
    background:#111;
    border:1px solid #2d2d2d;
    border-radius:24px;
    padding:32px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    text-align:center;
}

.logo{
    font-size:38px;
    font-weight:900;
    color:#ffd400;
    margin-bottom:8px;
}

.tagline{
    color:#999;
    margin-bottom:30px;
}

.authBtn{
    width:100%;
    padding:15px;
    border-radius:14px;
    margin-top:12px;
    font-size:16px;
    font-weight:bold;
}

.googleBtn{
    background:white;
    color:#111;
}

.phoneBtn{
    background:#ffd400;
    color:#000;
}

.signupBtn{
    background:#202020;
    color:white;
    border:1px solid #333;
}

#phoneBox{
    margin-top:18px;
}

#phoneNumber,
#otpCode{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #333;
    background:#181818;
    color:white;
    outline:none;
    margin-top:8px;
}

.smallBtn{
    padding:11px 15px;
    border-radius:10px;
    background:#ffd400;
    color:#000;
    font-weight:bold;
    margin-top:10px;
}

.status{
    margin-top:15px;
    color:#aaa;
    font-size:14px;
    min-height:20px;
}

/* =========================
   APP
========================= */

#app{
    min-height:100vh;
    display:none;
}

.topbar{
    height:65px;
    background:#111;
    border-bottom:1px solid #292929;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:50;
}

.topLogo{
    color:#ffd400;
    font-size:25px;
    font-weight:900;
}

.topActions{
    display:flex;
    gap:8px;
}

.iconBtn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#202020;
    color:white;
    font-size:20px;
}

.iconBtn:hover{
    background:#303030;
}

.main{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

/* =========================
   HOME
========================= */

.welcome{
    background:linear-gradient(135deg,#191919,#101010);
    border:1px solid #292929;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
}

.welcome h2{
    margin-bottom:6px;
}

.welcome p{
    color:#999;
}

.sectionTitle{
    font-size:20px;
    font-weight:bold;
    margin:20px 0 12px;
}

.userCard{
    background:#151515;
    border:1px solid #292929;
    border-radius:16px;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.userInfo{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#ffd400;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

.userName{
    font-weight:bold;
}

.userEmail{
    color:#777;
    font-size:13px;
    margin-top:3px;
}

.chatBtn{
    background:#ffd400;
    color:#000;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

/* =========================
   CHAT
========================= */

.chatHeader{
    background:#111;
    border:1px solid #292929;
    border-radius:16px 16px 0 0;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
}

.backBtn{
    background:#222;
    color:white;
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:20px;
}

.chatName{
    font-weight:bold;
}

.messages{
    height:calc(100vh - 220px);
    min-height:400px;
    overflow-y:auto;
    background:#0b0b0b;
    border-left:1px solid #292929;
    border-right:1px solid #292929;
    padding:18px;
}

.message{
    max-width:75%;
    padding:10px 13px;
    border-radius:15px;
    margin-bottom:10px;
    word-break:break-word;
}

.message.me{
    margin-left:auto;
    background:#ffd400;
    color:#000;
    border-bottom-right-radius:4px;
}

.message.them{
    background:#202020;
    color:white;
    border-bottom-left-radius:4px;
}

.message img,
.message video{
    max-width:100%;
    max-height:350px;
    border-radius:12px;
    display:block;
}

.messageTime{
    font-size:10px;
    opacity:.6;
    margin-top:5px;
}

.chatInputBar{
    display:flex;
    gap:8px;
    padding:12px;
    background:#111;
    border:1px solid #292929;
    border-radius:0 0 16px 16px;
}

.messageInput{
    flex:1;
    background:#1d1d1d;
    color:white;
    border:1px solid #333;
    border-radius:13px;
    padding:13px;
    outline:none;
}

.sendBtn{
    width:48px;
    border-radius:13px;
    background:#ffd400;
    color:#000;
    font-size:20px;
    font-weight:bold;
}

.mediaBtn{
    width:48px;
    border-radius:13px;
    background:#222;
    color:white;
    font-size:20px;
}

/* =========================
   CAMERA
========================= */

.cameraPage{
    max-width:650px;
    margin:auto;
}

.cameraBox{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    max-height:75vh;
    background:#000;
    border-radius:22px;
    overflow:hidden;
    border:1px solid #292929;
}

#cameraVideo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:#000;
}

#photoCanvas{
    display:none;
}

/*
 IMPORTANT:
 The captured image is shown INSIDE this box.
 It is never placed as a full-screen <img>.
*/
#photoPreview{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
    display:none;
}

.cameraTop{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    z-index:5;
}

.cameraTop button{
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:20px;
    backdrop-filter:blur(5px);
}

.cameraBottom{
    position:absolute;
    bottom:18px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:28px;
    z-index:5;
}

.captureBtn{
    width:72px;
    height:72px;
    border-radius:50%;
    background:white;
    border:7px solid rgba(255,255,255,.4);
    background-clip:padding-box;
}

.galleryBtn,
.flipBtn{
    width:50px;
    height:50px;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:22px;
}

.previewControls{
    position:absolute;
    bottom:20px;
    left:15px;
    right:15px;
    display:none;
    justify-content:space-between;
    align-items:center;
    z-index:10;
}

.previewCancel{
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:28px;
}

.previewSend{
    padding:14px 24px;
    border-radius:15px;
    background:#ffd400;
    color:#000;
    font-size:17px;
    font-weight:bold;
}

.cameraMode{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:15px;
}

.modeBtn{
    color:#777;
    background:none;
    font-weight:bold;
}

.modeBtn.active{
    color:#ffd400;
}

/* =========================
   PROFILE
========================= */

.profileBox{
    max-width:500px;
    margin:auto;
    background:#151515;
    border:1px solid #292929;
    border-radius:20px;
    padding:25px;
}

.profileAvatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#ffd400;
    color:#000;
    margin:0 auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
}

.profileBox h2{
    text-align:center;
}

.profileEmail{
    text-align:center;
    color:#777;
    margin-top:5px;
}

.logoutBtn{
    width:100%;
    padding:14px;
    background:#292929;
    color:white;
    border-radius:12px;
    margin-top:25px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .main{
        padding:12px;
    }

    .messages{
        height:calc(100vh - 215px);
        min-height:300px;
    }

    .cameraBox{
        aspect-ratio:3/4;
        max-height:none;
    }

    .message{
        max-width:85%;
    }
}
</style>
</head>

<body>

<!-- =========================
     AUTH SCREEN
========================= -->

<div id="authScreen">

    <div class="authBox">

        <div class="logo">VibeSnap</div>

        <div class="tagline">
            Connect. Chat. Share your vibe.
        </div>

        <button class="authBtn googleBtn" id="googleLogin">
            Continue with Google
        </button>

        <button class="authBtn phoneBtn" id="showPhone">
            Login with Phone Number
        </button>

        <button class="authBtn signupBtn" id="requestAccount">
            Request an Account
        </button>

        <div id="phoneBox" class="hidden">

            <input
                id="phoneNumber"
                type="tel"
                placeholder="+91XXXXXXXXXX"
            >

            <div id="recaptcha-container"></div>

            <button class="smallBtn" id="sendOTP">
                Send OTP
            </button>

            <input
                id="otpCode"
                class="hidden"
                type="number"
                placeholder="Enter OTP"
            >

            <button
                id="verifyOTP"
                class="smallBtn hidden"
            >
                Verify OTP
            </button>

        </div>

        <div id="authStatus" class="status"></div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

    <header class="topbar">

        <div class="topLogo">
            VibeSnap
        </div>

        <div class="topActions">

            <button
                class="iconBtn"
                id="homeBtn"
                title="Home"
            >
                🏠
            </button>

            <button
                class="iconBtn"
                id="cameraBtn"
                title="Camera"
            >
                📸
            </button>

            <button
                class="iconBtn"
                id="profileBtn"
                title="Profile"
            >
                👤
            </button>

        </div>

    </header>


    <main class="main">

        <!-- HOME -->

        <section
            id="homeScreen"
            class="screen active"
        >

            <div class="welcome">

                <h2>
                    Welcome to VibeSnap 👋
                </h2>

                <p id="welcomeText">
                    Loading your profile...
                </p>

            </div>

            <div class="sectionTitle">
                People on VibeSnap
            </div>

            <div id="usersList">
                Loading...
            </div>

        </section>


        <!-- CHAT -->

        <section
            id="chatScreen"
            class="screen"
        >

            <div class="chatHeader">

                <button
                    class="backBtn"
                    id="backFromChat"
                >
                    ←
                </button>

                <div
                    class="avatar"
                    id="chatAvatar"
                >
                    ?
                </div>

                <div class="chatName" id="chatUserName">
                    Chat
                </div>

            </div>

            <div
                id="messages"
                class="messages"
            ></div>

            <div class="chatInputBar">

                <button
                    class="mediaBtn"
                    id="chatMediaBtn"
                    title="Send photo/video"
                >
                    📎
                </button>

                <input
                    class="messageInput"
                    id="messageInput"
                    type="text"
                    placeholder="Type a message..."
                >

                <button
                    class="sendBtn"
                    id="sendMessage"
                >
                    ➤
                </button>

            </div>

            <input
                type="file"
                id="chatFileInput"
                accept="image/*,video/*"
                class="hidden"
            >

        </section>


        <!-- CAMERA -->

        <section
            id="cameraScreen"
            class="screen"
        >

            <div class="cameraPage">

                <div class="cameraBox">

                    <video
                        id="cameraVideo"
                        autoplay
                        playsinline
                        muted
                    ></video>

                    <canvas id="photoCanvas"></canvas>

                    <img
                        id="photoPreview"
                        alt="Captured photo"
                    >

                    <div class="cameraTop">

                        <button id="closeCamera">
                            ✕
                        </button>

                        <button id="flipCamera">
                            🔄
                        </button>

                    </div>

                    <div
                        id="normalCameraControls"
                        class="cameraBottom"
                    >

                        <label
                            class="galleryBtn"
                            title="Gallery"
                        >
                            🖼️

                            <input
                                id="cameraGalleryInput"
                                type="file"
                                accept="image/*,video/*"
                                class="hidden"
                            >
                        </label>

                        <button
                            id="capturePhoto"
                            class="captureBtn"
                            title="Take photo"
                        ></button>

                        <button
                            id="switchVideo"
                            class="flipBtn"
                            title="Video mode"
                        >
                            🎥
                        </button>

                    </div>


                    <!--
                       THESE ARE THE IMPORTANT PHOTO PREVIEW BUTTONS.
                       ✕ = DISCARD
                       ➤ = SEND
                    -->

                    <div
                        id="photoPreviewControls"
                        class="previewControls"
                    >

                        <button
                            id="discardPhoto"
                            class="previewCancel"
                            title="Discard photo"
                        >
                            ✕
                        </button>

                        <button
                            id="sendCapturedPhoto"
                            class="previewSend"
                        >
                            Send ➤
                        </button>

                    </div>

                </div>


                <div class="cameraMode">

                    <button
                        id="photoModeBtn"
                        class="modeBtn active"
                    >
                        PHOTO
                    </button>

                    <button
                        id="videoModeBtn"
                        class="modeBtn"
                    >
                        VIDEO
                    </button>

                </div>

            </div>

        </section>


        <!-- PROFILE -->

        <section
            id="profileScreen"
            class="screen"
        >

            <div class="profileBox">

                <div
                    id="profileAvatar"
                    class="profileAvatar"
                >
                    ?
                </div>

                <h2 id="profileName">
                    User
                </h2>

                <div
                    id="profileEmail"
                    class="profileEmail"
                >
                </div>

                <button
                    id="logoutBtn"
                    class="logoutBtn"
                >
                    Log Out
                </button>

            </div>

        </section>

    </main>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyC8_0DykQ_yyQT3xzVmpZ9TPML0jOcDc",

    authDomain:
        "vibesnap-213d4.firebaseapp.com",

    projectId:
        "vibesnap-213d4",

    storageBucket:
        "vibesnap-213d4.firebasestorage.app",

    messagingSenderId:
        "933479938239",

    appId:
        "1:933479938239:web:d120d7ba99f5665987ae0a",

    measurementId:
        "G-HP0QL3C8Y"
};


/* =========================================
   INITIALIZE
========================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);


/* =========================================
   GLOBAL VARIABLES
========================================= */

let currentUser = null;

let currentChatUser = null;

let currentChatId = null;

let unsubscribeMessages = null;

let cameraStream = null;

let currentFacingMode = "user";

let capturedPhotoBlob = null;


/* =========================================
   ELEMENTS
========================================= */

const authScreen =
    document.getElementById("authScreen");

const appScreen =
    document.getElementById("app");

const authStatus =
    document.getElementById("authStatus");

const phoneBox =
    document.getElementById("phoneBox");

const otpCode =
    document.getElementById("otpCode");

const verifyOTP =
    document.getElementById("verifyOTP");

const usersList =
    document.getElementById("usersList");

const welcomeText =
    document.getElementById("welcomeText");

const cameraVideo =
    document.getElementById("cameraVideo");

const photoCanvas =
    document.getElementById("photoCanvas");

const photoPreview =
    document.getElementById("photoPreview");

const normalCameraControls =
    document.getElementById("normalCameraControls");

const photoPreviewControls =
    document.getElementById("photoPreviewControls");


/* =========================================
   AUTH STATUS
========================================= */

function showAuthMessage(message){

    authStatus.textContent = message;

}


/* =========================================
   GOOGLE LOGIN
========================================= */

document
.getElementById("googleLogin")
.addEventListener("click", async () => {

    try{

        showAuthMessage(
            "Opening Google login..."
        );

        const provider =
            new GoogleAuthProvider();

        await signInWithPopup(
            auth,
            provider
        );

    }catch(error){

        console.error(error);

        showAuthMessage(
            "Google login failed: " +
            error.message
        );

    }

});


/* =========================================
   PHONE LOGIN
========================================= */

let confirmationResult = null;

let recaptchaVerifier = null;


document
.getElementById("showPhone")
.addEventListener("click", () => {

    phoneBox.classList.toggle("hidden");

});


function createRecaptcha(){

    if(recaptchaVerifier){
        return;
    }

    recaptchaVerifier =
        new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {
                size:"normal"
            }
        );

}


document
.getElementById("sendOTP")
.addEventListener("click", async () => {

    const phone =
        document
        .getElementById("phoneNumber")
        .value
        .trim();

    if(!phone){

        showAuthMessage(
            "Enter your phone number."
        );

        return;
    }

    try{

        createRecaptcha();

        showAuthMessage(
            "Sending OTP..."
        );

        confirmationResult =
            await signInWithPhoneNumber(
                auth,
                phone,
                recaptchaVerifier
            );

        otpCode.classList.remove("hidden");

        verifyOTP.classList.remove("hidden");

        showAuthMessage(
            "OTP sent. Enter it below."
        );

    }catch(error){

        console.error(error);

        showAuthMessage(
            "OTP error: " +
            error.message
        );

        if(recaptchaVerifier){

            recaptchaVerifier.clear();

            recaptchaVerifier = null;

        }

    }

});


verifyOTP.addEventListener(
    "click",
    async () => {

        const code =
            otpCode.value.trim();

        if(!code){

            showAuthMessage(
                "Enter the OTP."
            );

            return;
        }

        if(!confirmationResult){

            showAuthMessage(
                "Please request an OTP first."
            );

            return;
        }

        try{

            showAuthMessage(
                "Verifying..."
            );

            await confirmationResult.confirm(
                code
            );

        }catch(error){

            console.error(error);

            showAuthMessage(
                "Wrong OTP or expired OTP."
            );

        }

    }
);


/* =========================================
   ACCOUNT REQUEST
========================================= */

document
.getElementById("requestAccount")
.addEventListener("click", async () => {

    const email =
        prompt(
            "Enter your email for the account request:"
        );

    if(!email){
        return;
    }

    const username =
        prompt(
            "Choose your VibeSnap username:"
        );

    if(!username){
        return;
    }

    try{

        await addDoc(
            collection(
                db,
                "signupRequests"
            ),
            {
                email:email.trim(),
                username:username.trim(),
                status:"pending",
                createdAt:serverTimestamp()
            }
        );

        showAuthMessage(
            "Account request sent."
        );

    }catch(error){

        console.error(error);

        showAuthMessage(
            "Could not send request: " +
            error.message
        );

    }

});


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(user){

            currentUser = user;

            authScreen.style.display =
                "none";

            appScreen.style.display =
                "block";

            await createUserProfile();

            await loadUsers();

            updateProfile();

            showScreen("homeScreen");

        }else{

            currentUser = null;

            authScreen.style.display =
                "flex";

            appScreen.style.display =
                "none";

        }

    }
);


/* =========================================
   CREATE USER PROFILE
========================================= */

async function createUserProfile(){

    if(!currentUser){
        return;
    }

    const userRef =
        doc(
            db,
            "users",
            currentUser.uid
        );

    const existing =
        await getDoc(userRef);

    if(!existing.exists()){

        await setDoc(
            userRef,
            {
                uid:currentUser.uid,

                name:
                    currentUser.displayName ||
                    "VibeSnap User",

                email:
                    currentUser.email ||
                    "",

                phone:

}


/* =========================================
   LOAD USERS
========================================= */

async function loadUsers(){

    /*
      NOTE:
      This is kept simple for the current prototype.
      Your Firestore rules will eventually need a proper
      friend-request/friendship system.
    */

    usersList.innerHTML =
        "Loading users...";

    try{

        const snapshot =
            await new Promise(
                (resolve,reject) => {

                    const unsubscribe =
                        onSnapshot(
                            collection(
                                db,
                                "users"
                            ),
                            snap => {

                                unsubscribe();

                                resolve(snap);

                            },
                            error => {

                                unsubscribe();

                                reject(error);

                            }
                        );

                }
            );

        usersList.innerHTML = "";

        let found = false;

        snapshot.forEach(
            userDoc => {

                const user =
                    userDoc.data();

                if(
                    currentUser &&
                    user.uid === currentUser.uid
                ){
                    return;
                }

                found = true;

                const card =
                    document.createElement("div");

                card.className =
                    "userCard";

                const initial =
                    (
                        user.name ||
                        "U"
                    )
                    .charAt(0)
                    .toUpperCase();

                card.innerHTML = `

                    <div class="userInfo">

                        <div class="avatar">
                            ${initial}
                        </div>

                        <div>

                            <div class="userName">
                                ${
                                    user.name ||
                                    "VibeSnap User"
                                }
                            </div>

                            <div class="userEmail">
                                ${
                                    user.email ||
                                    user.phone ||
                                    ""
                                }
                            </div>

                        </div>

                    </div>

                    <button class="chatBtn">
                        Chat
                    </button>

                `;

                card
                .querySelector(".chatBtn")
                .addEventListener(
                    "click",
                    () => {

                        openChat(
                            user
                        );

                    }
                );

                usersList.appendChild(
                    card
                );

            }
        );

        if(!found){

            usersList.innerHTML =
                `
                <div class="welcome">
                    No other users yet.
                </div>
                `;

        }

    }catch(error){

        console.error(error);

        usersList.innerHTML =
            `
            <div class="welcome">
                Could not load users.
            </div>
            `;

    }

}

/* =========================================
   CHAT
========================================= */

async function openChat(user){

    currentChatUser = user;

    currentChatId =
        [
            currentUser.uid,
            user.uid
        ]
        .sort()
        .join("_");

    document
    .getElementById("chatUserName")
    .textContent =
        user.name ||
        "User";

    document
    .getElementById("chatAvatar")
    .textContent =
        (
            user.name ||
            "U"
        )
        .charAt(0)
        .toUpperCase();

    showScreen(
        "chatScreen"
    );

    loadMessages();

}


function loadMessages(){

    const messagesElement =
        document.getElementById(
            "messages"
        );

    messagesElement.innerHTML =
        "";

    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages =
            null;

    }

    const messagesRef =
        collection(
            db,
            "chats",
            currentChatId,
            "messages"
        );

    const q =
        query(
            messagesRef,
            orderBy(
                "createdAt",
                "asc"
            )
        );

    unsubscribeMessages =
        onSnapshot(
            q,
            snapshot => {

                messagesElement.innerHTML =
                    "";

                snapshot.forEach(
                    messageDoc => {

                        const data =
                            messageDoc.data();

                        renderMessage(
                            data
                        );

                    }
                );

                messagesElement.scrollTop =
                    messagesElement.scrollHeight;

            },
            error => {

                console.error(
                    "Message error:",
                    error
                );

            }
        );

}


function renderMessage(data){

    const messagesElement =
        document.getElementById(
            "messages"
        );

    const message =
        document.createElement("div");

    const mine =
        data.senderUid ===
        currentUser.uid;

    message.className =
        mine
        ? "message me"
        : "message them";


    if(data.type === "image"){

        const img =
            document.createElement("img");

        img.src =
            data.mediaUrl;

        img.alt =
            "Photo";

        message.appendChild(
            img
        );

    }else if(
        data.type === "video"
    ){

        const video =
            document.createElement(
                "video"
            );

        video.src =
            data.mediaUrl;

        video.controls =
            true;

        video.playsInline =
            true;

        message.appendChild(
            video
        );

    }else{

        const text =
            document.createElement("div");

        text.textContent =
            data.text || "";

        message.appendChild(
            text
        );

    }


    const time =
        document.createElement(
            "div"
        );

    time.className =
        "messageTime";

    time.textContent =
        mine
        ? "You"
        : (
            currentChatUser?.name ||
            "User"
        );

    message.appendChild(
        time
    );

    messagesElement.appendChild(
        message
    );

}

document

    "change",
    async event => {

        const file =
            event.target.files[0];

        if(!file){
            return;
        }

        if(!currentChatUser){
            return;
        }

        try{

            const messageRef =
                doc(
                    collection(
                        db,
                        "chats",
                        currentChatId,
                        "messages"
                    )
                );

            const extension =
                getExtension(
                    file.name,
                    file.type
                );

            const storagePath =
                `chatMedia/${currentChatId}/${messageRef.id}.${extension}`;

            const storageRef =
                ref(
                    storage,
                    storagePath
                );

            await uploadBytes(
                storageRef,
                file,
                {
                    contentType:
                        file.type
                }
            );

            const downloadURL =
                await getDownloadURL(
                    storageRef
                );

            const type =
                file.type.startsWith(
                    "video/"
                )
                ? "video"
                : "image";

            await setDoc(
                messageRef,
                {
                    senderUid:
                        currentUser.uid,

                    receiverUid:
                        currentChatUser.uid,

                    type:
                        type,

                    mediaUrl:
                        downloadURL,

                    storagePath:
                        storagePath,

                    createdAt:
                        serverTimestamp()
                }
            );

            event.target.value =
                "";

        }catch(error){

            console.error(error);

            alert(
                "Media could not be sent."
            );

        }

    }
);


function getExtension(
    filename,
    mimeType
){

    const parts =
        filename.split(".");

    if(parts.length > 1){

        return parts
        .pop()
        .toLowerCase();

    }

    if(
        mimeType ===
        "image/jpeg"
    ){
        return "jpg";
    }

    if(
        mimeType ===
        "image/png"
    ){
        return "png";
    }

    if(
        mimeType ===
        "image/webp"
    ){
        return "webp";
    }

    if(
        mimeType.startsWith(
            "video/"
        )
    ){
        return "mp4";
    }

    return "bin";

}


/* =========================================
   CAMERA START
========================================= */

async function startCamera(){

    try{

        closeCamera();

        cameraStream =
            await navigator.mediaDevices
            .getUserMedia(
                {
                    video:{
                        facingMode:
                            currentFacingMode
                    },

                    audio:false
                }
            );

        cameraVideo.srcObject =
            cameraStream;

        await cameraVideo.play();

        resetPhotoPreview();

    }catch(error){

        console.error(
            "Camera error:",
            error
        );

        alert(
            "Camera could not start. Please allow camera permission in your browser."
        );

    }

}


/* =========================================
   CLOSE CAMERA
========================================= */

function closeCamera(){

    if(cameraStream){

        cameraStream
        .getTracks()
        .forEach(
            track => track.stop()
        );

        cameraStream =
            null;

    }

    cameraVideo.srcObject =
        null;

}

/* =========================================
   CAPTURE PHOTO
========================================= */

document

    "click",
    capturePhoto

function capturePhoto(){

    if(
        !cameraVideo.videoWidth ||
        !cameraVideo.videoHeight
    ){

        alert(
            "Camera is not ready yet."
        );

        return;

    }


    const width =
        cameraVideo.videoWidth;

    const height =
        cameraVideo.videoHeight;


    photoCanvas.width =
        width;

    photoCanvas.height =
        height;


    const context =
        photoCanvas.getContext(
            "2d"
        );


    /*
       Draw the camera frame
       into the canvas.
    */

    context.drawImage(
        cameraVideo,
        0,
        0,
        width,
        height
    );


    photoCanvas.toBlob(
        blob => {

            if(!blob){

                alert(
                    "Could not capture photo."
                );

                return;

            }

            capturedPhotoBlob =
                blob;


            /*
               Create a local preview URL.
               IMPORTANT:
               This image is placed inside
               #cameraBox, not opened as a
               separate browser page.
            */

            const previewURL =
                URL.createObjectURL(
                    blob
                );

            photoPreview.src =
                previewURL;


            /*
               Hide live camera.
            */

            cameraVideo.style.display =
                "none";


            /*
               Show captured photo
               INSIDE cameraBox.
            */

            photoPreview.style.display =
                "block";


            /*
               Hide normal camera
               controls.
            */

            normalCameraControls.style.display =
                "none";


            /*
               Show:
               ✕
               Send
            */

            photoPreviewControls.style.display =
                "flex";

        },
        "image/jpeg",
        0.92
    );

}


/* =========================================
   DISCARD PHOTO — ✕
========================================= */

document
.getElementById("discardPhoto")
.addEventListener(
    "click",
    () => {

        resetPhotoPreview();

    }
);


function resetPhotoPreview(){

    if(
        photoPreview.src &&
        photoPreview.src.startsWith(
            "blob:"
        )
    ){

        URL.revokeObjectURL(
            photoPreview.src
        );

    }

    capturedPhotoBlob =
        null;

    photoPreview.src =
        "";

    photoPreview.style.display =
        "none";

    cameraVideo.style.display =
        "block";

    normalCameraControls.style.display =
        "flex";

    photoPreviewControls.style.display =
        "none";

}

.getElementById("sendCapturedPhoto")
.addEventListener(
    "click",
    async () => {

        if(!capturedPhotoBlob){

            return;

        }

              If no chat is selected,

            const downloadURL =

            await setDoc(

            alert(

);
