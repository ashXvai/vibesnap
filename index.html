<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeSnap</title>

<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-storage-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#000;color:#fff;min-height:100vh;overflow:hidden}
button{border:0;cursor:pointer}
.hidden{display:none!important}
#loginScreen{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#111,#35105c,#001c35);padding:20px}
.loginBox{width:100%;max-width:420px;background:rgba(20,20,20,.92);border-radius:25px;padding:35px 25px;text-align:center;box-shadow:0 0 40px rgba(0,0,0,.5)}
.logo{font-size:42px;font-weight:bold;margin-bottom:10px}
.subtitle{color:#aaa;margin-bottom:30px}
.loginBtn{width:100%;padding:15px;margin:8px 0;border-radius:14px;font-size:16px;font-weight:bold}
.googleBtn{background:#fff;color:#111}.phoneBtn{background:#222;color:#fff;border:1px solid #555}.accountBtn{background:#6c2cff;color:white}
#phoneBox{margin-top:15px}
#phoneNumber,#otpCode{width:100%;padding:14px;border-radius:12px;border:1px solid #555;background:#111;color:white;margin:8px 0}
#app{width:100%;height:100vh;position:relative;background:#000}
#cameraPage{width:100%;height:100vh;position:relative;background:#000;overflow:hidden}
#cameraVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.cameraShade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 22%,transparent 68%,rgba(0,0,0,.72))}
.cameraTop{position:absolute;top:0;left:0;right:0;padding:18px 16px;display:flex;align-items:center;gap:12px;z-index:8}
.cameraTop button,.cameraIconBtn{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.32);backdrop-filter:blur(8px);color:white;font-size:23px;display:flex;align-items:center;justify-content:center}
.cameraAvatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#777,#222);border:2px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-size:23px;overflow:hidden}
.cameraAvatar img{width:100%;height:100%;object-fit:cover}
.cameraSearch{font-size:28px!important}
.cameraTopSpacer{flex:1}
.cameraTopActions{display:flex;gap:10px}
.topBadge{position:relative}.topBadge:after{content:"";position:absolute;right:-2px;top:-2px;width:12px;height:12px;background:#ff3158;border-radius:50%;border:2px solid white}
.cameraTitle{display:none}
.cameraSidePanel{position:absolute;right:13px;top:112px;z-index:8;display:flex;flex-direction:column;gap:14px;align-items:center}
.cameraTool{min-width:58px;color:#fff;background:transparent;text-shadow:0 2px 8px #000;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:13px}
.cameraToolIcon{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.24);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;font-size:24px}
.cameraTool.active .cameraToolIcon{background:rgba(255,255,255,.2)}
.recipientBox{position:absolute;top:92px;left:16px;right:76px;z-index:8}.recipientBox select{width:100%;padding:10px 13px;border-radius:18px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);color:white;border:1px solid rgba(255,255,255,.25);outline:none}
.lensStrip{position:absolute;left:0;right:0;bottom:132px;display:flex;align-items:center;gap:12px;overflow-x:auto;padding:8px 18px;z-index:8;scrollbar-width:none}.lensStrip::-webkit-scrollbar{display:none}
.lensItem{flex:none;width:70px;text-align:center;color:white;font-size:11px;font-weight:700;text-shadow:0 2px 6px #000}.lensItem .lensCircle{width:62px;height:62px;margin:auto auto 4px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;font-size:27px;overflow:hidden}.lensItem.active .lensCircle{border:3px solid white;background:rgba(255,255,255,.2)}
.filterBar{display:none}
.cameraControls{position:absolute;left:0;right:0;bottom:57px;display:flex;justify-content:center;align-items:center;gap:32px;z-index:9}
.cameraSideBtn{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);color:white;font-size:22px;display:flex;align-items:center;justify-content:center}
.captureBtn{width:84px;height:84px;border-radius:50%;background:white;border:5px solid rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(0,0,0,.18) inset}.recording{background:#ff3030!important}
.cameraModeLabel{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:white;font-size:13px;font-weight:700;text-shadow:0 2px 6px #000;z-index:9}
.cameraQuickActions{position:absolute;left:20px;bottom:170px;z-index:9;display:flex;gap:14px}.quickAction{color:#fff;background:none;text-shadow:0 2px 8px #000;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}.quickAction span:first-child{font-size:28px}
.page{height:100vh;overflow:auto;padding:85px 20px 90px;background:#0b0b0b}.pageTitle{font-size:28px;margin-bottom:20px}
.userCard{display:flex;align-items:center;gap:12px;padding:14px;background:#171717;border-radius:15px;margin-bottom:10px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#743cff,#ff2e88);display:flex;justify-content:center;align-items:center;font-weight:bold;font-size:20px}
.userInfo{flex:1}.userName{font-weight:bold}.userEmail{color:#999;font-size:13px}.chatOpenBtn{background:#6c2cff;color:#fff;padding:9px 13px;border-radius:10px}
#chatPage{padding:0 0 82px;display:flex;flex-direction:column}.chatHeader{padding:15px;background:#151515;display:flex;align-items:center;gap:12px}.chatMessages{flex:1;overflow:auto;padding:15px}
.message{max-width:78%;padding:10px 13px;border-radius:16px;margin-bottom:9px;word-break:break-word}.mine{margin-left:auto;background:#6c2cff}.theirs{background:#222}
.message img,.message video{max-width:100%;border-radius:12px;margin-top:5px}.chatInput{display:flex;gap:8px;padding:10px;background:#151515}.chatInput input{flex:1;padding:13px;border-radius:12px;border:1px solid #444;background:#0d0d0d;color:#fff}.chatInput button{padding:0 16px;border-radius:12px;background:#6c2cff;color:#fff}
.profileBox{max-width:500px;margin:auto;background:#171717;padding:25px;border-radius:20px;text-align:center}.profileAvatar{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#743cff,#ff2e88);display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:bold;margin:0 auto 15px}.logoutBtn{margin-top:25px;width:100%;padding:14px;background:#d92929;color:white;border-radius:12px}
.bottomNav{position:absolute;bottom:0;left:0;right:0;height:72px;background:rgba(8,8,8,.86);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}
.navBtn{background:none;color:#aaa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700}.navBtn span{font-size:25px}.navBtn.active{color:#fff}
#previewModal{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}#previewMedia{flex:1;width:100%;height:100%;object-fit:contain}.previewButtons{display:flex;gap:10px;padding:15px}.previewButtons button{flex:1;padding:14px;border-radius:12px;font-weight:bold}.retakeBtn{background:#333;color:white}.sendBtn{background:#6c2cff;color:white}
@media(min-width:700px){#cameraPage{max-width:600px;margin:auto}.bottomNav{max-width:600px;left:50%;transform:translateX(-50%)}}

</style>
</head>
<body>
<div id="loginScreen"><div class="loginBox">
<div class="logo">VibeSnap</div><div class="subtitle">Snap. Share. Vibe.</div>
<button class="loginBtn googleBtn" id="googleLogin">Continue with Google</button>
<button class="loginBtn phoneBtn" id="showPhone">📱 Phone Number</button>
<button class="loginBtn accountBtn" id="requestAccount">Request Account</button>
<div id="phoneBox" class="hidden">
<input id="phoneNumber" type="tel" placeholder="+91XXXXXXXXXX">
<button class="loginBtn phoneBtn" id="sendOTP">Send OTP</button>
<input id="otpCode" type="text" placeholder="Enter OTP">
<button class="loginBtn accountBtn" id="verifyOTP">Verify OTP</button>
</div>
<div id="recaptcha-container"></div>
</div></div>

<div id="app" class="hidden">
<div id="cameraPage">
<video id="cameraVideo" autoplay playsinline muted></video>
<div class="cameraShade"></div>

<div class="cameraTop">
  <button class="cameraAvatar" id="profileQuick" title="Profile">V</button>
  <button class="cameraIconBtn cameraSearch" id="searchQuick" title="Search">⌕</button>
  <div class="cameraTopSpacer"></div>
  <div class="cameraTopActions">
    <button class="cameraIconBtn topBadge" id="notificationQuick" title="Notifications">♧</button>
    <button class="cameraIconBtn topBadge" id="addFriendQuick" title="Friends">♧+</button>
    <button class="cameraIconBtn" id="flipCamera" title="Switch camera">↻</button>
  </div>
</div>

<div class="recipientBox"><select id="recipientSelect"><option value="">Choose a friend for sending</option></select></div>

<div class="cameraSidePanel">
  <button class="cameraTool" id="flashQuick"><span class="cameraToolIcon">⚡</span><span>Flash</span></button>
  <button class="cameraTool" id="soundQuick"><span class="cameraToolIcon">♪</span><span>Sounds</span></button>
  <button class="cameraTool" id="moreCameraTools"><span class="cameraToolIcon">⌄</span></button>
</div>

<div class="cameraQuickActions">
  <button class="quickAction" id="aiQuick"><span>AI</span><span>Vibe AI</span></button>
  <button class="quickAction" id="memoriesQuick"><span>▧</span><span>Memories</span></button>
</div>

<div class="lensStrip" id="lensStrip">
  <button class="lensItem active" data-filter="none"><span class="lensCircle">◉</span>Normal</button>
  <button class="lensItem" data-filter="vivid"><span class="lensCircle">✦</span>Vivid</button>
  <button class="lensItem" data-filter="warm"><span class="lensCircle">☀</span>Warm</button>
  <button class="lensItem" data-filter="cool"><span class="lensCircle">❄</span>Cool</button>
  <button class="lensItem" data-filter="mono"><span class="lensCircle">◐</span>Mono</button>
  <button class="lensItem" data-filter="sepia"><span class="lensCircle">◒</span>Sepia</button>
</div>

<div class="cameraControls">
  <button class="cameraSideBtn" id="galleryBtn" title="Gallery">▧</button>
  <button class="captureBtn" id="captureBtn" title="Take photo"></button>
  <button class="cameraSideBtn" id="videoModeBtn" title="Record video">●</button>
</div>
<div class="cameraModeLabel">PHOTO</div>
<input type="file" id="galleryInput" accept="image/*,video/*" class="hidden">
</div>

<div id="friendsPage" class="page hidden"><div class="pageTitle">Friends</div><div id="usersList"></div></div>

<div id="chatPage" class="page hidden">
<div class="chatHeader"><button id="backFromChat" style="background:none;color:white;font-size:22px;">←</button><div id="chatAvatar" class="avatar">?</div><div><div id="chatName">Chat</div></div></div>
<div id="chatMessages" class="chatMessages"></div>
<div class="chatInput"><input id="messageInput" type="text" placeholder="Write a message..."><button id="sendMessage">Send</button></div>
</div>

<div id="profilePage" class="page hidden">
<div class="pageTitle">Profile</div><div class="profileBox"><div id="profileAvatar" class="profileAvatar">?</div><h2 id="profileName">User</h2><p id="profileEmail" style="color:#999;margin-top:8px;"></p><button id="logoutBtn" class="logoutBtn">Log Out</button></div>
</div>

<div class="bottomNav">
<button class="navBtn active" data-page="camera"><span>📸</span>Camera</button>
<button class="navBtn" data-page="friends"><span>👥</span>Friends</button>
<button class="navBtn" data-page="chat"><span>💬</span>Chat</button>
<button class="navBtn" data-page="profile"><span>👤</span>Profile</button>
</div>
</div>

<div id="previewModal" class="hidden"><video id="previewMedia" controls playsinline></video><div class="previewButtons"><button class="retakeBtn" id="retakeBtn">Retake</button><button class="sendBtn" id="sendMediaBtn">Send</button></div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA8d0zK0s17K6Vybn8ULOIuTwHXnHjJJDk",
  authDomain: "vibesnap-213d4.firebaseapp.com",
  projectId: "vibesnap-213d4",
  storageBucket: "vibesnap-213d4.firebasestorage.app",
  messagingSenderId: "933479938239",
  appId: "1:933479938239:web:d120d7ba99f5665987ae0a",
  measurementId: "G-HP0QL3C8Y"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),storage=firebase.storage();
let currentUser=null,selectedFriend=null,currentStream=null,facingMode="user",currentFilter="none",mediaRecorder=null,recordedChunks=[],currentMediaBlob=null,currentMediaType=null,currentChatUnsubscribe=null;
const $=id=>document.getElementById(id);
const filterCSS={none:"none",vivid:"saturate(1.5) contrast(1.15)",warm:"sepia(.25) saturate(1.3)",cool:"saturate(.9) hue-rotate(15deg)",mono:"grayscale(1)",sepia:"sepia(.8)"};

$("googleLogin").onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){alert(e.message)}};
$("showPhone").onclick=()=>$("phoneBox").classList.toggle("hidden");
$("sendOTP").onclick=async()=>{const phone=$("phoneNumber").value.trim();if(!phone)return alert("Enter your phone number.");try{if(!window.recaptchaVerifier)window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier("recaptcha-container",{size:"normal"});window.confirmationResult=await auth.signInWithPhoneNumber(phone,window.recaptchaVerifier);alert("OTP sent.")}catch(e){alert(e.message)}};
$("verifyOTP").onclick=async()=>{const code=$("otpCode").value.trim();if(!window.confirmationResult)return alert("Send the OTP first.");try{await window.confirmationResult.confirm(code)}catch(e){alert(e.message)}};

$("requestAccount").onclick=async()=>{const email=prompt("Enter the Gmail address you want to use:");if(email===null)return;const cleanEmail=email.trim().toLowerCase();if(!cleanEmail)return alert("Please enter your email address.");const emailPattern=/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/;if(!emailPattern.test(cleanEmail))return alert("Please enter a valid email address, for example name@gmail.com.");if(!cleanEmail.endsWith("@gmail.com"))return alert("Please use a valid Gmail address ending in @gmail.com.");try{await db.collection("signupRequests").add({email:cleanEmail,createdAt:firebase.firestore.FieldValue.serverTimestamp(),status:"pending"});alert("Your account request has been sent.")}catch(e){alert(e.message)}};

auth.onAuthStateChanged(async user=>{
if(user){currentUser=user;$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");await createProfile();await loadUsers();showPage("camera");startCamera()}
else{currentUser=null;$("loginScreen").classList.remove("hidden");$("app").classList.add("hidden");stopCamera()}
});

async function createProfile(){
const ref=db.collection("users").doc(currentUser.uid),snap=await ref.get();
if(!snap.exists)await ref.set({uid:currentUser.uid,displayName:currentUser.displayName||"VibeSnap User",email:currentUser.email||"",phone:currentUser.phoneNumber||"",photoURL:currentUser.photoURL||"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
$("profileName").textContent=currentUser.displayName||"VibeSnap User";
$("profileEmail").textContent=currentUser.email||currentUser.phoneNumber||"";
$("profileAvatar").textContent=(currentUser.displayName||currentUser.email||"U").charAt(0).toUpperCase();
}

function showPage(page){
["cameraPage","friendsPage","chatPage","profilePage"].forEach(id=>$(id).classList.add("hidden"));
document.querySelectorAll(".navBtn").forEach(btn=>btn.classList.remove("active"));
const map={camera:"cameraPage",friends:"friendsPage",chat:"chatPage",profile:"profilePage"};
$(map[page]).classList.remove("hidden");
document.querySelector('[data-page="'+page+'"]').classList.add("active");
if(page==="camera")startCamera();else stopCamera();
}
document.querySelectorAll(".navBtn").forEach(btn=>btn.onclick=()=>showPage(btn.dataset.page));

async function startCamera(){
stopCamera();
try{currentStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facingMode},audio:true});$("cameraVideo").srcObject=currentStream;applyFilter()}
catch(e){console.error(e);alert("Camera permission is required for VibeSnap Camera.")}
}
function stopCamera(){if(currentStream){currentStream.getTracks().forEach(t=>t.stop());currentStream=null}if($("cameraVideo"))$("cameraVideo").srcObject=null}
$("flipCamera").onclick=()=>{facingMode=facingMode==="user"?"environment":"user";startCamera()};
function applyFilter(){$("cameraVideo").style.filter=filterCSS[currentFilter]}
document.querySelectorAll(".lensItem").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".lensItem").forEach(b=>b.classList.remove("active"));btn.classList.add("active");currentFilter=btn.dataset.filter;applyFilter()});
$("profileQuick").onclick=()=>showPage("profile");
$("addFriendQuick").onclick=()=>showPage("friends");
$("notificationQuick").onclick=()=>alert("No new VibeSnap notifications.");
$("searchQuick").onclick=()=>alert("VibeSnap search is coming soon.");
$("flashQuick").onclick=()=>alert("Flash control will be available on supported cameras.");
$("soundQuick").onclick=()=>alert("Sounds are currently on.");
$("moreCameraTools").onclick=()=>document.querySelector(".lensStrip").classList.toggle("hidden");
$("aiQuick").onclick=()=>alert("Vibe AI is coming soon.");
$("memoriesQuick").onclick=()=>$("galleryBtn").click();

$("captureBtn").onclick=async()=>{
if(!currentStream)await startCamera();
const video=$("cameraVideo"),canvas=document.createElement("canvas");canvas.width=video.videoWidth;canvas.height=video.videoHeight;const ctx=canvas.getContext("2d");ctx.filter=filterCSS[currentFilter];
if(facingMode==="user"){ctx.translate(canvas.width,0);ctx.scale(-1,1)}
ctx.drawImage(video,0,0,canvas.width,canvas.height);
canvas.toBlob(blob=>{currentMediaBlob=blob;currentMediaType="image";$("previewMedia").src=URL.createObjectURL(blob);$("previewMedia").controls=false;$("previewModal").classList.remove("hidden")},"image/jpeg",.92);
};

$("videoModeBtn").onclick=()=>mediaRecorder?stopRecording():startRecording();
function startRecording(){
if(!currentStream)return alert("Camera is not ready.");recordedChunks=[];
try{
const canvas=document.createElement("canvas"),video=$("cameraVideo");canvas.width=video.videoWidth||1280;canvas.height=video.videoHeight||720;const ctx=canvas.getContext("2d");
const drawFrame=()=>{if(!mediaRecorder||mediaRecorder.state!=="recording")return;ctx.filter=filterCSS[currentFilter];if(facingMode==="user"){ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,canvas.width,canvas.height);ctx.restore()}else ctx.drawImage(video,0,0,canvas.width,canvas.height);requestAnimationFrame(drawFrame)};
const videoStream=canvas.captureStream(30);currentStream.getAudioTracks().forEach(t=>videoStream.addTrack(t));
let options={};if(MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus"))options.mimeType="video/webm;codecs=vp9,opus";else if(MediaRecorder.isTypeSupported("video/webm"))options.mimeType="video/webm";
mediaRecorder=new MediaRecorder(videoStream,options);
mediaRecorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data)};
mediaRecorder.onstop=()=>{const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||"video/webm"});currentMediaBlob=blob;currentMediaType="video";$("previewMedia").src=URL.createObjectURL(blob);$("previewMedia").controls=true;$("previewModal").classList.remove("hidden");mediaRecorder=null;$("videoModeBtn").textContent="🎥";$("videoModeBtn").classList.remove("recording")};
mediaRecorder.start();$("videoModeBtn").textContent="⏹️";$("videoModeBtn").classList.add("recording");drawFrame();
}catch(e){console.error(e);alert("Video recording is not supported on this browser.")}
}
function stopRecording(){if(mediaRecorder&&mediaRecorder.state==="recording")mediaRecorder.stop()}

$("retakeBtn").onclick=()=>{$("previewModal").classList.add("hidden");currentMediaBlob=null;currentMediaType=null;startCamera()};
$("sendMediaBtn").onclick=async()=>{
if(!currentMediaBlob)return;
if(!selectedFriend){const uid=$("recipientSelect").value;if(uid){const snap=await db.collection("users").doc(uid).get();if(snap.exists)selectedFriend={uid:snap.id,...snap.data()}}}
if(!selectedFriend)return alert("Select a friend first.");
try{
$("sendMediaBtn").disabled=true;const chatId=getChatId(currentUser.uid,selectedFriend.uid);await ensureChat(chatId,selectedFriend.uid);
const extension=currentMediaType==="image"?"jpg":"webm",messageRef=db.collection("chats").doc(chatId).collection("messages").doc(),path=`chatMedia/${chatId}/${messageRef.id}.${extension}`,uploadRef=storage.ref().child(path);
await uploadRef.put(currentMediaBlob);const mediaUrl=await uploadRef.getDownloadURL();
await messageRef.set({senderUid:currentUser.uid,receiverUid:selectedFriend.uid,type:currentMediaType,text:"",mediaUrl,storagePath:path,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
$("previewModal").classList.add("hidden");currentMediaBlob=null;alert("Media sent!")
}catch(e){console.error(e);alert("Could not send media: "+e.message)}finally{$("sendMediaBtn").disabled=false}
};
$("galleryBtn").onclick=()=>$("galleryInput").click();
$("galleryInput").onchange=e=>{const file=e.target.files[0];if(!file)return;currentMediaBlob=file;currentMediaType=file.type.startsWith("video")?"video":"image";$("previewMedia").src=URL.createObjectURL(file);$("previewMedia").controls=currentMediaType==="video";$("previewModal").classList.remove("hidden")};

let usersCache=[];
async function loadUsers(){
db.collection("users").onSnapshot(snapshot=>{
usersCache=[];$("usersList").innerHTML="";$("recipientSelect").innerHTML='<option value="">Select friend to send to</option>';
snapshot.forEach(doc=>{if(doc.id===currentUser.uid)return;const user={uid:doc.id,...doc.data()};usersCache.push(user);addUserCard(user);const option=document.createElement("option");option.value=user.uid;option.textContent=user.displayName||user.email||"VibeSnap User";$("recipientSelect").appendChild(option)})
})
}
function addUserCard(user){
const card=document.createElement("div");card.className="userCard";const name=user.displayName||user.email||"VibeSnap User";
card.innerHTML=`<div class="avatar">${name.charAt(0).toUpperCase()}</div><div class="userInfo"><div class="userName">${escapeHTML(name)}</div><div class="userEmail">${escapeHTML(user.email||"")}</div></div><button class="chatOpenBtn">Chat</button>`;
card.querySelector(".chatOpenBtn").onclick=()=>openChat(user);$("usersList").appendChild(card)
}
$("recipientSelect").onchange=async()=>{const uid=$("recipientSelect").value;selectedFriend=uid?usersCache.find(u=>u.uid===uid):null};

function getChatId(uid1,uid2){return[uid1,uid2].sort().join("_")}
async function ensureChat(chatId,friendUid){await db.collection("chats").doc(chatId).set({members:[currentUser.uid,friendUid],updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}
async function openChat(user){
selectedFriend=user;$("recipientSelect").value=user.uid;$("chatName").textContent=user.displayName||user.email||"VibeSnap User";$("chatAvatar").textContent=(user.displayName||user.email||"U").charAt(0).toUpperCase();showPage("chat");
const chatId=getChatId(currentUser.uid,user.uid);await ensureChat(chatId,user.uid);loadMessages(chatId)
}
function loadMessages(chatId){
if(currentChatUnsubscribe)currentChatUnsubscribe();
currentChatUnsubscribe=db.collection("chats").doc(chatId).collection("messages").orderBy("createdAt").onSnapshot(snapshot=>{
$("chatMessages").innerHTML="";
snapshot.forEach(doc=>{const message=doc.data(),box=document.createElement("div");box.className="message "+(message.senderUid===currentUser.uid?"mine":"theirs");
if(message.type==="image")box.innerHTML=`<img src="${message.mediaUrl}" alt="Photo">`;else if(message.type==="video")box.innerHTML=`<video src="${message.mediaUrl}" controls></video>`;else box.textContent=message.text||"";
$("chatMessages").appendChild(box)});
$("chatMessages").scrollTop=$("chatMessages").scrollHeight
})
}
$("sendMessage").onclick=sendTextMessage;
$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendTextMessage()});
async function sendTextMessage(){
const text=$("messageInput").value.trim();if(!text||!selectedFriend)return;
try{const chatId=getChatId(currentUser.uid,selectedFriend.uid);await ensureChat(chatId,selectedFriend.uid);await db.collection("chats").doc(chatId).collection("messages").add({senderUid:currentUser.uid,receiverUid:selectedFriend.uid,type:"text",text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});$("messageInput").value=""}catch(e){alert(e.message)}
}
$("backFromChat").onclick=()=>showPage("camera");
$("logoutBtn").onclick=async()=>{stopCamera();if(currentChatUnsubscribe){currentChatUnsubscribe();currentChatUnsubscribe=null}await auth.signOut()};
function escapeHTML(text){return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
</script>
</body>
